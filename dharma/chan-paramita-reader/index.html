le color or element expanded, starting from an object the size of a blade of grass, until it fills the entire visualized world without moving. Totality-entries are the further refinement of causing multiple totalities to interpenetrate (e.g. seeing yellow, red, and white all present within blue-green) without destroying each other's own mark. The one dharma-gate in this fascicle not given a separate \"approach to the path\" treatment, since śrāvaka tradition treats it chiefly as a method for supernormal powers.","first":1},{"id":"g183","zh":"六神通","en":"the six supernormal powers","def":"The heavenly eye, heavenly ear, knowledge of others' minds, knowledge of past lives, mastery over the body at will, and the power of exhausting the contaminants (天眼/天耳/他心/宿命/如意/漏盡通). Obtained through one of three causes: retribution (past merit), spontaneous arising (through deep concentration alone), or deliberate cultivation (directly severing the specific ignorance blocking each power).","first":2},{"id":"g184","zh":"十四變化","en":"the fourteen transformations","def":"Each dhyāna stage (first through fourth) transforming into itself and into every stage below it, but never upward — yielding 2 + 3 + 4 + 5 = 14 transformations in total. The treatise explicitly declines to explain the mechanism further, calling the matter too subtle for \"mere written words.\"","first":4},{"id":"g185","zh":"三三昧","en":"the three samadhis","def":"The samādhi possessing initial thought and sustained reflection / without initial thought but with sustained reflection / without either (有覺有觀/無覺有觀/無覺無觀三昧) — not a separate practice but the entire preceding catalog of dhyānas sorted into three bins by which of these two factors is present. Etymology given for samādhi itself: \"the place where the mind moves correctly,\" a naturally crooked mind straightened the way a snake is straightened by entering a bamboo tube.","first":6},{"id":"g186","zh":"大力阿羅漢","en":"the great-strength arhat","def":"The non-destructive path's own culminating fruit: liberation-in-both-respects (phenomena and principle both complete), complete with the three insights, six supernormal powers, and eight liberations — contrasted with the destructive path's arhat of fascicle 9, complete instead with the two kinds of nirvāṇa alone.","first":74},{"id":"g187","zh":"二十五三昧 / 禪波羅蜜滿","en":"the twenty-five samadhis / the fulfillment of the dhyāna-pāramitā","def":"The bodhisattva's own culminating attainment, breaking through the twenty-five states of existence, abiding in the king of samādhis — the treatise's own closing image for what the entire ten-fascicle project has been building toward.","first":82}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const DAYS = DATA.days, FAS = DATA.fascicles, GL = Object.fromEntries(DATA.glossary.map(g => [g.id, g]));
const CN = '一二三四五六七八九十';
const KEY = 'chan-reader-v1';
const store = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
store.done ||= {}; store.quiz ||= {}; store.fs ||= 1; store.mode ||= 'both';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = s => document.querySelector(s);
const setFs = () => document.documentElement.style.setProperty('--fs', store.fs);
setFs();
$('#fsm').onclick = () => { store.fs = Math.max(.85, +(store.fs - .1).toFixed(2)); setFs(); save(); };
$('#fsp').onclick = () => { store.fs = Math.min(1.5, +(store.fs + .1).toFixed(2)); setFs(); save(); };
$('#back').onclick = () => history.length > 1 ? history.back() : (location.hash = '#/');
const nextDay = () => DAYS.find(d => !store.done[d.id]) || DAYS[DAYS.length - 1];
const mins = d => Math.max(10, Math.round((d.stats.zh / 300 + d.stats.en / 200) / 5) * 5);

function home() {
  const n = DAYS.filter(d => store.done[d.id]).length, nx = nextDay();
  return `<section class="hero">
    <div class="kicker">釋禪波羅蜜次第法門 · Chinese–English</div>
    <h2>The Sequential Dharma-Gates of Dhyāna-Pāramitā</h2>
    <div class="zh">智者大師《釋禪波羅蜜次第法門》中英對讀</div>
    <p class="lede">Zhiyi's great manual of meditation, read a little each day: the Chinese text first, the Ru-Yi English translation below it.</p>
    <div class="progress"><i style="width:${100 * n / DAYS.length}%"></i></div>
    <div class="meta">${n} of ${DAYS.length} readings done · ${DAYS.reduce((a, d) => a + d.qn, 0)} review questions</div>
    <p style="margin-top:14px"><a class="btn" href="#/day/${nx.id}">${n ? 'Continue' : 'Start'}: Day ${nx.id}</a></p>
  </section>
  ${FAS.map(f => {
    const ds = DAYS.filter(d => d.fascicle === f.n), k = ds.filter(d => store.done[d.id]).length;
    const open = nx.fascicle === f.n;
    return `<details class="fas"${open ? ' open' : ''}><summary>
      <span class="fn">卷${CN[f.n - 1]}</span>
      <span style="flex:1;min-width:0"><div class="ft">Fascicle ${f.n}: ${E(f.title)}</div>
      <div class="fs2">Days ${ds[0].id}–${ds[ds.length - 1].id} · ${k}/${ds.length} read</div>
      <div class="mini"><i style="width:${100 * k / ds.length}%"></i></div></span><span class="chev">›</span></summary>
      <p class="blurb">${E(f.blurb)}</p>
      <ul class="list">${ds.map(d => `<li class="${store.done[d.id] ? 'done' : d === nx ? 'next' : ''}"><a href="#/day/${d.id}">
        <span class="num">${store.done[d.id] ? '✓' : d.id}</span>
        <span><div class="t">${E(d.title)}</div><div class="s">${d.secs} · about ${mins(d)} min${d.qn ? ` · ${store.quiz[d.id] ? 'review ' + store.quiz[d.id] : d.qn + (d.qn === 1 ? ' question' : ' questions')}` : ''}</div></span></a></li>`).join('')}</ul>
    </details>`; }).join('')}
  <p class="foot">Your progress is saved on this device only. Chinese text: CBETA T46 no. 1916. English: Ru-Yi Meditation Center.</p>`;
}

function rowHtml(it) {
  return `<div class="pair"><div class="zh"><span class="ln">原文</span>${it.zh.map(p => `<p>${p}</p>`).join('')}</div>
    <div class="en"><span class="ln">English</span>${it.en.map(p => `<p>${p}</p>`).join('')}</div></div>`;
}

function day(id) {
  const d = DAYS.find(x => x.id === +id);
  if (!d) return '<p>Not found.</p>';
  const k = DAYS.indexOf(d), f = FAS[d.fascicle - 1];
  let h = `<section class="hero"><div class="kicker">Day ${d.id} · Fascicle ${d.fascicle} · ${d.secs}</div>
    <h2>${E(d.title)}</h2><div class="zh">${E(d.zh_title)}</div>
    <div class="meta">About ${mins(d)} minutes · ${d.stats.zh.toLocaleString('en-US')} Chinese characters · ${d.stats.en.toLocaleString('en-US')} English words</div>
    <div class="toggle" role="group" aria-label="Show">${[['both', 'Chinese + English'], ['en', 'English only'], ['zh', 'Chinese only']].map(([m, t]) => `<button data-m="${m}" class="${store.mode === m ? 'on' : ''}">${t}</button>`).join('')}</div></section>
    <div id="text" class="${store.mode === 'en' ? 'hide-zh' : store.mode === 'zh' ? 'hide-en' : ''}">`;
  let lastParent = null;
  d.items.forEach(it => {
    if (it.kind === 'sec') {
      const up = it.parent && JSON.stringify(it.parent) !== lastParent ? `<div class="up">${E(it.parent[0])} <span>${E(it.parent[1])}</span></div>` : '';
      if (it.parent) lastParent = JSON.stringify(it.parent);
      h += `<div class="sechead">${up}<h3><span class="no">§${it.num}</span>${E(it.en)}${it.cont ? ' <span class="muted">(continued)</span>' : ''}${it.zh ? `<small>${E(it.zh)}</small>` : ''}</h3></div>`;
      if (it.intro && it.intro.length) h += `<div class="intro">${it.intro.map(p => `<p style="margin:0 0 .5em">${p}</p>`).join('')}</div>`;
    } else if (it.kind === 'row') h += rowHtml(it);
    else if (it.kind === 'note') h += `<details class="note"><summary>Reading note</summary><div class="prose">${it.en.map(p => `<p>${p}</p>`).join('')}</div></details>`;
    else if (it.kind === 'prose') h += `<div class="intro">${it.en.map(p => `<p style="margin:0 0 .5em">${p}</p>`).join('')}</div>`;
  });
  h += '</div>';
  const terms = DATA.glossary.filter(g => g.first === d.id);
  if (terms.length) h += `<div class="sechead"><h3>Terms first met today</h3></div><div class="chips">${terms.map(g => `<a class="chip" href="#/term/${g.id}"><b>${E(g.zh)}</b>${E(g.en)}</a>`).join('')}</div>`;
  if (d.quiz.length) {
    h += `<details class="quiz" id="quiz"><summary>Check yourself <span>${d.quiz.length} question${d.quiz.length === 1 ? '' : 's'}${store.quiz[d.id] ? ' · last ' + store.quiz[d.id] : ''} ›</span></summary>` +
      d.quiz.map((q, i) => `<div class="q" data-a="${q.answer}">
      <p><b>${i + 1}.</b> ${E(q.q)}</p>${q.options.map((o, j) => `<button class="opt" data-j="${j}"><i>${'ABCD'[j]}</i><span>${E(o)}</span></button>`).join('')}
      <div class="why">${E(q.why)}<span class="src">${E(q.src)}</span></div></div>`).join('') + `<div class="score" id="score"></div></details>`;
  }
  h += `<p style="margin-top:22px"><button class="btn ${store.done[d.id] ? 'ghost' : ''}" id="markdone">${store.done[d.id] ? '✓ Read · mark as unread' : 'Mark today as read'}</button></p>
    <div class="navrow">${k > 0 ? `<a class="btn ghost" href="#/day/${DAYS[k - 1].id}">‹ Day ${DAYS[k - 1].id}</a>` : '<span></span>'}
    ${k < DAYS.length - 1 ? `<a class="btn ghost" href="#/day/${DAYS[k + 1].id}">Day ${DAYS[k + 1].id} ›</a>` : ''}</div>
    <p class="meta">Whole fascicle on the Ru-Yi site: <a href="/sutras/shi-chan-boluomi/fascicle-${String(d.fascicle).padStart(3, '0')}/">Fascicle ${d.fascicle}: ${E(f.title)}</a></p>
    <p class="foot">Chinese: CBETA T46 no. 1916 (non-commercial use). English translation and reading notes: Ru-Yi Meditation Center.</p>`;
  return h;
}

function wireDay(id) {
  const d = DAYS.find(x => x.id === +id);
  const b = $('#markdone');
  if (b) b.onclick = () => {
    store.done[d.id] = !store.done[d.id]; save();
    if (store.done[d.id]) { b.classList.add('done-burst'); setTimeout(() => location.hash = '#/', 380); } else render();
  };
  document.querySelectorAll('.toggle button').forEach(t => t.onclick = () => {
    store.mode = t.dataset.m; save();
    $('#text').className = store.mode === 'en' ? 'hide-zh' : store.mode === 'zh' ? 'hide-en' : '';
    document.querySelectorAll('.toggle button').forEach(x => x.classList.toggle('on', x === t));
  });
  let right = 0, seen = 0;
  document.querySelectorAll('.q').forEach(q => q.querySelectorAll('.opt').forEach(o => o.onclick = () => {
    if (q.classList.contains('answered')) return;
    q.classList.add('answered');
    const a = +q.dataset.a, j = +o.dataset.j;
    q.querySelectorAll('.opt')[a].classList.add('right');
    if (j !== a) o.classList.add('wrong'); else right++;
    seen++;
    if (seen === d.quiz.length) { store.quiz[d.id] = `${right}/${seen}`; save(); $('#score').textContent = `You got ${right} of ${seen}.`; }
  }));
}

let gfilter = 'all';
function glossary(q = '') {
  return `<section class="hero"><div class="kicker">Glossary · 名相</div><h2>Terms</h2>
    <p class="lede">${DATA.glossary.length} terms from the Ru-Yi translation notes, with the English rendering used throughout. Tap a term for the note and where it first appears.</p></section>
    <input class="search" id="gq" type="search" placeholder="Search Chinese or English" value="${E(q)}" autocomplete="off">
    <div class="filters">${[['all', 'All'], ['met', 'Met so far']].map(([k, t]) => `<button data-f="${k}" class="${gfilter === k ? 'on' : ''}">${t}</button>`).join('')}</div>
    <div id="glist"></div>`;
}
function glist(q) {
  const strip = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const s = strip(q.trim());
  const items = DATA.glossary.filter(g => {
    if (gfilter === 'met' && !(g.first && store.done[g.first])) return false;
    return !s || [g.zh, g.en, g.def].some(f => f && strip(f).includes(s));
  });
  $('#glist').innerHTML = items.length ? items.map(g => `<a class="term" href="#/term/${g.id}"><div class="h"><b>${E(g.zh)}</b><span>${E(g.en)}</span></div><div class="p">${E(g.def)}</div></a>`).join('') : '<p class="muted">No matching terms.</p>';
}
function term(id) {
  const g = GL[id]; if (!g) return '<p>Not found.</p>';
  const f = g.first ? DAYS.find(d => d.id === g.first) : null;
  return `<div class="card"><div class="big">${E(g.zh)}</div>
    <dl><dt>English</dt><dd>${E(g.en)}</dd>
    ${g.def ? `<dt>Note</dt><dd>${E(g.def)}</dd>` : ''}
    <dt>First appears</dt><dd>${f ? `<a href="#/day/${f.id}">Day ${f.id} · ${E(f.title)}</a>` : '<span class="muted">Named in the translation notes; not found word-for-word in the text.</span>'}</dd></dl></div>
    <p><a class="btn ghost" href="#/glossary">‹ All terms</a></p>`;
}

function about() {
  return `<section class="hero"><div class="kicker">About this reader</div><h2>How to use it</h2></section>
  <div class="box prose">
    <p><b>The text.</b> <i>Explaining the Sequential Dharma-Gates of Dhyāna-Pāramitā</i> (釋禪波羅蜜次第法門, T46 no. 1916) was spoken by the Great Master Zhiyi (智顗, 538–597), founder of the Tiantai school, recorded by his disciple Fashen, and revised by Guanding. It lays out meditation as a pāramitā to be walked step by step: why we practice, the preliminary conditions, the four dhyānas, the immeasurable minds and formless concentrations, the six wondrous gates, the sixteen special excellences, and the world-transcending contemplations.</p>
    <p><b>The layout.</b> Each reading gives the Chinese first and the English below it, paragraph by paragraph, so the eye can move between them. Use the buttons at the top of a reading to show only the English or only the Chinese. A− and A+ change the text size.</p>
    <p><b>The pace.</b> The ten fascicles are divided into ${DAYS.length} readings of about twenty minutes each. Reading notes from the Ru-Yi translators are folded under each passage; open them when you want them.</p>
    <p><b>Review.</b> Most readings end with multiple-choice questions on what the text itself says. Mark a reading as done and the Continue button will take you to the next one.</p>
  </div>
  <div class="box prose"><h3>Sources</h3>
    <p>Chinese text: CBETA, Taishō vol. 46, no. 1916, used for non-commercial study. English translation and reading notes: Ru-Yi Meditation Center, <a href="/sutras/shi-chan-boluomi/">ruyimeditation.org/sutras/shi-chan-boluomi/</a>. For the wider Tiantai library, see <a href="/dharma/tiantai/">Tiantai: A Reading Path</a>.</p>
    <p>The translation is a work in progress, and comments are welcome. Your progress stays on this device; nothing is sent anywhere.</p>
  </div>
  <p class="foot">Prepared by Ru-Yi Meditation Center.</p>`;
}

function render() {
  const [p, a] = location.hash.replace(/^#\/?/, '').split('/');
  let html = '', title = 'Dhyāna-Pāramitā Reader';
  ['n-home', 'n-today', 'n-gloss', 'n-about'].forEach(x => $('#' + x).classList.remove('on'));
  $('#back').hidden = !p;
  if (!p) { html = home(); $('#n-home').classList.add('on'); }
  else if (p === 'today') { location.replace('#/day/' + nextDay().id); return; }
  else if (p === 'day') {
    const dm = DAYS.find(d => d.id === +a);
    if (dm && !dm.items) {
      $('#view').innerHTML = '<p class="muted" style="padding:40px 0">Loading…</p>';
      fetch(`data/d${dm.id}.json`).then(r => r.json()).then(full => { Object.assign(dm, full); render(); })
        .catch(() => { $('#view').innerHTML = '<p class="muted" style="padding:40px 0">This reading could not be loaded. Check your connection and try again.</p>'; });
      return;
    }
    html = day(a); title = `Day ${a}`; $('#n-today').classList.add('on');
  }
  else if (p === 'glossary') { html = glossary(decodeURIComponent(a || '')); title = 'Glossary'; $('#n-gloss').classList.add('on'); }
  else if (p === 'term') { html = term(a); title = 'Glossary'; $('#n-gloss').classList.add('on'); }
  else if (p === 'about') { html = about(); title = 'About'; $('#n-about').classList.add('on'); }
  const v = $('#view'); v.style.animation = 'none'; v.offsetHeight; v.style.animation = '';
  v.innerHTML = html; $('#title').textContent = title;
  window.scrollTo(0, 0);
  if (p === 'day') wireDay(a);
  if (p === 'glossary') {
    const q = $('#gq'); glist(q.value);
    q.oninput = () => glist(q.value);
    document.querySelectorAll('.filters button').forEach(btn => btn.onclick = () => { gfilter = btn.dataset.f; document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('on', x === btn)); glist(q.value); });
  }
  onScroll();
}
function onScroll() {
  const onDay = location.hash.startsWith('#/day/');
  const max = document.documentElement.scrollHeight - innerHeight;
  $('#readbar').style.width = onDay && max > 0 ? `${Math.min(100, 100 * scrollY / max)}%` : '0';
}
addEventListener('scroll', onScroll, {passive: true});
addEventListener('hashchange', render);
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
