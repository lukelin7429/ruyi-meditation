<!doctype html>
<html lang="en-US">
<head>

<title>Dhyāna-Pāramitā Reader</title>

<style>
:root{
  --paper:#f8f5ee;--card:#fffefa;--wash:#eef1ea;--ink:#1f2420;--muted:#5f675f;--line:#dde3d8;
  --accent:#2f5d50;--accent-2:#24493f;--terra:#a2482a;--gold:#b98a2e;
  --zh:'Songti TC','STSong','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',serif;
  --zh-ui:'PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;
  --en:Georgia,'Iowan Old Style','Times New Roman',serif;
  --ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --fs:1;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#161a18;--card:#1f2421;--wash:#252c28;--ink:#e9ede6;--muted:#a3ada4;--line:#333b36;
  --accent:#8cc4b0;--accent-2:#a9d6c5;--terra:#e08f6f;--gold:#d8b15e;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);line-height:1.5;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:8px;min-height:52px}
header.top h1{font:600 1rem/1.2 var(--ui);margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readbar{position:absolute;left:0;bottom:-1px;height:2px;background:var(--gold);width:0;transition:width .1s linear}
.iconbtn{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{flex:1;text-align:center;padding:10px 4px 9px;text-decoration:none;color:var(--muted);font-size:.78rem;font-weight:600;transition:color .2s}
nav.bottom a.on{color:var(--accent)}
nav.bottom b{display:block;font-size:1.15rem;line-height:1.15}
#view{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#view{animation:none}.readbar{transition:none}}
.hero{padding:22px 0 14px}
.kicker{font:700 .74rem/1.3 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--terra)}
.hero h2{font:700 calc(1.6rem*var(--fs))/1.2 var(--en);margin:8px 0 4px}
.hero .zh{font:500 calc(1.05rem*var(--fs))/1.5 var(--zh-ui);color:var(--accent)}
.meta{color:var(--muted);font-size:.86rem;margin-top:8px}
.lede{font:calc(1.02rem*var(--fs))/1.65 var(--en);color:var(--muted);margin:10px 0 0}
.progress{height:6px;border-radius:99px;background:var(--wash);overflow:hidden;margin:14px 0 4px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .6s ease}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;text-decoration:none;cursor:pointer;transition:transform .12s,opacity .2s}
@media (prefers-color-scheme:dark){.btn{color:#10201a}}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--accent)}
.fas{border:1px solid var(--line);border-radius:14px;background:var(--card);margin:12px 0;overflow:hidden}
.fas summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center}
.fas summary::-webkit-details-marker{display:none}
.fas .fn{flex:0 0 46px;height:46px;border-radius:12px;background:var(--wash);display:grid;place-items:center;font:600 .95rem var(--zh-ui);color:var(--accent)}
.fas .ft{font:600 1rem/1.3 var(--en)}
.fas .fs2{font-size:.8rem;color:var(--muted);margin-top:3px}
.fas .mini{height:4px;border-radius:9px;background:var(--wash);margin-top:7px;overflow:hidden}
.fas .mini i{display:block;height:100%;background:var(--accent)}
.fas .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.fas[open] .chev{transform:rotate(90deg)}
.fas .blurb{padding:0 16px 6px;margin:0;font:.93rem/1.55 var(--en);color:var(--muted)}
.list{list-style:none;margin:0;padding:0 8px 8px}
.list li a{display:flex;gap:12px;align-items:center;padding:11px 8px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.list .num{flex:0 0 38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font:700 .85rem var(--ui);color:var(--accent);font-variant-numeric:tabular-nums}
.list .done .num{background:var(--accent);border-color:var(--accent);color:var(--card)}
.list .next .num{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent)}
.list .t{font:600 .96rem/1.3 var(--en)}
.list .s{font-size:.78rem;color:var(--muted);margin-top:2px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.box h3{margin:0 0 6px;font:700 .78rem/1.3 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--terra)}
.prose p,.prose li{font:calc(1.04rem*var(--fs))/1.72 var(--en)}
.prose p{margin:0 0 .8em}.prose p:last-child{margin-bottom:0}
.sechead{margin:30px 0 10px}
.sechead .up{font:600 .74rem/1.4 var(--ui);letter-spacing:.06em;color:var(--muted)}
.sechead .up span{font-family:var(--zh-ui);letter-spacing:0}
.sechead h3{margin:4px 0 0;font:700 calc(1.15rem*var(--fs))/1.35 var(--en)}
.sechead h3 small{display:block;font:500 calc(.98rem*var(--fs))/1.5 var(--zh-ui);color:var(--accent);margin-top:2px}
.sechead .no{display:inline-block;font:700 .72rem/1 var(--ui);color:var(--card);background:var(--accent);border-radius:6px;padding:4px 6px;margin-right:6px;vertical-align:2px}
.intro{font:italic calc(1rem*var(--fs))/1.65 var(--en);color:var(--muted);border-left:3px solid var(--line);padding-left:12px;margin:8px 0 12px}
.pair{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:10px 0}
.pair .zh{background:var(--wash);padding:14px 16px;font:calc(1.22rem*var(--fs))/1.95 var(--zh);letter-spacing:.02em}
.pair .en{padding:14px 16px;font:calc(1.05rem*var(--fs))/1.72 var(--en)}
.pair p{margin:0}.pair p+p{margin-top:.7em}
.ln{display:block;font:600 .68rem/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.hide-en .pair .en{display:none}.hide-zh .pair .zh{display:none}
details.note{background:color-mix(in srgb,var(--gold) 9%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));border-radius:14px;margin:10px 0;padding:0 16px}
details.note summary{list-style:none;cursor:pointer;min-height:46px;display:flex;align-items:center;gap:8px;color:var(--terra);font:600 .9rem/1.3 var(--ui)}
details.note summary::-webkit-details-marker{display:none}
details.note summary::before{content:"▸";transition:transform .2s}
details.note[open] summary::before{transform:rotate(90deg)}
details.note .prose{padding-bottom:14px}
.toggle{display:flex;gap:6px;margin:6px 0 0;flex-wrap:wrap}
.toggle button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;font-size:.82rem}
.toggle button.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
details.quiz{margin:26px 0 10px}
details.quiz>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font:700 1rem var(--ui)}
details.quiz>summary::-webkit-details-marker{display:none}
details.quiz>summary span{font:500 .82rem var(--ui);color:var(--muted)}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.q p{margin:0 0 10px;font:calc(1.02rem*var(--fs))/1.6 var(--en)}
.q .opt{display:flex;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:6px 0;cursor:pointer;font:calc(.97rem*var(--fs))/1.45 var(--en);min-height:46px;transition:background .2s,border-color .2s}
.q .opt i{font-style:normal;font-weight:700;color:var(--muted);font-family:var(--ui)}
.q .opt.right{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.q .opt.wrong{border-color:var(--terra);background:color-mix(in srgb,var(--terra) 11%,transparent)}
.q .why{display:none;margin-top:10px;font:calc(.94rem*var(--fs))/1.6 var(--en);color:var(--muted)}
.q.answered .why{display:block;animation:fade .3s ease}
.q .src{display:block;font:.74rem var(--ui);margin-top:6px}
.score{font:600 .9rem var(--ui);color:var(--accent);margin:8px 2px}
.search{width:100%;font:1rem var(--ui);padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:48px}
.filters{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;font-size:.85rem}
.filters button.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
.term{display:block;padding:12px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.term .h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.term .h b{font:600 1.12rem var(--zh-ui)}
.term .h span{font-family:var(--en)}
.term .p{font-size:.86rem;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}
.card .big{font:600 1.9rem/1.25 var(--zh-ui)}
.card dl{margin:14px 0 0}
.card dt{font:700 .72rem/1.3 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--terra);margin-top:12px}
.card dd{margin:3px 0 0;font:1.02rem/1.6 var(--en)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:.86rem;text-decoration:none;color:var(--ink);min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip b{font:600 1rem var(--zh-ui)}
.muted{color:var(--muted)}
.foot{font-size:.75rem;color:var(--muted);margin:30px 0 10px;line-height:1.55}
.navrow{display:flex;justify-content:space-between;gap:10px;margin:24px 0}
.navrow .btn{flex:1;max-width:48%}
.fsz{display:flex;gap:6px}
.done-burst{animation:pop .4s ease}
@keyframes pop{50%{transform:scale(1.05)}}
</style>

title":"十一切處 · 階位 · 修證","secs":"§10","stats":{"zh":735,"en":902},"qn":5},{"id":80,"fascicle":10,"title":"The Function of Contemplative Dhyāna: The Six Supernormal Powers","zh_title":"觀禪功用 · 六神通","secs":"§11","stats":{"zh":1128,"en":1489},"qn":8},{"id":81,"fascicle":10,"title":"The Fourteen Transformations","zh_title":"十四變化","secs":"§12–13","stats":{"zh":1182,"en":1656},"qn":7},{"id":82,"fascicle":10,"title":"The Three Samādhis","zh_title":"三三昧 · 釋名 · 辯相 · 出生三昧","secs":"§14–15","stats":{"zh":1201,"en":1595},"qn":6},{"id":83,"fascicle":10,"title":"The Samādhi of Transcendence","zh_title":"超越三昧","secs":"§16–17","stats":{"zh":1066,"en":1270},"qn":3}],"glossary":[{"id":"g1","zh":"禪波羅蜜","en":"dhyāna-pāramitā","def":"The perfection of meditative absorption; kept transliterated rather than translated as \"the perfection of meditation,\" since \"dhyāna\" is already standard in English-language Buddhist writing and the text itself treats the term technically (see fascicle 1's own explanation of the name, topic 2).","first":1},{"id":"g2","zh":"十意","en":"the ten topics","def":"Zhiyi's own framing outline for the entire treatise, given in full at the opening of fascicle 1.","first":1},{"id":"g3","zh":"發菩提心 / 菩提心","en":"to give rise to the bodhi-mind / the bodhi-mind","def":"bodhicitta. Kept as \"the bodhi-mind\" rather than the fuller Sanskrit transliteration, matching plain-English usage elsewhere on this site.","first":2},{"id":"g4","zh":"四弘誓願","en":"the four universal vows","def":"The bodhisattva's four vows (to bring across all beings, sever all afflictions, master all dharma-gates, accomplish the unsurpassed buddha-path), mapped in this fascicle onto the Four Noble Truths.","first":2},{"id":"g5","zh":"四諦","en":"the Four Noble Truths","def":"Suffering (苦), accumulation (集), cessation (滅), and the path (道).","first":2},{"id":"g6","zh":"十波羅蜜","en":"the ten pāramitās","def":"The ten perfections (giving, precepts, patience, diligence, dhyāna, wisdom, skillful means, vow, power, wisdom [as a distinct tenth]) — this fascicle's argument is that cultivating dhyāna alone brings the other nine to completion.","first":3},{"id":"g7","zh":"六通","en":"the six supernormal powers","def":"ṣaḍabhijñā.","first":2},{"id":"g8","zh":"四辯","en":"the four unhindered eloquences","def":"pratisaṃvid — unhindered eloquence in dharma, meaning, language, and eloquence itself.","first":2},{"id":"g9","zh":"二乘","en":"the two [lesser] vehicles","def":"Śrāvakas and pratyekabuddhas, contrasted throughout with the bodhisattva's own motivation.","first":2},{"id":"g10","zh":"金剛三昧","en":"the vajra-samādhi","def":"The adamantine concentration described as the threshold to unsurpassed enlightenment.","first":2},{"id":"g11","zh":"無量義處三昧","en":"the samādhi of the place of measureless meanings","def":"無量義處三昧, the samādhi the Buddha is described entering in the *Lotus Sūtra*'s opening chapter; cited here as an example of dhyāna's completeness.","first":2},{"id":"g12","zh":"摩訶衍(論)","en":"the Mahāyāna [treatise]","def":"Zhiyi's own shorthand for the *Mahāprajñāpāramitā Śāstra* (大智度論), attributed to Nāgārjuna — already a translation project on this site at sutras/mahaprajnaparamita-sastra/. Render literally as \"the Mahāyāna [treatise]\" in translated prose per this fascicle's own citation style, since Zhiyi never spells out the full title inline.","first":1},{"id":"g13","zh":"大品經","en":"the Larger [Perfection of Wisdom] Sūtra","def":"The Pañcaviṃśatisāhasrikā Prajñāpāramitā Sūtra, Kumārajīva's translation — the sūtra the *Mahāprajñāpāramitā Śāstra* itself comments on.","first":1},{"id":"g14","zh":"纓絡經","en":"the Yingluo Sūtra","def":"菩薩瓔珞本業經, cited for its own mapping of the four vows onto the Four Noble Truths.","first":2},{"id":"g15","zh":"六情","en":"the six faculties of feeling","def":"The six sense-faculties, named here (topic 1) for their role in the perfection of moral discipline — \"closing off\" the six faculties of feeling to keep evil from entering.","first":3},{"id":"g16","zh":"天魔、外道","en":"heavenly demons, non-Buddhist paths","def":"A fixed pair recurring wherever the text names external obstacles to genuine practice, alongside \"the two [lesser] vehicles\" as an internal one.","first":3},{"id":"g17","zh":"事 / 理","en":"phenomenal conduct / principle","def":"A recurring conceptual pair from topic 2 onward: 事 for actual practice and activity, 理 for the underlying, unchanging truth that practice discloses. Keep this pairing consistent, since Zhiyi uses it repeatedly to sort different renderings of the same term.","first":1},{"id":"g18","zh":"九種大禪","en":"the nine kinds of great dhyāna","def":"Named in topic 2 as what only a bodhisattva's penetration of the middle-way buddha-nature produces; not yet reached in translation.","first":3},{"id":"g19","zh":"首楞嚴","en":"Śūraṅgama","def":"Left transliterated, per this site's existing convention at sutras/surangama-sutra/. Topic 2 names the Śūraṅgama samādhi as one of the rare states possessing dhyāna, concentration, samādhi, and pāramitā all at once.","first":4},{"id":"g20","zh":"波羅蜜","en":"pāramitā","def":"Left transliterated (rather than \"perfection\") when discussed as a term in its own right in topic 2's etymological discussion, matching the treatment of \"dhyāna\" itself.","first":1},{"id":"g21","zh":"涅槃經","en":"the Nirvāṇa Sūtra","def":"The *Mahāparinirvāṇa Sūtra*, cited in topic 2 for its \"five names of buddha-nature\" passage.","first":19},{"id":"g22","zh":"瑞應經","en":"the Sūtra of Auspicious Manifestations","def":"太子瑞應本起經, cited in topic 2 for its rendering of pāramitā as \"crossing to the limitless.\"","first":4},{"id":"g23","zh":"頓教","en":"the sudden teaching","def":"Cited in topic 2's closing argument that a bodhisattva's still-incomplete dhyāna can nonetheless be called pāramitā, since the sudden teaching holds the initial arising of the bodhi-mind and its ultimate completion to be, in the end, not two different things.","first":4},{"id":"g24","zh":"八背捨、八勝處、十一切處","en":"the eight liberations, the eight stations of mastery, the ten totality-bases","def":"A recurring set of named meditative attainments cited in topic 2 as states contained within, but not equal in status to, the four root dhyānas.","first":1},{"id":"g25","zh":"九次第定","en":"the nine sequential concentrations","def":"Another named set cited in topic 2's classification of dhyāna/concentration/samādhi/pāramitā.","first":1},{"id":"g26","zh":"名色","en":"name and form","def":"nāmarūpa. Used in topic 3 in a broader sense than its usual place in dependent origination — as shorthand for mind (\"name\") and body (\"form\") together, the basis for reducing every gate of practice to just three.","first":5},{"id":"g27","zh":"甘露門","en":"the gate to the deathless","def":"amṛta-dvāra. Topic 3's term for the two gates within the gate of form: the contemplation of impurity, and mindfulness of the breath.","first":5},{"id":"g28","zh":"不淨觀","en":"the contemplation of impurity","def":"aśubha-bhāvanā, one of the two gates of form named in topic 3.","first":5},{"id":"g29","zh":"阿那波那","en":"mindfulness of the breath","def":"ānāpāna(-smṛti); left partly transliterated on first use in topic 3, then rendered in full.","first":5},{"id":"g30","zh":"十六特勝","en":"the sixteen special excellences","def":"A named breath-based meditation scheme, listed in topic 3 among the attainments reached through the gate of the breath; not yet detailed in translation.","first":1},{"id":"g31","zh":"九想 / 八念 / 十想","en":"the nine contemplations / the eight recollections / the ten contemplations","def":"Named sets of contemplative practices within the gate of form, listed in topic 3; not yet detailed in translation.","first":1},{"id":"g32","zh":"師子奮迅（三昧）","en":"the lion's-sport samādhi","def":"Named in topics 2 and 3 among the most complete meditative attainments; not yet detailed in translation.","first":1},{"id":"g33","zh":"超越三昧","en":"the transcendence samādhi","def":"Named alongside the lion's-sport samādhi in topics 2 and 3; not yet detailed in translation.","first":1},{"id":"g34","zh":"自性禪","en":"the samādhi of self-nature","def":"Named in topic 3 among the great samādhis reached through the gate of mind.","first":5},{"id":"g35","zh":"清淨淨禪","en":"the pure-and-undefiled samādhi","def":"Named in topic 3 as the furthest attainment reached through the gate of mind.","first":5},{"id":"g36","zh":"出法攝心 / 滅法攝心 / 非出非滅法攝心","en":"gathering the mind through the dharma of emergence / of extinction / of neither","def":"The *Mahāsaṃnipāta Sūtra*'s own threefold naming of the three gates, quoted in topic 3 as a scriptural parallel to Zhiyi's own worldly / world-transcending / world-transcending-and-beyond division.","first":5},{"id":"g37","zh":"大集經","en":"the *Mahāsaṃnipāta Sūtra*","def":"Cited in topic 3 for the \"three kinds of gathering the mind\" and the three-part kalala description of conception.","first":5},{"id":"g38","zh":"請觀音經","en":"the *Sūtra of Invoking Avalokiteśvara*","def":"Cited in topic 3 as evidence that breath-practice extends to all three vehicles, not only ordinary practitioners.","first":5},{"id":"g39","zh":"毘尼","en":"the Vinaya","def":"Cited in topic 3 for the Buddha's sixteen practices of breath-observation taught to śrāvaka disciples.","first":5},{"id":"g40","zh":"十二門禪","en":"the twelve gates of dhyāna","def":"Topic 4's name for the contaminated (有漏) attainments: the four dhyānas, the four immeasurable minds, and the four formless bases.","first":6},{"id":"g41","zh":"六妙門","en":"the six wondrous gates","def":"Counting, following, stilling, contemplating, returning, and purifying — Zhiyi's own separate, shorter treatise (already published in English by Bhikshu Dharmamitra as *Six Dharma Gates to the Sublime*); named in topic 4 as both contaminated and uncontaminated dhyāna. See the source-and-copyright note above — translate independently, without reference to that edition.","first":1},{"id":"g42","zh":"通明觀","en":"the thorough-and-bright contemplation","def":"Named in topic 4 as a finer-grained companion practice to the sixteen special excellences.","first":6},{"id":"g43","zh":"觀、鍊、熏、修（禪）","en":"observing, refining, perfuming, and mastering (dhyāna)","def":"Topic 4's four-stage sequence of practice-conduct (行行次第) for working with uncontaminated dhyāna once concentration is established. Keep all four verbs fixed wherever this sequence recurs.","first":1},{"id":"g44","zh":"師子奮迅三昧","en":"the lion's-sport samādhi","def":"Identified in topic 4 with \"perfuming dhyāna\" (熏禪): cycling forward and backward through every dhyāna in sequence.","first":1},{"id":"g45","zh":"九種菩薩不共禪","en":"the bodhisattva's nine unshared dhyānas","def":"First fully listed in topic 4: 自性禪 (the samādhi of self-nature), 一切義禪 (of every meaning), 難禪 (the difficult samādhi), 一切門禪 (of every gate), 善人禪 (of the good person), 一切行禪 (of every practice), 除惱禪 (that removes affliction), 此世他世樂禪 (of joy in this life and lives to come), 清淨淨禪 (the pure-and-undefiled samādhi). Same set as the \"nine kinds of great dhyāna\" (九種大禪) named in topic 2; individual definitions not yet reached in translation.","first":null},{"id":"g46","zh":"三十七品","en":"the thirty-seven factors of enlightenment","def":"bodhipakṣa-dharma; cited in topic 4 as part of the śrāvaka's wisdom-conduct sequence.","first":6},{"id":"g47","zh":"十二因緣","en":"the twelve links of dependent origination","def":"Cited in topic 4 as the basis of the pratyekabuddha's own contemplation.","first":6},{"id":"g48","zh":"乾慧地、性地、八人地、見地、離欲地","en":"the ground of dry wisdom, the ground of conforming nature, the ground of the eighth-stage practitioner, the ground of vision, the ground free of desire","def":"The opening five of the \"common ten grounds\" (十地/共十地) shared across vehicles, quoted from the Larger Sūtra in topic 4; full definitions not yet reached in translation.","first":7},{"id":"g49","zh":"次第 / 非次第","en":"sequential / not sequential","def":"The governing pair for topic 4's closing fourfold classification (sequential, not sequential, sequential-then-not, not-sequential-then-sequential), applied to both the bodhisattva path and the śrāvaka path.","first":1},{"id":"g50","zh":"有漏 / 無漏 / 亦有漏亦無漏 / 非有漏非無漏","en":"contaminated / uncontaminated / both contaminated and uncontaminated / neither contaminated nor uncontaminated","def":"sāsrava / anāsrava. Topic 5's governing fourfold scheme, applied first to dharma (the object of practice), then to mind (the practicing subject). Keep all four terms fixed exactly as given here whenever this scheme recurs.","first":6},{"id":"g51","zh":"三漏","en":"the three contaminants","def":"The afflictions (kleśa) that \"contaminated\" (有漏) names the presence of; topic 5 does not itself enumerate all three, but the term recurs as the thing every uncontaminated practice is meant to sever.","first":7},{"id":"g52","zh":"四悉檀","en":"the four kinds of siddhānta","def":"Nāgārjuna's framework (via the *Mahāprajñāpāramitā Śāstra*) for why the same truth is taught differently depending on audience and occasion: the worldly siddhānta (世界悉檀), the siddhānta for the individual (為人悉檀), the siddhānta of the antidote (對治悉檀), and the siddhānta of ultimate meaning (第一義悉檀). Topic 5 matches each to one of the four dharma-mind categories.","first":34},{"id":"g53","zh":"因成假 / 相續假 / 相待假","en":"the provisional reality established by cause / by continuity / by mutual dependence","def":"Three distinct Tiantai lenses, invoked in topic 5's closing tetralemma analysis, for how something can seem to exist conventionally while having no fixed essence under any of the four classical alternatives (self, other, both, neither). Full treatment is deferred by the text itself to the *Mo-ho Chih-kuan* (《止觀》, the *Great Calming and Contemplation*) — a separate, much longer work of Zhiyi's, not currently a translation project on this site. Keep all three terms transliterated as given here if they recur.","first":10},{"id":"g54","zh":"自生 / 他生 / 共生 / 無因生","en":"self-arising / other-arising / joint arising / arising without cause","def":"The four alternatives Nāgārjuna's tetralemma tests and rejects in turn; topic 5 runs this exact pattern three times (against dharma-vs-mind, against arising-vs-ceasing, and against arising-vs-not-arising) to show that \"contaminated\" cannot be pinned down as a fixed, self-standing property.","first":10},{"id":"g55","zh":"假名","en":"provisional name","def":"prajñapti. Topic 5's conclusion about how dharma and mind can still be meaningfully distinguished even though neither is, under analysis, a fixed, findable thing.","first":10},{"id":"g56","zh":"摩訶止觀 / 止觀","en":"the *Great Calming and Contemplation*","def":"*Mo-ho Chih-kuan*, Zhiyi's other, much longer treatise on meditation — cited three times in topic 5 as the place where the \"provisional realities\" analysis is given in full. Distinct from the *Xiao Zhiguan* / *Concise Śamatha-Vipaśyanā* (小止觀), Zhiyi's third and shortest meditation manual — see the source-and-copyright note above regarding that separate, already-translated text.","first":null},{"id":"g57","zh":"前方便","en":"the preliminary expedient means","def":"Topic 6's own subject; opens into external (外方便) and internal (內方便) categories.","first":1},{"id":"g58","zh":"外方便 / 內方便","en":"external expedient means / internal expedient means","def":"External: methods of using the mind outside concentration. Internal: methods of using the mind within concentration.","first":1},{"id":"g59","zh":"二十五方便","en":"the twenty-five preliminary conditions","def":"The treatise's celebrated five-groups-of-five structure: 具五緣 (being complete in the five conditions), 訶五欲 (rejecting the five desires), 棄五蓋 (abandoning the five hindrances), 調五法 (harmonizing the five faculties), 行五法 (practicing the five dharmas). Fascicle 2 begins with the first group.","first":null},{"id":"g60","zh":"具五緣","en":"being complete in the five conditions","def":"The first group of five: pure moral discipline, being complete in robes and food, dwelling in a quiet place, setting worldly affairs to rest, and obtaining a good spiritual friend. Condition 1 (moral discipline) alone occupies the whole of fascicle 2 so far.","first":11},{"id":"g61","zh":"持戒清淨","en":"pure moral discipline","def":"Condition 1 of the five conditions; itself opens into three parts — 明有戒無戒 (the presence or absence of precepts), 持犯 (upholding and violation), and 懺悔 (repentance).","first":6},{"id":"g62","zh":"有戒 / 無戒","en":"having precepts / lacking precepts","def":"The first of pure moral discipline's three parts.","first":11},{"id":"g63","zh":"十種得戒","en":"the ten ways precepts are received","def":"Ten classical Vinaya precedents, from the Buddha's own spontaneous attainment through ordination-by-messenger and the five/ten-person quorum rules for border versus central regions.","first":11},{"id":"g64","zh":"無作（戒）","en":"non-action","def":"avijñapti. The Hīnayāna account of what precepts fundamentally are: a wholesome quality, brought into being at ordination, that continues functioning spontaneously without further deliberate mental effort — contested across schools (Sarvāstivādins: unmanifest form; Dharmaguptakas: a third category, neither form nor mind).","first":11},{"id":"g65","zh":"戒體","en":"the essence of the precepts","def":"The technical question of what precepts actually consist in; topic 6 contrasts the Hīnayāna's \"non-action\" account with the Mahāyāna's identification of the precepts with the wholesome mind itself.","first":11},{"id":"g66","zh":"七眾","en":"the seven assemblies","def":"The seven ordination categories: upāsaka, upāsikā (lay man, lay woman), śrāmaṇera, śrāmaṇerī (male, female novice), śikṣamāṇā (female probationer), bhikṣu, bhikṣuṇī (fully ordained monk, nun).","first":11},{"id":"g67","zh":"羯磨","en":"the formal procedure","def":"karman. The ritual/legal act of conferring ordination or other saṅgha business; left as \"the formal procedure\" in translated prose rather than transliterated, since the text uses it as a functional term rather than discussing it technically (contrast terms like \"dhyāna\" or \"pāramitā\" that the treatise itself explains).","first":11},{"id":"g68","zh":"持犯","en":"upholding and violation","def":"The second of condition 1's three parts: the mark of properly maintaining the precepts (持) versus transgressing them (犯), extensively distinguished into ten grades from beginner to buddhahood.","first":11},{"id":"g69","zh":"十種持戒","en":"the ten kinds of upholding","def":"Condition 1's ladder of precept-observance, from the four grave precepts through the bodhisattva's mastery-free-of-self-grasping; grouped as worldly (the first four), world-transcending (the middle two), and world-transcending-and-beyond (the last four).","first":null},{"id":"g70","zh":"覆發","en":"concealment and manifestation","def":"The relationship between precept-observance and whether dhyāna is \"brought forth\" or \"concealed\"; qualified by a fourfold classification acknowledging that present-life observance and present-life dhyāna experience do not always track each other exactly, owing to causes from past lives.","first":12},{"id":"g71","zh":"懺悔","en":"repentance","def":"The third of condition 1's three parts, and the treatise's richest passage so far: setting the mind of repentance in motion, three distinct methods of increasing depth, grades of severance, and whether restoration to the original state is complete.","first":11},{"id":"g72","zh":"作法懺悔","en":"repentance through formal procedure","def":"The Hīnayāna-associated method: a defined communal ritual (羯磨) that purifies the offense obstructing the path, without requiring any visionary confirmation.","first":13},{"id":"g73","zh":"觀相懺悔","en":"repentance through the contemplation of signs","def":"The method supported by concentration: repentance confirmed by seeing a favorable sign (the Buddha touching the crown of the head, light, flowers, etc.) within a stilled mind; the text is notably cautious about distinguishing genuine signs from demonic interference.","first":13},{"id":"g74","zh":"觀無生懺悔","en":"repentance through the contemplation of no-arising","def":"The method supported by wisdom, and \"the most honored, the most sublime\" of the three: a sustained analysis of where \"mind\" (and therefore offense) could possibly be located — past, future, present, inside, outside, in between — concluding that offense's root-nature is empty and ever pure. Closely parallels fascicle 1 topic 5's tetralemma against \"contaminated dharma.\"","first":13},{"id":"g75","zh":"普賢觀經","en":"the *Samantabhadra Contemplation Sūtra*","def":"觀普賢菩薩行法經, quoted extensively in the repentance-through-no-arising passage; source of the treatise's most-quoted verse in this section (\"The whole ocean of every karmic obstruction arises entirely from deluded thought...\").","first":13},{"id":"g76","zh":"三品罪","en":"the three grades of offense","def":"Procedural (違無作), essential-nature (體性), and root-ignorance (無明煩惱根本) — mapped one-to-one onto the three methods of repentance, each cutting one layer deeper than the last.","first":null},{"id":"g77","zh":"訶五欲","en":"rejecting the five desires","def":"The second group of the twenty-five preliminary conditions: form, sound, smell, taste, and touch (色/聲/香/味/觸), each illustrated with a cautionary story.","first":11},{"id":"g78","zh":"棄五蓋","en":"abandoning the five hindrances","def":"The third group: the hindrances of desire (貪欲蓋), anger (瞋恚蓋), sleep (睡眠蓋), restlessness-and-regret (掉悔蓋), and doubt (疑蓋) — nīvaraṇa, foundational across nearly every later Buddhist meditation tradition. Mapped onto the three poisons plus the \"equal-portion\" affliction, explaining the traditional count of 84,000 afflictions (21,000 × 4).","first":11},{"id":"g79","zh":"三疑","en":"the three doubts","def":"Doubt about oneself, about one's teacher, and about the Dharma (疑自/疑師/疑法) — the specific subset of doubt (out of doubt in general) that the treatise identifies as actually obstructing concentration.","first":null},{"id":"g80","zh":"調五法","en":"harmonizing the five things","def":"The fourth group, and the treatise's most concrete practical instruction so far: regulating food (調食), sleep (調睡眠), and — treated together — body, breath, and mind (調身、調息、調心) across the three phases of entering (入), abiding in (住), and emerging from (出) meditation.","first":11},{"id":"g81","zh":"風 / 喘 / 氣 / 息","en":"wind / panting / breath-with-effort / true breath","def":"The four grades of breath given in the body-breath-mind instruction, the first three unharmonized and the last (息) the harmonized mark — a foundational fourfold scheme for breath-based meditation instruction generally.","first":2},{"id":"g82","zh":"半跏 / 全跏","en":"the half-lotus / the full-lotus posture","def":"Given with specific, practical instructions for leg and hand placement in the \"entering meditation\" passage.","first":17},{"id":"g83","zh":"沈 / 浮","en":"sinking / floating","def":"The two basic failure-modes of an unharmonized meditating mind, each paired with its own remedy (fixing attention at the tip of the nose for sinking; directing the mind downward for floating).","first":15},{"id":"g84","zh":"行五法","en":"practicing the five dharmas","def":"The fifth and final group: aspiration (欲), diligence (精進), mindfulness (念), skillful wisdom (巧慧), and one-pointedness of mind (一心) — closing topic 6 in its entirety.","first":11},{"id":"g85","zh":"十二頭陀","en":"the twelve dhutanga practices","def":"Ascetic observances (forest-dwelling, alms-begging, a single daily meal, discarded robes, dwelling among graves, never lying down, and the rest) cited under \"diligence\" as the paradigm of complete bodily and mental effort.","first":18},{"id":"g86","zh":"六行觀","en":"the six contemplations","def":"A repurposed Abhidharma scheme (growing weary of the lower realm's suffering/coarseness/obstruction; reaching for the higher realm's superiority/subtlety/transcendence) applied here to moving from the desire realm into the first dhyāna, explained under \"mindfulness\" in both fruit-terms and cause-terms.","first":7},{"id":"g87","zh":"內方便","en":"the internal expedient means","def":"Topic 6's second half (fascicle 3 onward), opening into five layers: the gate of stopping (止門), verifying wholesome/unwholesome capacity (驗善惡根性), methods for settling the mind (安心法), treating illness (治病患), and recognizing demonic affairs (覺魔事).","first":1},{"id":"g88","zh":"止門","en":"the gate of stopping","def":"Śamatha; taken as the first of the five internal-expedient-means layers because, per the treatise, every dhyāna's merit depends on restraining the mind. Has four parts: distinguishing its kinds, its great intent, its method of cultivation, and the marks that verify it.","first":19},{"id":"g89","zh":"繫緣止","en":"fixed-object stopping","def":"The first, coarsest of the three kinds of stopping (in terms of practice): fixing the mind on a physical point (the nose, navel, etc.) to prevent it from wandering.","first":19},{"id":"g90","zh":"制心止","en":"restraining-the-mind stopping","def":"The second, middle kind: restraining discursive thought directly at its arising, rather than via an external object.","first":19},{"id":"g91","zh":"體真止","en":"embodying-truth stopping","def":"The third, subtlest kind: embodying the emptiness of all dharmas directly, described as \"a stopping that stops nothing\" — the deepest of the three, each breaking through the one before it as antidote.","first":19},{"id":"g92","zh":"隨緣止 / 入定止 / 真性止","en":"stopping that follows conditions / stopping that has entered concentration / stopping of the true nature","def":"The same three kinds of stopping restated in terms of principle rather than practice, mapped one-to-one onto 繫緣止/制心止/體真止 respectively.","first":19},{"id":"g93","zh":"五處","en":"the five places","def":"The five points fixed-object stopping may be applied to: the crown of the head, the hairline, the bridge of the nose, the navel, and the \"ground-wheel\" (the base of the body) — each paired with a specific benefit and a specific caution.","first":20},{"id":"g94","zh":"業不可得","en":"karma cannot be found","def":"The treatise's third sustained tetralemma-style analysis (after fascicle 1's against \"contaminated dharma\" and fascicle 2's against \"offense\"), now run against karma itself — concluding not that karma is unreal or ethically inert, but that it has no fixed, independently findable essence under any of the four classical alternatives.","first":20},{"id":"g95","zh":"五輪禪","en":"the five-wheel dhyāna","def":"The distinct method of realization one teacher attributes to stopping alone (as opposed to serving only as a preliminary to other dhyānas): the earth wheel (地輪), water wheel (水輪), wind wheel (風輪), golden-sand wheel (金沙輪), and vajra wheel (金剛輪) — a single continuous path from the threshold of concentration to arhatship and the bodhisattva grounds, each named for a genuine property of its physical namesake.","first":21},{"id":"g96","zh":"明驗善惡根性","en":"verifying wholesome and unwholesome capacity","def":"The second of the internal expedient means' five layers. Opens into two parts: verifying wholesome capacity (明驗善根性, translated across fascicle 3) and verifying unwholesome capacity (明驗惡根性) — the latter deferred by the source text itself to fascicle 4, confirming again that the treatise's own outlines do not map one-to-one onto fascicle boundaries.","first":19},{"id":"g97","zh":"習因 / 報因","en":"the habituation-cause / the retribution-cause","def":"A recurring pair distinguishing two things that can look identical from the inside when a wholesome root arises: a vivid mental image surfacing from past karma (報因, the retribution-cause) versus the actual wholesome disposition that arises alongside it, the resumed trace of past cultivation (習因, the habituation-cause).","first":12},{"id":"g98","zh":"外善 / 內善","en":"external wholesomeness / internal wholesomeness","def":"The two categories of wholesome dharma verified by stopping. External: five kinds of ordinary ethical cultivation done with a still-scattered mind (giving, precepts, filial devotion, faith in the Triple Gem, study). Internal: the five-gate dhyāna itself (阿那波那門, 不淨觀門, 慈心門, 因緣門, 念佛三昧門), already reaching toward uncontaminated attainment.","first":1},{"id":"g99","zh":"五門禪","en":"the five-gate dhyāna","def":"阿那波那門 (mindfulness of the breath), 不淨觀門 (the contemplation of impurity), 慈心門 (loving-kindness), 因緣門 (causation), and 念佛三昧門 (the buddha-recollection samādhi) — internal wholesomeness's own fivefold structure, each gate further opening into three marks of arising (fifteen in total), and each mapped in this fascicle to a different class of practitioner (ordinary person, śrāvaka, ordinary-and-noble together, pratyekabuddha, bodhisattva).","first":20},{"id":"g100","zh":"八觸","en":"the eight tactile sensations","def":"The physical sensations (traditionally: movement, itching, coolness, warmth, lightness, heaviness, roughness, smoothness) marking the arising of the root first dhyāna through the gate of counting the breath.","first":22},{"id":"g101","zh":"三十六物","en":"the thirty-six substances [of the body]","def":"Seen internally as a mark of the special-excellences dhyāna (十六特勝) arising through following the breath; also named earlier in fascicle 3 in connection with fixing the mind at the navel.","first":18},{"id":"g102","zh":"九想 / 背捨 / 大不淨觀（勝處）","en":"the nine contemplations / the liberations / the great contemplation of impurity (and the stations of mastery)","def":"The three marks of wholesome roots arising through the gate of the contemplation of impurity, in ascending order of scope: from a single corpse, to one's own body reduced to bone, to the entire visible world seen as equally impure.","first":1},{"id":"g103","zh":"眾生緣慈 / 法緣慈 / 無緣慈","en":"loving-kindness that takes sentient beings as its object / that takes dharma as its object / objectless loving-kindness","def":"The three marks of wholesome roots arising through the gate of loving-kindness, each of the four immeasurable minds (慈悲喜捨) said to follow the same three-stage pattern — paralleling the gate of stopping's own progression from a concrete object, to a doctrinally refined object, to the collapse of subject-object structure altogether.","first":23},{"id":"g104","zh":"三世十二緣 / 果報十二緣 / 一念十二緣","en":"the twelve links across the three periods of time / as karmic result / within a single thought-moment","def":"The three marks of wholesome roots arising through the gate of causation — three angles on the twelve links of dependent origination (spanning three lifetimes, a single conception, or a single thought-moment), all converging on the same conclusion as the earlier \"karma cannot be found\" analysis. 歌羅邏 (kalala) is used, as in fascicle 1, for the moment of conception, cited again from the *Mahāsaṃnipāta Sūtra*.","first":23},{"id":"g105","zh":"念應佛 / 念報佛 / 念法佛","en":"recollecting the response-body buddha / the reward-body buddha / the dharma-body buddha","def":"The three marks of wholesome roots arising through the gate of buddha-recollection (trikāya: nirmāṇakāya, saṃbhogakāya, dharmakāya), cited as detailed in full in the *Laṅkāvatāra Sūtra* (楞伽經); the same coarse-to-fine progression as the other four gates, ending in a dharma-body described entirely through negation.","first":23},{"id":"g106","zh":"楞伽經","en":"the *Laṅkāvatāra Sūtra*","def":"Cited for its detailed account of the three buddha-bodies (三佛), within the gate of buddha-recollection.","first":23},{"id":"g107","zh":"驗知虛實","en":"verifying whether wholesome roots are genuine or false","def":"The third of verifying wholesome capacity's four parts. Two methods: mark-verification (相驗知 — ten paired wrong marks and ten right marks, worked out through the eight tactile sensations) and dharma-verification (以法驗知 — three tests: settling in equanimity, treating with the original method, wisdom-analysis), followed by discriminating demonic activity (簡是魔非魔).","first":21},{"id":"g108","zh":"十雙邪法","en":"the ten pairs of wrong marks","def":"Twenty deviant tactile-sensation marks in all, each pair a matched excess/deficiency of some otherwise-wholesome quality (e.g. joy vs. agitation, liberation vs. overweening pride) — what makes them hard to catch, since each is too much or too little of a genuine good sign rather than its plain opposite.","first":25},{"id":"g109","zh":"九十六種道","en":"the ninety-six [non-Buddhist] paths","def":"The classical Indian count of non-Buddhist schools; cited here as the source of \"spirit-dharmas\" a deviant tactile-sensation mark may inadvertently correspond to, and of the *Sūtra of the Ninety-Six Paths* (九十六種道經) quoted repeatedly in the discussion of false teachers.","first":25},{"id":"g110","zh":"相驗知 / 以法驗知","en":"mark-verification / dharma-verification","def":"The treatise's two-tier method for telling a genuine wholesome-root mark from a deviant one: mark-verification checks the phenomenal quality of what arises (the ten pairs); dharma-verification, for marks too subtle for that check alone, tests behavior over time and under scrutiny — likened to testing gold by burning, striking, and polishing, and testing a person by working, dwelling, and observing them under hardship.","first":24},{"id":"g111","zh":"簡是魔非魔","en":"discriminating demonic activity","def":"The fourth part of verifying wholesome capacity: distinguishing dhyāna a demon has merely entered (still salvageable by the methods above) from dhyāna that is demonic through and through (which leaves nothing behind once repelled), and, separately, karmic-offense obstruction that only resembles demonic interference (treatable by repentance, not by anti-demon methods). Anticipates the fifth and final internal-expedient-means layer, recognizing demonic affairs (覺魔事), not yet reached in translation.","first":24},{"id":"g112","zh":"煩惱數量","en":"the number and categories of affliction","def":"The first of verifying unwholesome capacity's four parts: five unwholesome dharmas (覺觀, 貪欲, 瞋恚, 愚癡, 惡業) opened out to 84,000 or brought together into the four divisions of affliction (三毒 plus the equal-portion affliction), mirroring the wholesome-root scheme's own five-gate structure — \"medicine matched to illness.\"","first":30},{"id":"g113","zh":"覺觀 / 貪欲 / 瞋恚 / 愚癡 / 惡業障道","en":"discursive thought / craving / anger / delusion / unwholesome karma obstructing the path","def":"The five unwholesome dharmas, each opening into three marks of arising (fifteen total), mirroring wholesome capacity's own five-gate, fifteen-mark structure in fascicle 3.","first":2},{"id":"g114","zh":"三障","en":"the three obstructions","def":"The five unwholesome dharmas regrouped: the three poisons as the obstruction of affliction (habituation-cause), discursive thought as the obstruction of retribution (retribution-cause), and the three karma-obstruction marks as the obstruction of karma — the classical Buddhist triad (煩惱障/報障/業障), distinct from this treatise's own five-gate scheme.","first":31},{"id":"g115","zh":"立對治法","en":"establishing the antidote methods","def":"The third of verifying unwholesome capacity's four parts: six kinds of antidote treatment — matched (對治治), transposed (轉治), non-transposed (不轉治), combined (兼治), combined transposed-and-non-transposed (兼轉兼不轉治), and treatment through neither matching, transposing, nor combining (非對非轉非兼治), the last being prajñā's own right contemplation.","first":30},{"id":"g116","zh":"對治治","en":"matched antidote treatment","def":"The direct, one-to-one pairing of each of the fifteen unwholesome marks with its named antidote (e.g. counting the breath for sharp discursive thought, the nine contemplations for external craving, loving-kindness for anger, the twelve links for delusion, buddha-recollection for karmic obstruction) — the fifteen-fold scheme worked out in full.","first":31},{"id":"g117","zh":"轉治 / 不轉治","en":"transposed treatment / non-transposed treatment","def":"Whether the antidote shifts to match an ailment that has shifted mid-treatment (e.g. craving curdling into anger under the contemplation of impurity, met by shifting to loving-kindness) or whether the original practice is instead intensified through the shift — both presented as legitimate judgment calls, not a fixed rule.","first":31},{"id":"g118","zh":"兼治 / 兼轉兼不轉治","en":"combined treatment / combined transposed-and-non-transposed treatment","def":"Applying two or more matched antidotes together for compound afflictions (e.g. impurity plus loving-kindness for craving mixed with anger), with the same transposed/non-transposed distinction applied within the combination.","first":31},{"id":"g119","zh":"非對非轉非兼治","en":"treatment through neither matching, transposing, nor combining","def":"The sixth and final antidote type: prajñā's own right contemplation, which treats all fifteen ailments and brings forth all fifteen dhyāna-gates at once because it addresses the fixed-self/fixed-object belief every ailment expresses in a different guise — likened to the legendary agada cure-all, superseding rather than joining the other five antidote types (echoing embodying-truth stopping and the vajra wheel earlier in the treatise).","first":31},{"id":"g120","zh":"結成悉檀","en":"concluding in terms of the four siddhāntas","def":"The fourth and closing part of verifying unwholesome capacity: mapping everything covered since fascicle 3's opening of this layer onto Nāgārjuna's four siddhāntas (first introduced in fascicle 1 topic 5) — the marks themselves as the worldly siddhānta, the fifteen matched antidotes as the siddhānta of the antidote, transposed/combined treatment as the siddhānta for the individual, and prajñā's right contemplation as the siddhānta of ultimate meaning.","first":30},{"id":"g121","zh":"明安心法","en":"settling the mind","def":"The third internal-expedient-means layer: five ways of choosing which dhyāna-gate to settle the mind on once wholesome/unwholesome capacity is verified — following what is expedient (隨便宜, whatever gate has already arisen), following what the antidote has accomplished (隨對治成就), following inclination (隨樂欲), following sequence (隨次第), and following ultimate meaning (隨第一義, whichever gate proves easiest to awaken through).","first":19},{"id":"g122","zh":"明治病患","en":"treating illness","def":"The fourth internal-expedient-means layer: the marks of illness arising (四大, the four elements; 五臟, the five organs; 五根, the five faculties — three overlapping diagnostic lenses) and five treatment methods (breath, visualization, mantra, mind-as-ruler, analytic contemplation), closing with ten conditions for the treatment to actually work.","first":19},{"id":"g123","zh":"六種息 / 十二種息","en":"the six therapeutic exhalations / the twelve therapeutic breaths","def":"治病患's breath-based treatments. The six exhalations (吹/呼/嘻/呵/噓/呬, kept transliterated as chuī/hū/xī/hē/xū/xì, each shaping the lips differently) treat specific symptoms and organs; the twelve visualized breaths (上/下/滿/燋/增長/滅壞/暖/冷/衝/持/和/補, \"rising/sinking/filling/scorching/augmenting/dissolving/warming/cooling/surging/sustaining/harmonizing/replenishing\") treat paired excess/deficiency conditions.","first":35},{"id":"g124","zh":"憂陀那","en":"udāna","def":"Transliterated per the source's own gloss: \"this refers to the cinnabar field (丹田), two and a half inches below the navel\" — one of several mind-as-ruler techniques (用心主境治病) for treating illness by fixing attention on a bodily locus.","first":35},{"id":"g125","zh":"明覺魔事","en":"recognizing demonic affairs","def":"The fifth and final internal-expedient-means layer, closing topic 6 (the twenty-five preliminary conditions) entirely: the four kinds of demon, their marks arising, and three methods to defeat them.","first":19},{"id":"g126","zh":"四種魔","en":"the four demons","def":"煩惱魔 (the demon of affliction), 陰入界魔 (the demon of the aggregates/sense-bases/elements), 死魔 (the demon of death), and 天子魔/波旬 (the demon of the desire realm's Heavenly Son, Pāpīyas) — the classical fourfold māra scheme, scaling outward from one's own mental defilements to an actual external adversary. Full victory over all four is deferred, across every source cited, to buddhahood itself.","first":null},{"id":"g127","zh":"鬼神魔","en":"spirit-demons","def":"A three-part taxonomy under the demon of the Heavenly Son's general disturbance: 精媚 (spirit-glamours, the twelve double-hour animals in transformed shape), 垖惕鬼 (\"mischievous spirits,\" rendered descriptively — the source glyph is a rare/uncertain character), and 魔羅 (Māra proper, who disturbs through fifteen states: pleasant, frightening, or neutral, across each of the five sense-faculties).","first":36},{"id":"g128","zh":"五情","en":"the five faculties of feeling","def":"The five sense-faculties (excluding mind), distinct from 六情 (topic 1's six, including mind) — the channel through which Māra's \"fifteen arrows\" (五情 × 3 kinds of object) are said to operate.","first":16},{"id":"g129","zh":"明壞魔之法","en":"methods for defeating demons","def":"Three escalating methods, echoing the treatise's recurring coarse-to-fine pattern: refusing to receive or discriminate what appears; turning contemplation back on the perceiving mind itself; and, if neither succeeds, recognizing that \"the suchness of the demon's realm is precisely the suchness of the buddha's realm\" — dissolving the demon/buddha distinction rather than defeating one side of it.","first":36},{"id":"g130","zh":"修證","en":"cultivation and realization","def":"Topic 7 of the treatise's ten-topic outline, opening into four parts by the kind of dhyāna cultivated: mundane (世間), both mundane and world-transcending (亦世間亦出世間), world-transcending (出世間), and neither (非世間非出世間). Fascicle 5 covers only mundane dhyāna's first section, the four dhyānas.","first":1},{"id":"g131","zh":"四禪 / 四無量心 / 四無色定","en":"the four dhyānas / the four immeasurable minds / the four formless concentrations","def":"Mundane dhyāna's own three sections. Fascicle 5 treats only the four dhyānas (first, second, third, fourth) in full; the latter two sections are not yet reached.","first":1},{"id":"g132","zh":"覺 / 觀","en":"initial thought / sustained reflection","def":"The first dhyāna's first two factors (vitakka/vicāra) — the very same two characters this treatise elsewhere compounds as \"discursive thought\" (覺觀), the restless mental chatter restraining-the-mind stopping restrains and one of fascicle 4's fifteen unwholesome roots. Fascicle 5 addresses this directly: the first dhyāna is also named \"the samādhi possessing initial thought and sustained reflection\" precisely to reassure practitioners who doubt concentration can coexist with it. Kept as \"initial thought\" / \"sustained reflection\" when they appear as this technical factor-pair, distinct from the general unwholesome-root sense.","first":2},{"id":"g133","zh":"十六觸","en":"the sixteen tactile sensations","def":"The mark of the first dhyāna's own arising: the original eight (動/痒/涼/暖/輕/重/澁/滑 — movement, itching, coolness, warmth, lightness, heaviness, roughness, smoothness, already named in fascicle 3) plus a second eight (掉/猗/冷/熱/浮/沈/堅/軟 — agitation, pliancy, cold, heat, floating, sinking, firmness, softness). Each carries its own ten-fold retinue of merit (concentration, emptiness, brightness/purity, joy, happiness, a wholesome mind, clear knowledge/vision, freedom from entanglement, states manifesting, a pliant mind) — 160 dharmas in total if all sixteen arise complete.","first":40},{"id":"g134","zh":"默然心 / 聖默然","en":"the mind of noble silence / noble silence","def":"The sixth, substance-level factor underlying each dhyāna's own five (or four) factors — named \"silence\" because the path of language through initial thought and sustained reflection has been extinguished from the second dhyāna onward. Serves as effect relative to the factors as cause, and as substance relative to the factors as its own function.","first":42},{"id":"g135","zh":"五支 / 四支 (諸禪)","en":"the five (or four) factors of each dhyāna","def":"First dhyāna: initial thought, sustained reflection, joy, happiness, one-pointedness of mind (覺觀喜樂一心). Second dhyāna: inner purity, joy, happiness, one-pointedness of mind (內淨喜樂一心). Third dhyāna: equanimity, mindfulness, wisdom, happiness, one-pointedness of mind (捨念智樂一心). Fourth dhyāna: neither-suffering-nor-happiness, equanimity, purity of mindfulness, one-pointedness of mind (不苦不樂捨念清淨一心). Different sūtras and treatises order these differently, especially the third dhyāna's five (attributed to its uniquely having two distinct kinds of happiness).","first":41},{"id":"g136","zh":"內淨","en":"inner purity","def":"The second dhyāna's own first factor, replacing the first dhyāna's initial thought and sustained reflection: purity of mind that (unlike the first dhyāna's purity, which ran body-to-mind) runs mind-to-body, correspondingly named in both a broad sense (versus external objects) and a narrow sense (versus initial-thought-and-sustained-reflection as inward defilement).","first":43},{"id":"g137","zh":"快樂 / 受樂","en":"immediate happiness / received happiness","def":"The third dhyāna's own two kinds of happiness — happiness at its first, not-yet-pervasive arising, versus happiness once grown to pervade the whole body — cited as the reason the third dhyāna alone has an unfixed factor-ordering across different sūtras and treatises.","first":16},{"id":"g138","zh":"六行","en":"the six practices","def":"The renunciation method used to progress from each dhyāna to the next: contemplating the dhyāna just attained as inferior, suffering, coarse, and an obstruction (下/苦/麁/障), and the dhyāna sought as superior, subtle, and an exit (勝/妙/出) — paired with three concrete methods (non-attachment, reproach, analytic contemplation) borrowed from how one gets an unwanted houseguest to leave.","first":5},{"id":"g139","zh":"退分 / 住分 / 進分 / 達分","en":"prone to regression / abiding / progressing / penetrating through","def":"Four kinds of practitioner capacity at each dhyāna's realization, each further subdivided into the same four (e.g. \"regress-and-regress,\" \"regress-and-abide,\" \"regress-and-progress,\" \"regress-and-penetrate\") — the same combinatorial demonstration fascicle 3's closing section used for unpredictable dhyāna-arising, now applied to how secure an attainment is rather than how it arose.","first":29},{"id":"g140","zh":"提婆","en":"Āryadeva","def":"Nāgārjuna's disciple, cited in fascicle 5 for his public teaching of ānāpāna before a great assembly (the weeping/pomegranate-seed parable) — the treatise's scriptural precedent for teaching dhyāna's method openly while never claiming personal attainment.","first":16},{"id":"g141","zh":"地持論 / 地持經","en":"the Bodhisattva-bhūmi Treatise","def":"Cited repeatedly in fascicle 5 for its own naming of each dhyāna (e.g. \"the dhyāna joined with initial thought and sustained reflection,\" \"the dhyāna joined with joy\").","first":38},{"id":"g142","zh":"瞿沙","en":"Ghoṣa","def":"A Sarvāstivādin master cited for his own distinction between desire-realm concentration and the \"not-yet-arrived\" state, followed by this treatise over the Satyasiddhi-śāstra's and Abhidharma's competing accounts.","first":38},{"id":"g143","zh":"舍利弗毘曇","en":"the Śāriputra-abhidharma-śāstra","def":"Cited for its account of four \"not-yet-arrived\" states and four intermediate dhyānas, one before each of the four dhyānas — the basis for this treatise speaking of a \"not-yet-arrived\" state before the second, third, and fourth dhyānas as well as the first.","first":43},{"id":"g144","zh":"金光明經","en":"the Golden Light Sūtra","def":"Cited for its serpent simile describing the four elements' own directional tendencies (earth and water sinking, wind and fire rising), used to explain the sixteen tactile sensations' arising from the four elements' combinations.","first":null},{"id":"g145","zh":"四無量心","en":"the four immeasurable minds","def":"Loving-kindness (慈), compassion (悲), sympathetic joy (喜), and equanimity (捨) — mundane dhyāna's second section, cultivated after the four dhyānas specifically because the dhyānas alone benefit only oneself. Each has its own method (a vow, then fixing the mind on a loved one/neutral person/enemy in turn, then extending to all beings across the ten directions and five realms) and its own realization-mark, but — unlike the four dhyānas — no distinctly established factors, substance/function, or depth-grades, since the text itself says there is no definite scripture addressing this.","first":1},{"id":"g146","zh":"慈 / 悲 / 喜 / 捨","en":"loving-kindness / compassion / sympathetic joy / equanimity","def":"Defined respectively as: holding beings in loving regard, wishing them happiness; holding beings in pitying regard, aware of their suffering; wishing beings delight through their own happiness; and relinquishing all three preceding states, holding beings in mind without aversion or attachment. Each dhyāna's own dominant factor makes one of the four \"easy\" to cultivate there (initial thought/sustained reflection → compassion; joy → sympathetic joy; happiness → loving-kindness; one-pointedness of mind → equanimity), a different sequence than the standard naming order, explicitly defended as equally valid.","first":2},{"id":"g147","zh":"九種人","en":"the nine kinds of person","def":"The three grades (highest/middle/lowest) each of loved one, neutral person, and enemy — the practice-object grid used throughout cultivating the four immeasurable minds, extended to sentient beings across all five realms once \"cultivated well.\"","first":48},{"id":"g148","zh":"樂 / 喜","en":"happiness / delight","def":"Distinguished at length within the immeasurable minds (bodily vs. mental, sense-consciousness vs. mind-consciousness, coarse vs. fine, cause vs. result) — the same 樂/喜 pair already distinguished for the first dhyāna's own factors in fascicle 5. Notably, delight is \"coarse\" relative to dhyāna's own priorities but \"fine\" relative to the immeasurable minds' priorities — a relative rather than fixed distinction.","first":2},{"id":"g149","zh":"無想定","en":"the concentration of no-thought","def":"A non-Buddhist deviant attainment: mistaking the mere extinguishing of mind and consciousness within the fourth dhyāna for nirvāṇa, without ever actually breaking through form's own bondage — leads only to rebirth in a \"guest heaven\" (客天), not liberation. Distinguished from three further senses of \"no-thought\" given later in the fascicle (the heaven of no-thought, neither-perception-nor-non-perception, and the properly Buddhist cessation of sensation and perception).","first":47},{"id":"g150","zh":"四無色定","en":"the four formless concentrations","def":"The sphere of boundless space (空處), the sphere of boundless consciousness (識處), the sphere of nothingness (無所有處), and the sphere of neither perception nor non-perception (非有想非無想處) — mundane dhyāna's third section, taking their name from their own object rather than being named \"dhyāna,\" since each lacks a dhyāna's complete grove-of-factors. Not present in the desire or form realm; each concentration is reached by reproaching and analytically dissolving the one before it.","first":1},{"id":"g151","zh":"三種色","en":"the three kinds of form","def":"The obstruction the sphere of space's cultivation must overcome: visible form with resistance, invisible form with resistance, and invisible form without resistance — of the eleven form-dharmas total (五塵, the five sense-objects; 五根, the five sense-faculties; and a small portion of the dharma-sense-base).","first":45},{"id":"g152","zh":"八聖種","en":"the eight noble lineages","def":"The contemplation used to leave each formless concentration behind (illness/boil/wound/thorn as the antidote to each of the four aggregates in turn, paired with impermanence/suffering/emptiness/no-self as the principle-level contemplation of each) — used here instead of the \"three expedient means\" (不受/訶責/觀析) that sufficed for leaving the four dhyānas behind, since the formless concentrations are too fine for that method alone to catch their fault.","first":18},{"id":"g153","zh":"非有想非無想處","en":"the sphere of neither perception nor non-perception","def":"The fourth and subtlest formless concentration — genuinely still made up of the four aggregates and thus not truly \"without perception,\" though too fine for an ordinary person to detect as such. Non-Buddhist practitioners mistake it for ultimate liberation (the inchworm-at-the-branch-tip and tied-bird similes); a disciple of the Buddha recognizes it as neither the true mark nor a permanent \"spirit-self\" (神我), just a subtle state still made of the four aggregates.","first":52},{"id":"g154","zh":"般若滅一切法而能生一切法","en":"prajñā extinguishes every dharma and yet is able to give rise to every dharma","def":"The fascicle's closing thesis: every dhyāna already performs, at its own level, the same extinguishing-without-attachment that defines prajñā itself (the first dhyāna leaving behind sorrow, the fourth formless attainment leaving behind perception) — hence the \"twelve gates of dhyāna\" (the four dhyānas, four immeasurable minds, and four formless concentrations together) are prajñā's own preliminary expedient means, not a lesser, separate detour from it. Closes mundane dhyāna and echoes fascicle 5's own closing apologetic.","first":55},{"id":"g155","zh":"亦有漏亦無漏禪","en":"dhyāna that is both contaminated and uncontaminated","def":"Topic 7's second of four major divisions (after mundane dhyāna, fascicles 5–6). Taught through three dharma-gates matched to practitioner capacity: the six wondrous gates (wisdom-heavy), the sixteen special excellences (concentration-heavy), and the thorough-and-bright contemplation (balanced).","first":6},{"id":"g156","zh":"三種觀","en":"the three kinds of contemplation","def":"Introduced at 六妙門's own 修觀 stage: 慧行觀 (wisdom-conduct contemplation, direct insight into the true), 得解觀 (contemplation of understanding attained, i.e. guided visualization — retroactively naming what fascicle 3's nine contemplations and liberations actually are), and 實觀 (true contemplation, seeing what is actually present without imaginative construction). All three named methods in this fascicle rely on true contemplation first, adding wisdom-conduct contemplation only afterward to reach principle.","first":null},{"id":"g157","zh":"先尼梵志","en":"the wandering ascetic Senika","def":"Cited for his own formula (\"not through inward contemplation... not through outward contemplation... and yet not without any contemplation either\") as a compact parallel to the treatise's own tetralemma-style analysis of contemplation itself.","first":57},{"id":"g158","zh":"竪對諸禪","en":"the vertical correspondence to the various dhyānas","def":"The treatise's preferred of two competing schemes for the sixteen special excellences (over a rival scheme mapping them onto the four foundations of mindfulness): each of the sixteen items corresponds to one specific stage, in sequence, from counting the breath through neither perception nor non-perception — items 1–2 to counting the breath, 3 to desire-realm concentration, 4 to the \"not-yet-arrived\" state, 5–8 to the first dhyāna's five factors, 9–10 to the second dhyāna, 11 to the third, 12 to the fourth, and 13–16 to the four formless concentrations in turn.","first":58},{"id":"g159","zh":"根本禪 / 淨禪","en":"the root dhyāna / the pure dhyāna","def":"Distinguished at the special excellences' fifth item: the same five-factor structure as an ordinary, dhyāna, or as a \"pure\" dhyāna once contemplative wisdom is layered onto each factor (perceiving its own emptiness rather than receiving it with attachment) — the technical basis for how the special excellences make each dhyāna \"both contaminated and uncontaminated\" at once.","first":6},{"id":"g160","zh":"須跋陀羅","en":"Subhadra","def":"Traditionally the Buddha's last personal convert before his parinirvāṇa, cited as the example of awakening through the sixteenth special excellence (contemplating relinquishment) — attaining arhatship by contemplating the subtle perception within neither-perception-nor-non-perception. The text notes awakening need not require all sixteen items in sequence; some awaken through only two or three.","first":60},{"id":"g161","zh":"三事 / 三性 (息色心)","en":"the three matters / the three natures — breath, form, mind","def":"The thorough-and-bright contemplation's own object throughout: breath, form (the body), and mind, observed together as a single field rather than in sequence, each in turn found to be, in the treatise's own term, \"suchness\" (如).","first":5},{"id":"g162","zh":"根本世間 / 義世間 / 事世間","en":"the root world / the world of meaning / the world of witnessed phenomena","def":"The three-part framework structuring this fascicle's entire treatment of the first dhyāna: the root world is the meditator's own physical body, contemplated directly (pores, the thirty-six-substance list, internal organs, vessels); the world of meaning maps that same body onto both the Buddhadharma's own doctrinal categories and indigenous Chinese correlative cosmology (five phases, trigrams, the body as royal court); the world of witnessed phenomena is what becomes directly visible through the five supernormal powers, obtained either spontaneously or through cultivation. Each of the three is worked through the same three-grade (lower/middle/upper) 覺-and-大覺 (\"initial thought\" and \"great initial thought\") pattern.","first":62},{"id":"g163","zh":"八相","en":"the eight marks (of conditioned existence)","def":"Applied in this fascicle to the root world's own factor of initial thought: birth, dwelling, and their respective subtle counterparts, together with the four marks of decay/death paired at each grade — used as the basis for a tetralemma-style refutation of whether mind is identical to or separate from the eight marks (via a fire-and-firewood simile).","first":63},{"id":"g164","zh":"提謂經","en":"the Sūtra of Trapusa","def":"Cited twice in this fascicle's world-of-meaning section as scriptural source for the body-as-cosmos and body-as-royal-court correspondences (the five organs mapped onto planets, sacred peaks, the four directional guardian creatures, and the royal court's own ranked officials) — anticipating, via a citation from the Vimalakīrti Sūtra, the objection that this resembles a non-Buddhist soul doctrine.","first":64},{"id":"g165","zh":"法行比丘","en":"the dharma-practicing monk","def":"The exemplary figure in the Mahāsaṃnipāta Sūtra's own account (quoted at length in this fascicle) of obtaining each of the five supernormal powers in turn — body, eye, ear, others'-minds, and past-lives — simply by continuing to watch the breath entering and leaving, all the way from the first dhyāna through the fourth.","first":61},{"id":"g166","zh":"空處 / 識處 / 少識處 / 非想非非想","en":"the sphere of space / the sphere of consciousness / the lesser sphere of consciousness / neither-perception-nor-non-perception","def":"The four formless attainments as treated in this fascicle via direct Mahāsaṃnipāta citation: each stage releases the previous stage's own object as still \"coarse,\" down to perception itself in the fourth — with the fourth alone said to be unable to be exhausted by the mundane path, hence an ordinary person can mistake its stillness for nirvāṇa.","first":6},{"id":"g167","zh":"摩訶衍","en":"the Mahāyāna","def":"The fascicle's own closing frame, echoing fascicle 7's identical move for the six wondrous gates: a bodhisattva who masters the thorough-and-bright contemplation does not stop at its own \"final proof,\" but turns the resulting six supernormal powers outward, toward delivering other beings — the same single dharma-gate yielding a different fruit depending on the vehicle of the one who practices it.","first":1},{"id":"g168","zh":"對治無漏 / 緣理無漏","en":"the undefiled that counteracts / the undefiled that takes principle as its object","def":"The two kinds of undefiled cultivation opening topic 7's third major division, attributed to the Mahāsaṃnipāta Sūtra's own distinction between \"practice-practice\" (行行, taking phenomena as its object) and \"wisdom-practice\" (慧行, taking principle as its object and directly contemplating the Four Noble Truths and dependent origination). Fascicle 9 covers only the former, via nine dharma-gates.","first":1},{"id":"g169","zh":"壞法道 / 不壞法道","en":"the destructive path / the non-destructive path","def":"The two paths within the undefiled that counteracts. The destructive path (nine contemplations, eight recollections, ten perceptions — fascicle 9 in full) destroys the mark of the desire-realm body so thoroughly that the practitioner cannot go on to master the three realms' own contemplation-refinement-permeation-cultivation, three insights, or eight liberations — a narrower, faster route to arhatship. The non-destructive path (eight forms of detachment, eight stations of mastery, ten totalities, nine sequential concentrations, lion's-frolic samādhi, samādhi of transcendence) preserves that capacity and is reserved for fascicle 10.","first":68},{"id":"g170","zh":"九想","en":"the nine contemplations","def":"The charnel-ground meditation on a corpse's decay: swelling, decay, being smeared with blood, festering, livid discoloration, devouring, scattering, bones, and burning (脹/壞/血塗/膿爛/青瘀/噉/散/骨/燒). Preceded by a preliminary death-contemplation with two framing verses, and instructed to be practiced specifically on \"a person one loves\" for maximum effect. Matched item-by-item to six specific desires it counteracts (color, form, demeanor, speech, touch, and attachment to \"the human mark\" itself). Classified under the desire realm and first/second dhyānas (bones extending through the fourth). Closes with a citation from the Mahāprajñāpāramitā Sūtra naming the nine contemplations \"the bodhisattva's own Mahāyāna.\"","first":1},{"id":"g171","zh":"六欲","en":"the six desires","def":"Desire for color, form and appearance, demeanor and bearing, speech and voice, smooth touch, and the human mark itself (色欲/形貌欲/威儀姿態欲/言語音聲欲/細滑欲/人相欲) — the taxonomy of attachment the nine contemplations are designed to counteract, with attachment to \"the human mark\" (a specific person, regardless of their other qualities) singled out as the most stubborn of the six.","first":2},{"id":"g172","zh":"八念","en":"the eight recollections","def":"Recollection of the Buddha, Dharma, Saṃgha, the precepts, relinquishment, the heavens, the breath (ānāpāna), and death (念佛/念法/念僧/念戒/念捨/念天/念入出息/念死). Taught as the direct sequel to the nine contemplations, specifically to remove the fear (including demonic interference) that following the charnel-ground meditation tends to provoke. Organized via a sustained medical simile (Buddha as physician, Dharma as medicine, Saṃgha as caregiver, and so on) for sequential cultivation, but each recollection is also said to independently open the path on its own.","first":1},{"id":"g173","zh":"十想","en":"the ten perceptions","def":"Impermanence, suffering, no-self, the impurity of food, that nothing in the world is to be delighted in, death, impurity, cessation, detachment, and exhaustion (無常想/苦想/無我想/食不淨想/一切世間不可樂想/死想/不淨想/斷想/離想/盡想). Mapped onto the three paths of seeing, cultivation, and no-more-learning respectively (first three / next four / last three), with three separate approaches to cultivating them (strictly sequential, front-loaded from the very start, or any single perception alone). Completing all ten, for a practitioner of the destructive path, yields arhatship complete with both nirvāṇa-with-remainder and nirvāṇa-without-remainder.","first":1},{"id":"g174","zh":"三種道","en":"the three paths","def":"The path of seeing, the path of cultivation, and the path of no-more-learning (見道/修道/無學道) — the sequence-of-stages framework used to distinguish the ten perceptions' own three groups, reused throughout Abhidharma-style analysis across the treatise.","first":72},{"id":"g175","zh":"三相","en":"the three marks","def":"Arising, abiding, and ceasing (生/住/滅) — the marks cited as constituting impermanence, then, in the same passage, argued to be themselves unfindable (arising cannot simultaneously possess abiding-and-ceasing without contradiction) — a compact tetralemma-style argument that impermanence itself is not to be reified as any kind of \"real\" ground.","first":17},{"id":"g176","zh":"死想 (佛說死想義)","en":"the Buddha's own teaching on the perception of death","def":"The dialogue in which the Buddha rejects monks' claims to cultivate death-awareness at intervals of a year down through a single meal as \"negligent,\" accepting only the monk who does not presume upon the next in-breath following an out-breath — reusing ānāpāna, the breath-counting method anchoring the treatise since fascicle 3, as the standard for genuine mindfulness of death.","first":68},{"id":"g177","zh":"觀練熏修","en":"contemplation, refinement, permeation, cultivation","def":"The four-part framework organizing this fascicle's six dharma-gates: 觀禪 (contemplative dhyāna — detachment, the stations of mastery, the totalities), 鍊禪 (refining dhyāna — the nine sequential concentrations), 熏禪 (permeating dhyāna — the lion's-frolic samādhi), 修禪 (cultivating dhyāna — the samādhi of transcendence). A metallurgical logic distinct from the destructive path's outright breaking of the body's mark: each stage works the same material more thoroughly than the last, like successive tempering of a single piece of metal.","first":null},{"id":"g178","zh":"八背捨","en":"the eight forms of detachment","def":"Form within contemplating form without / no form within contemplating form without / the pure detachment realized in the body / the detachments of space, consciousness, nothingness, neither-perception-nor-non-perception, and cessation of sensation and perception. Reprises the nine contemplations' charnel-ground imagery before extending it: the skeleton itself is refined until it radiates eight colors of light (earth, water, fire, wind, blue-green, yellow, red, white), mapped onto the four elements and four hues. Distinguished from \"liberation\" (解脫) — the same eight stages, but renamed only once the fetters are entirely exhausted, not merely weakened.","first":1},{"id":"g179","zh":"四義分別淨不淨","en":"the four-fold impure/pure analysis","def":"不淨不淨 (impure-impure), 不淨淨 (impure-pure), 淨不淨 (pure-impure), 淨淨 (pure-pure) — the framework distinguishing why the third detachment alone earns the name \"pure,\" despite pure light being present from the first detachment onward: the light's origin, object, and degree of refinement must each, in turn, be purified before the name is earned.","first":null},{"id":"g180","zh":"十種細心數法","en":"the ten subtle mental factors","def":"Sensation, perception, formation, contact, intention, desire, resolve, mindfulness, concentration, wisdom (受/想/行/觸/思/欲/解/念/定/慧) — present even within neither-perception-nor-non-perception despite its name, and each, in turn, extinguished in the eighth detachment (the cessation of sensation and perception), including, at the very end, the concentration and wisdom that were doing the contemplating.","first":76},{"id":"g181","zh":"八勝處","en":"the eight stations of mastery","def":"Form within/without, little/much, good/ill (four stations), plus the four color stations (blue-green, yellow, red, white) at the fourth dhyāna. Adds mastering the contemplating mind itself to the eight forms of detachment's own breaking of attachment — \"like a rider on horseback striking at a bandit,\" who must also master the horse. Second station of mastery extends the visualization to a world filled with corpses; an alternate master's account pushes this further still (the \"great contemplation of impurity,\" extending to animals, food, wealth, land — a deliberate, acknowledged distortion used as a corrective, not a claim about literal reality).","first":1},{"id":"g182","zh":"十一切處 / 十一切入","en":"the ten totalities / the ten totality-entries","def":"Blue-green, yellow, red, white, earth, water, fire, wind, space, consciousness (青/黃/赤/白/地/水/火/風/空/識) — a sing
