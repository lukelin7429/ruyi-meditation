<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#8c2f12">
<title>Yogācārabhūmi Reader</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --paper:#fbf6ee;--card:#fffdf9;--wash:#f4ecdf;--ink:#251f1a;--muted:#6b625a;--line:#e6dacb;
  --terra:#b8431c;--terra-deep:#8c2f12;--jade:#2f6d5e;--gold:#c8952f;--gap:#efebe6;
  --zh:'Songti TC','STSong','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',serif;
  --zh-ui:'PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;
  --en:Georgia,'Iowan Old Style','Times New Roman',serif;
  --ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --fs:1;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#1b1815;--card:#24201c;--wash:#2b2621;--ink:#efe7dc;--muted:#a99d90;--line:#3a332c;
  --terra:#e07a52;--terra-deep:#f09a76;--jade:#7cc0ad;--gold:#d8ae5a;--gap:#2c2824;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);line-height:1.5;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
a{color:var(--terra-deep)}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:8px;min-height:52px}
header.top h1{font:600 1rem/1.2 var(--ui);margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{flex:1;text-align:center;padding:10px 4px 9px;text-decoration:none;color:var(--muted);font-size:.8rem;font-weight:600}
nav.bottom a.on{color:var(--terra-deep)}
nav.bottom b{display:block;font-size:1.15rem;line-height:1.1}
.hero{padding:22px 0 14px}
.kicker{font:700 .75rem/1.3 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--terra)}
.hero h2{font:700 calc(1.6rem*var(--fs))/1.2 var(--en);margin:8px 0 4px}
.hero .zh{font:500 calc(1.05rem*var(--fs))/1.5 var(--zh-ui);color:var(--terra-deep)}
.meta{color:var(--muted);font-size:.85rem;margin-top:8px}
.progress{height:6px;border-radius:99px;background:var(--wash);overflow:hidden;margin:12px 0 4px}
.progress i{display:block;height:100%;background:var(--jade)}
.list{list-style:none;margin:0;padding:0}
.list li a{display:flex;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.list .num{flex:0 0 46px;height:46px;border-radius:12px;background:var(--wash);display:grid;place-items:center;font:700 .95rem var(--ui);color:var(--terra-deep)}
.list .done .num{background:var(--jade);color:#fff}
.list .t{font:600 1rem/1.3 var(--en)}
.list .s{font-size:.82rem;color:var(--muted);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--terra-deep);background:var(--terra-deep);color:#fff;font-weight:600;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--terra-deep)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.box h3{margin:0 0 6px;font:700 .8rem/1.3 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--terra)}
.prose p,.prose li{font:calc(1.06rem*var(--fs))/1.75 var(--en)}
.prose p{margin:0 0 .8em}
.prose ul,.prose ol{padding-left:1.25em;margin:0 0 .8em}
.prose h4{font:700 calc(1.08rem*var(--fs))/1.4 var(--en);margin:1.2em 0 .4em}
.sec{margin:26px 0 8px;font:700 .78rem/1.3 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--jade)}
.sec span{color:var(--muted);margin-right:6px}
.pair{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:10px 0}
.pair .zh{background:var(--wash);padding:14px 16px;font:calc(1.24rem*var(--fs))/1.95 var(--zh);letter-spacing:.02em}
.pair .en{padding:14px 16px;font:calc(1.06rem*var(--fs))/1.72 var(--en)}
.ln{display:block;font:600 .72rem/1 var(--ui);color:var(--muted);margin-bottom:6px;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.pair.gap .en{background:var(--gap);color:var(--muted);font-style:italic;font-size:calc(.95rem*var(--fs))}
.pair:target,.pair.flash{outline:3px solid var(--gold);outline-offset:2px}
details.note{border-top:1px dashed var(--line);padding:0 16px}
details.note summary{list-style:none;cursor:pointer;min-height:46px;display:flex;align-items:center;gap:8px;color:var(--terra-deep);font:600 .95rem/1.3 var(--ui)}
details.note summary::-webkit-details-marker{display:none}
details.note summary::before{content:"▸";transition:transform .2s}
details.note[open] summary::before{transform:rotate(90deg)}
details.note .prose{padding-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:.88rem;text-decoration:none;color:var(--ink);min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip b{font:600 1rem var(--zh-ui)}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.q p{margin:0 0 10px;font:calc(1.04rem*var(--fs))/1.6 var(--en)}
.q .opt{display:flex;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:6px 0;cursor:pointer;font:calc(.98rem*var(--fs))/1.45 var(--en);min-height:46px}
.q .opt i{font-style:normal;font-weight:700;color:var(--muted);font-family:var(--ui)}
.q .opt.right{border-color:var(--jade);background:color-mix(in srgb,var(--jade) 12%,transparent)}
.q .opt.wrong{border-color:var(--terra);background:color-mix(in srgb,var(--terra) 10%,transparent)}
.q .why{display:none;margin-top:10px;font:calc(.95rem*var(--fs))/1.6 var(--en);color:var(--muted)}
.q.answered .why{display:block}
.q .src{display:block;font:.75rem var(--ui);margin-top:6px}
.search{width:100%;font:1rem var(--ui);padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:48px}
.filters{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;font-size:.85rem}
.filters button.on{background:var(--terra-deep);border-color:var(--terra-deep);color:#fff}
.term{display:block;padding:12px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.term .h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.term .h b{font:600 1.15rem var(--zh-ui)}
.term .h em{color:var(--jade);font-family:var(--en)}
.term .h span{font-weight:600}
.term .p{font-size:.9rem;color:var(--muted);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}
.card .big{font:600 2rem/1.2 var(--zh-ui)}
.card dl{margin:14px 0 0}
.card dt{font:700 .72rem/1.3 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--terra);margin-top:12px}
.card dd{margin:3px 0 0;font:1.02rem/1.6 var(--en)}
.muted{color:var(--muted)}
.foot{font-size:.75rem;color:var(--muted);margin:30px 0 10px;line-height:1.5}
.navrow{display:flex;justify-content:space-between;gap:10px;margin:24px 0}
.fs{display:flex;gap:6px}
</style>
</head>

ream","zh_title":"八無暇；根、界、信解、意樂；邪性定、正性定、不定聚；四句分別（漏譯）；三自性；遍計所執依名言；夢與夢者；離言之勝義","start":"0656a24","end":"0656c15","stats":{"zh":794,"en":398,"commentary":169},"new_terms":[]},{"id":"572","kind":"day","day":572,"juan":64,"title":"Six Gateways; Why Ultimate Truth Must Be Taught; Coarse Residue; Food; Heedfulness","zh_title":"入道次第：未離欲、倍離欲、已離欲、獨覺、菩薩；非安立諦令二縛解脫；定不能解脫心；麁重五相；四食；在家五種、出家十種不放逸","start":"0656c15","end":"0657b14","stats":{"zh":880,"en":462,"commentary":166},"new_terms":[]},{"id":"573","kind":"day","day":573,"juan":64,"title":"Calm and Insight; Outflows; the Inner Science Ends, Logic Begins","zh_title":"色五種；有愛五種；無慚無愧五相；惡師惡友五相；五種奢摩他毘鉢舍那；三漏；無明漏與六十二見；內明竟；因明：三種論；造論前禮二師、具六意樂","start":"0657b14","end":"0658a17","stats":{"zh":916,"en":730,"commentary":159},"new_terms":[]},{"id":"574","kind":"day","day":574,"juan":64,"title":"The Writer's Virtues; Five Similes for a Treatise; Linguistics; Fascicle 64 Complete","zh_title":"造論者四德：於先師無慢、悲愍、於同法敬愛、不欲彰己；論莊嚴經五喻：紅蓮、真金、美食、吉書、寶藏；聲明處：七種通達；通達法性；多聞十相","start":"0658a17","end":"0658c03","stats":{"zh":681,"en":580,"commentary":194},"new_terms":[]}],"glossary":[{"id":"yogacara","zh":"瑜伽行派","skt":"Yogācāra","en":"Yogācāra; the Yogic Practice school","plain":"The Mahāyāna school that explains experience as what consciousness presents, and how to transform it.","def":"One of the two main philosophical schools of Indian Mahāyāna, associated with Maitreya, Asaṅga, and Vasubandhu (4th–5th century CE). Named for its method, the practice of yoga (meditative discipline); known in Chinese as 唯識 (consciousness-only) or 法相 (dharma-characteristics).","find":[],"src":"course","first":{"day":"00a","line":null}},{"id":"vijnapti-matra","zh":"唯識","skt":"vijñapti-mātra(tā)","en":"consciousness-only; nothing but representation","plain":"Whatever we experience is only what consciousness presents to itself.","def":"The central thesis of Yogācāra: objects do not exist independently of the consciousness that presents them. Vijñapti, \"that which makes known\", is a representation or cognitive presentation; mātra means \"only\". Not a claim that consciousness is an ultimately real substance.","find":[],"src":"course","first":{"day":"00a","line":null}},{"id":"citta-matra","zh":"唯心","skt":"citta-mātra","en":"mind-only","plain":"A scriptural phrase, \"the three realms are mind-only\", related to but distinct from \"consciousness-only\".","def":"Phrase found in sūtras such as the Daśabhūmika (三界唯心) and Laṅkāvatāra. Often used loosely in English as a name for Yogācāra, though the school's technical term is vijñapti-mātra.","find":[],"src":"course","first":{"day":"00a","line":null}},{"id":"madhyamaka","zh":"中觀","skt":"Madhyamaka","en":"the Middle Way school","plain":"The Mahāyāna school of Nāgārjuna, which teaches that all things are empty of fixed own-nature.","def":"Founded by Nāgārjuna (c. 2nd century CE). Yogācāra accepts its teaching of emptiness but explains how deluded experience arises and is transformed.","find":[],"src":"course","first":{"day":"00a","line":null}},{"id":"eight-c","zh":"八識","skt":"aṣṭa vijñānāni","en":"the eight consciousnesses","plain":"Five sense consciousnesses, the mental consciousness, the manas, and the ālayavijñāna.","def":"Yogācāra's analysis of mind into eight kinds of consciousness, each arising moment by moment from its own seeds: eye, ear, nose, tongue, body, mental consciousness (sixth), manas (seventh), and ālayavijñāna (eighth).","find":[],"src":"course","first":{"day":"00a","line":null}},{"id":"seed","zh":"種子","skt":"bīja","en":"seed","plain":"A latent potential left by past experience, which can ripen into new experience.","def":"The potential for a dharma to arise, held in the ālayavijñāna. Seeds are produced by perfuming and ripen into manifest activity (現行) when conditions come together; manifest activity in turn perfumes new seeds.","find":[],"src":"course","first":{"day":"00a","line":null}},{"id":"perfuming","zh":"熏習","skt":"vāsanā","en":"perfuming; habituation","plain":"The way each experience leaves an invisible trace, like incense scenting a cloth.","def":"The process by which manifest activity deposits seeds in the ālayavijñāna. Venerable Miào Jìng: like incense in a wooden chest, it leaves no visible mark yet is fully present. Only what arises and ceases can be perfumed.","find":[],"src":"course","first":{"day":"00a","line":null}},{"id":"three-natures","zh":"三自性","skt":"trisvabhāva","en":"the three natures","plain":"Things as imagined, things as dependently arising, and things as they truly are.","def":"Yogācāra's threefold description of every phenomenon: the imagined (parikalpita), the dependent (paratantra), and the perfected (pariniṣpanna) nature. Paired with the three non-natures (三無性), which express the same doctrine as emptiness.","find":[],"src":"course","first":{"day":"00a","line":null}},{"id":"parikalpita","zh":"遍計所執性","skt":"parikalpita-svabhāva","en":"the imagined nature","plain":"Things as we construct and cling to them; the snake seen in the rope.","def":"The nature imputed by conceptual construction: enduring, independent selves and objects. It does not exist at all.","find":[],"src":"course","first":{"day":"00a","line":null}},{"id":"paratantra","zh":"依他起性","skt":"paratantra-svabhāva","en":"the dependent nature","plain":"Experience as a flow arising from causes and conditions; the rope.","def":"The nature of arising in dependence on others, i.e. on causes and conditions; the stream of consciousness and its contents. Exists conventionally.","find":[],"src":"course","first":{"day":"00a","line":null}},{"id":"parinispanna","zh":"圓成實性","skt":"pariniṣpanna-svabhāva","en":"the perfected nature","plain":"The dependent nature seen free of what we imagine; suchness.","def":"The dependent nature permanently free of the imagined nature; suchness (真如, tathatā), realised by non-conceptual wisdom.","find":[],"src":"course","first":{"day":"00a","line":null}},{"id":"asraya-paravrtti","zh":"轉依","skt":"āśraya-parāvṛtti","en":"transformation of the basis","plain":"The fundamental change at awakening, when the defiled basis is replaced by the pure.","def":"The elimination of defiled seeds in the ālayavijñāna and the full development of pure seeds, by which the eight consciousnesses are turned into the four wisdoms.","find":[],"src":"course","first":{"day":"00a","line":null}},{"id":"four-wisdoms","zh":"四智","skt":"catvāri jñānāni","en":"the four wisdoms","plain":"What the eight consciousnesses become at Buddhahood.","def":"Great mirror wisdom (大圓鏡智, from the ālayavijñāna), wisdom of equality (平等性智, from the manas), wisdom of wondrous observation (妙觀察智, from the mental consciousness), and wisdom that accomplishes what is to be done (成所作智, from the five sense consciousnesses).","find":[],"src":"course","first":{"day":"00a","line":null}},{"id":"five-stages","zh":"五位","skt":"pañcāvasthā","en":"the five stages of the path","plain":"Accumulation, preparation, seeing, cultivation, completion.","def":"The Yogācāra path to Buddhahood: stage of accumulation (資糧位), preparation (加行位), seeing or penetration (通達位), cultivation (修習位), and completion (究竟位).","find":[],"src":"course","first":{"day":"00a","line":null}},{"id":"yogacarabhumi","zh":"瑜伽師地論","skt":"Yogācārabhūmi-śāstra","en":"Treatise on the Stages of Yogic Practice","plain":"The foundational treatise of Yogācāra, in one hundred fascicles.","def":"Said in the Chinese tradition to be spoken by Maitreya and recorded by Asaṅga; translated by Xuánzàng 646–648 (T30, no. 1579). Five divisions; the Basic Section sets out the seventeen stages.","find":[],"src":"course","first":{"day":"00b","line":null}},{"id":"yoga","zh":"瑜伽","skt":"yoga","en":"yoga; correspondence","plain":"Practice that brings body, speech, and mind into accord with the truth.","def":"Glossed in Chinese commentary as 相應, \"correspondence\": accord with the object, with practice, with fruition, with reason, and with the teaching.","find":[],"src":"course","first":{"day":"00b","line":null}},{"id":"bhumi","zh":"地","skt":"bhūmi","en":"stage; ground","plain":"A ground a practitioner stands on and a stage he passes through.","def":"Explained as that which produces, sustains, and supports, like the earth; also the domain in which a practitioner moves. Hence \"the seventeen stages\".","find":[],"src":"course","first":{"day":"00b","line":null}},{"id":"maitreya","zh":"彌勒菩薩","skt":"Maitreya","en":"Maitreya Bodhisattva","plain":"The future Buddha, traditionally the teacher of this treatise.","def":"The bodhisattva now dwelling in the Tuṣita heaven who will be the next Buddha. In the Chinese tradition the Yogācārabhūmi is \"spoken by Maitreya\" (彌勒菩薩說).","find":[],"src":"course","first":{"day":"00b","line":null}},{"id":"asanga","zh":"無著","skt":"Asaṅga","en":"Asaṅga","plain":"The Indian master who received the treatise from Maitreya and taught it.","def":"4th-century founder of Yogācāra, elder brother of Vasubandhu; author of the Mahāyānasaṃgraha. The Tibetan tradition names him as author of the Yogācārabhūmi.","find":[],"src":"course","first":{"day":"00b","line":null}},{"id":"five-divisions","zh":"五分","skt":"—","en":"the five divisions","plain":"The five parts of the treatise: the Basic Section and four compendia.","def":"Basic Section (本地分, fasc. 1–50), Compendium of Ascertainments (攝決擇分, 51–80), Compendium of Explanations (攝釋分, 81–82), Compendium of Synonyms (攝異門分, 83–84), Compendium of Topics (攝事分, 85–100).","find":[],"src":"course","first":{"day":"00b","line":null}},{"id":"seventeen-stages","zh":"十七地","skt":"saptadaśa bhūmayaḥ","en":"the seventeen stages","plain":"The seventeen \"grounds\" of the path, from sense experience to final nirvāṇa.","def":"The contents of the Basic Section. Kuījī groups them: stages 1–9 describe the domain (境), 10–15 practice (行), 16–17 the fruit (果).","find":[],"src":"course","first":{"day":"00b","line":null}},{"id":"uddana","zh":"嗢拕南","skt":"uddāna","en":"summary verse","plain":"A short verse that packs a long list into a few words for memorising.","def":"Glossed 集施, \"gathering and giving\": a few words gather many dharmas and give them to students in a form easy to retain. The seventeen stages are first given in a forty-character uddāna.","find":["嗢柁南"],"src":"course","first":{"day":"00b","line":null}},{"id":"ke-pan","zh":"科判","skt":"—","en":"structural outline","plain":"The nested outline Chinese commentators use to divide a text.","def":"The hierarchical division of a text into headings, marked 甲乙丙丁… (and beyond with the earthly branches 子丑寅卯…). Hán Qīngjìng's Pīxún jì gives the standard outline for this treatise.","find":[],"src":"course","first":{"day":"00b","line":null}},{"id":"samdhinirmocana","zh":"解深密經","skt":"Saṃdhinirmocana Sūtra","en":"Sūtra Unravelling the Thought","plain":"The main scripture of Yogācāra, quoted almost entirely in the treatise.","def":"Source of the teaching that \"the object of consciousness is merely what consciousness manifests\" and of the \"three turnings of the wheel\". Quoted nearly in full in fascicles 75–78.","find":[],"src":"course","first":{"day":"00b","line":null}},{"id":"mahayanasamgraha","zh":"攝大乘論","skt":"Mahāyānasaṃgraha","en":"Compendium of the Mahāyāna","plain":"Asaṅga's systematic summary of Mahāyāna teaching around the ālayavijñāna.","def":"Treatise by Asaṅga in ten chapters, beginning with the ālayavijñāna as \"the support of what is to be known\" (所知依). One of the \"ten branches\".","find":[],"src":"course","first":{"day":"00b","line":null}},{"id":"cheng-weishi-lun","zh":"成唯識論","skt":"Vijñaptimātratāsiddhi","en":"Treatise on the Establishment of Consciousness-Only","plain":"Xuánzàng's great commentary on the Thirty Verses, the standard textbook of the Chinese school.","def":"Compiled by Xuánzàng in 659 from ten Indian commentaries on Vasubandhu's Thirty Verses, mainly following Dharmapāla.","find":[],"src":"course","first":{"day":"00b","line":null}},{"id":"xuanzang","zh":"玄奘","skt":"—","en":"Xuánzàng","plain":"The Chinese pilgrim-translator who brought this treatise from India.","def":"602–664. Studied at Nālandā under Śīlabhadra; translated the Yogācārabhūmi at Hongfu Monastery, Chang'an, 646–648, and some seventy-five other works.","find":[],"src":"course","first":{"day":"00b","line":null}},{"id":"one-root-ten-branches","zh":"一本十支","skt":"—","en":"one root and ten branches","plain":"The Yogācārabhūmi as the root, and ten shorter Yogācāra treatises as its branches.","def":"Traditional Chinese grouping of Yogācāra texts with this treatise as root; the branches include the Hundred Dharmas, Five Aggregates, Mahāyānasaṃgraha, Madhyāntavibhāga, and the Twenty and Thirty Verses.","find":[],"src":"course","first":{"day":"00b","line":null}},{"id":"five-c-stage","zh":"五識身相應地","skt":"pañcavijñānakāyasaṃprayuktā bhūmiḥ","en":"the Stage Corresponding to the Body of the Five Sense Consciousnesses","plain":"The first stage: the five senses, analysed under five headings.","def":"The first of the seventeen stages, which explains each sense consciousness by its self-nature, support, object, accompaniments, and activity, five factors that \"correspond\", i.e. arise and operate together.","find":[],"src":"course","first":{"day":"01","line":"0279a08"}},{"id":"mind-stage","zh":"意地","skt":"manobhūmi","en":"the Mind Stage","plain":"The second stage: mind, thought, and consciousness.","def":"The second of the seventeen stages (fascicles 1–3). Its self-nature is mind (ālayavijñāna), thought (manas), and consciousness (the six); from \"support\" onwards it mainly describes the mental consciousness.","find":[],"src":"course","first":{"day":"01","line":"0279a08"}},{"id":"correspond","zh":"相應","skt":"saṃprayukta","en":"corresponding; in association","plain":"Arising together and working as one on the same object.","def":"Here, the five factors (self-nature, support, object, accompaniments, activity) present together and operating together. More technically, the relation between a mind and its mental factors: same time, same object, same support, each with its own aspect.","find":[],"src":"course","first":{"day":"01","line":"0279a08"}},{"id":"self-nature","zh":"自性","skt":"svabhāva","en":"self-nature","plain":"What makes a consciousness the kind it is.","def":"The distinctive character of a dharma that sets it apart from others. For the eye-consciousness: \"discerning colour-form in dependence on the eye\".","find":[],"src":"course","first":{"day":"01","line":"0279a22"}},{"id":"support","zh":"所依","skt":"āśraya","en":"support","plain":"What a consciousness depends on in order to arise.","def":"For a sense consciousness, threefold: the co-existent support (the faculty), the immediately-preceding support (the moment just ceased), and the seed support (the ālayavijñāna).","find":[],"src":"course","first":{"day":"01","line":"0279a22"}},{"id":"object","zh":"所緣","skt":"ālambana","en":"object","plain":"What a consciousness is aware of.","def":"That which a consciousness and its factors take hold of; corresponds to the object condition (所緣緣).","find":[],"src":"course","first":{"day":"01","line":"0279a22"}},{"id":"accompaniments","zh":"助伴","skt":"sahāya","en":"accompaniments","plain":"The mental factors that arise with a consciousness and help it work.","def":"The mental factors (心所) that co-arise and correspond with a consciousness, sharing its object while each has its own aspect.","find":[],"src":"course","first":{"day":"01","line":"0279a22"}},{"id":"activity","zh":"作業","skt":"karman","en":"activity","plain":"What a consciousness does.","def":"For a sense consciousness, sixfold: discerning only its own object, only the particular mark, only the present, for only a single moment; following the mental consciousness; and bringing about results.","find":[],"src":"course","first":{"day":"01","line":"0279a22"}},{"id":"co-existent","zh":"俱有依","skt":"sahabhū-āśraya","en":"co-existent support","plain":"A support present at the same moment, such as the eye for seeing.","def":"The support that exists simultaneously with the consciousness and shares its fortunes; corresponds to the dominant condition (增上緣).","find":[],"src":"course","first":{"day":"01","line":"0279a26"}},{"id":"immediately-preceding","zh":"等無間依","skt":"samanantara-āśraya","en":"immediately-preceding support","plain":"The moment of consciousness that has just ceased, making room for the next.","def":"The just-ceased moment of the same kind of consciousness, which \"opens the way\" for the next with nothing between; corresponds to the immediately-preceding condition (等無間緣). In fascicle 1 called manas (意) in this sense.","find":[],"src":"course","first":{"day":"01","line":"0279a26"}},{"id":"seed-support","zh":"種子依","skt":"bīja-āśraya","en":"seed support","plain":"The ālayavijñāna as holder of the seed from which a consciousness arises.","def":"The causal support of a consciousness; corresponds to the causal condition (因緣).","find":[],"src":"course","first":{"day":"01","line":"0279a26"}},{"id":"four-conditions","zh":"四緣","skt":"catvāraḥ pratyayāḥ","en":"the four conditions","plain":"Causal, immediately-preceding, object, and dominant conditions.","def":"The classical analysis of causation: causal condition (因緣), immediately-preceding condition (等無間緣), object condition (所緣緣), and dominant condition (增上緣).","find":[],"first_day":"01","src":"course","first":{"day":"01","line":null}},{"id":"pure-form","zh":"淨色","skt":"rūpa-prasāda","en":"pure form","plain":"The subtle, invisible matter of a sense faculty, as distinct from the visible organ.","def":"The sense faculty proper, made of the four great elements but too subtle to be seen (\"invisible, yet with obstruction\"); distinguished from the visible organ, called 扶根塵.","find":[],"src":"course","first":{"day":"01","line":"0279a29"}},{"id":"four-elements","zh":"四大種","skt":"catvāri mahābhūtāni","en":"the four great elements","plain":"Earth, water, fire, and wind: solidity, cohesion, heat, and movement.","def":"The primary elements of which all matter is \"made\" (所造). As tangibles: hardness, wetness, warmth, and movement.","find":[],"src":"course","first":{"day":"01","line":"0279a29"}},{"id":"all-seeds","zh":"一切種子識","skt":"sarvabījaka-vijñāna","en":"all-seeds consciousness","plain":"Another name for the ālayavijñāna, as the holder of all seeds.","def":"The ālayavijñāna, \"produced from the beginningless perfuming of delight in elaboration as its cause\"; the ripened-effect consciousness holding all seeds.","find":[],"src":"course","first":{"day":"01","line":"0279b01"}},{"id":"elaboration","zh":"戲論","skt":"prapañca","en":"elaboration; conceptual proliferation","plain":"The endless talk and thought built on grasping at self and things.","def":"At root, the grasping at persons and dharmas as real; fascicle 95 lists six kinds (inverted, pointless, quarrelsome, comparative, occupational, and worldly talk). Its perfuming is the cause of the all-seeds consciousness.","find":[],"src":"course","first":{"day":"01","line":"0279b01"}},{"id":"ripening","zh":"異熟","skt":"vipāka","en":"ripening; ripened effect","plain":"A karmic result that matures at a different time and in a different form from its cause.","def":"The ālayavijñāna as the result of past karma: \"ripening at a different time, in a different way, in a different kind\". Itself morally neutral.","find":[],"src":"course","first":{"day":"01","line":"0279a26"}},{"id":"appropriate","zh":"執受","skt":"upādāna / upātta","en":"appropriate; hold as one's own","plain":"The ālayavijñāna's holding of the body so that it is alive and can feel.","def":"To take as part of oneself and sustain, sharing its safety and danger. \"Appropriated\" elements produce sound such as the voice; \"non-appropriated\" elements produce sound such as wind.","find":[],"src":"course","first":{"day":"01","line":"0279a26"}},{"id":"visible-colour","zh":"顯色","skt":"varṇa","en":"visible colour","plain":"Blue, yellow, red, white, and their variants such as light and shadow.","def":"The first kind of visible form: the four basic colours and their variants (light, shadow, brightness, darkness, cloud, smoke, dust, mist, sky).","find":[],"src":"course","first":{"day":"01","line":"0279b03"}},{"id":"shape","zh":"形色","skt":"saṃsthāna","en":"shape","plain":"Long, short, square, round, and so on, judged by comparison.","def":"Visible form as an accumulation of colour discriminated as long, short, and so on; only nominal (假色).","find":[],"src":"course","first":{"day":"01","line":"0279b03"}},{"id":"expressive-form","zh":"表色","skt":"vijñapti-rūpa","en":"expressive form","plain":"Bodily movements and postures that express a state of mind.","def":"The accumulation of colour arising moment by moment in a new place, moved by volition: taking, releasing, bending, stretching, walking, standing, sitting, lying.","find":[],"src":"course","first":{"day":"01","line":"0279b03"}},{"id":"particular-mark","zh":"自相","skt":"svalakṣaṇa","en":"particular mark","plain":"What is unique to this thing here and now.","def":"The individual character of a dharma, known directly; the five sense consciousnesses know only this.","find":[],"src":"course","first":{"day":"01","line":"0279b24"}},{"id":"shared-mark","zh":"共相","skt":"sāmānya-lakṣaṇa","en":"shared mark","plain":"A feature many things have in common, such as impermanence.","def":"A general character shared by many dharmas (e.g. impermanence, suffering, emptiness), known only by the mental consciousness.","find":[],"src":"course","first":{"day":"03","line":"0280b21"}},{"id":"attention-arise","zh":"作意正起","skt":"—","en":"attention properly arising","plain":"The third condition for seeing: the mind must turn towards the object.","def":"For a sense consciousness to arise: an unimpaired faculty, an object present, and the arising of the attention that produces it.","find":["作意若不正起"],"src":"course","first":{"day":"02","line":"0280a18"}},{"id":"five-minds","zh":"五心","skt":"—","en":"the five minds","plain":"The sequence of moments in one act of perception.","def":"Sudden mind (率爾心, the sense consciousness), seeking mind (尋求心), deciding mind (決定心), defiled-or-pure mind (染淨心), and flowing-alike mind (等流心).","find":["率爾心"],"src":"course","first":{"day":"02","line":"0280a22"}},{"id":"citta","zh":"心","skt":"citta","en":"mind","plain":"In the Mind Stage, the ālayavijñāna, where seeds collect.","def":"\"Mind is that on which all seeds depend and rest … the ripened-effect ālayavijñāna.\" Derived from \"accumulating\" (集起).","find":["心，謂一切種子"],"src":"course","first":{"day":"03","line":"0280b06"}},{"id":"manas-word","zh":"意","skt":"manas","en":"thought; manas","plain":"Two senses: the moment just past, and the seventh consciousness.","def":"In 0279a26 and 0279b01, the immediately-preceding support (the just-ceased moment). In 0280b08, also \"ever-active thought\", the seventh consciousness, as well as the just-ceased moment of the six.","find":["等無間依，謂意"],"src":"course","first":{"day":"01","line":"0279a08"}},{"id":"vijnana","zh":"識","skt":"vijñāna","en":"consciousness","plain":"The present act of discerning an object.","def":"\"Consciousness is the present discerning of the object at hand.\" In the Mind Stage's triad, the six consciousnesses in their present activity.","find":["識，謂現前了別"],"src":"course","first":{"day":"03","line":"0280b04"}},{"id":"unconditioned","zh":"無為","skt":"asaṃskṛta","en":"the unconditioned","plain":"What does not arise or cease, such as space or nirvāṇa.","def":"Dharmas not produced by causes and conditions; an object only of the mental consciousness.","find":[],"src":"course","first":{"day":"03","line":"0280b11"}},{"id":"seventeen-powers","zh":"十七勝作業","skt":"—","en":"the seventeen powers of the mental consciousness","plain":"Activities only the mind can do: thinking, dreaming, dying, being reborn, and so on.","def":"Discriminating, deliberating, intoxication, madness, dreaming, waking, fainting, reviving, initiating action, freedom from desire, falling back, cutting off and renewing wholesome roots, dying, rebirth, and the destruction and formation of the world.","find":["勝作業"],"src":"course","first":{"day":"03","line":"0280b26"}},{"id":"discrimination","zh":"分別","skt":"vikalpa","en":"discrimination; conceptual activity","plain":"Any conceptual activity of the mind: labelling, seeking, judging, worrying.","def":"The first of the seventeen powers, sevenfold: with a sign, without a sign, spontaneous, seeking, examining, defiled, and undefiled.","find":["七種分別"],"src":"course","first":{"day":"01","line":"0279b08"}},{"id":"inversions","zh":"四顛倒","skt":"viparyāsa","en":"the four inversions","plain":"Seeing the impermanent as permanent, suffering as pleasure, the impure as pure, non-self as self.","def":"The four basic errors that deliberation \"in accord with truth\" does not superimpose.","find":["無常常倒"],"src":"course","first":{"day":"03","line":"0280c19"}},{"id":"superimpose","zh":"增益","skt":"samāropa","en":"superimposition","plain":"Adding something that is not there.","def":"Attributing reality to what is not real (e.g. the four inversions). Paired with detraction (損減, apavāda), denying what is real (e.g. wrong views). The middle way avoids both.","find":["不增益"],"src":"course","first":{"day":"03","line":"0280c19"}},{"id":"supramundane","zh":"出世間智","skt":"lokottara-jñāna","en":"supramundane wisdom","plain":"The direct insight of noble beings, beyond the world.","def":"Purified wisdom that truly comprehends dharmas, attained from the path of seeing onwards; contrasted with the wisdom that abides in the Dharma (法住智).","find":[],"src":"course","first":{"day":"03","line":"0280c23"}},{"id":"wholesome-roots","zh":"善根","skt":"kuśala-mūla","en":"wholesome roots","plain":"Non-greed, non-hatred, and non-delusion, the roots from which good grows.","def":"The three wholesome roots. \"Cutting off wholesome roots\" cuts off only their active presence by unbroken opposition; their seeds are never destroyed, so they can be renewed.","find":[],"src":"course","first":{"day":"03","line":"0280b26"}},{"id":"vairagya","zh":"離欲","skt":"vairāgya","en":"freedom from desire","plain":"Freedom from sensual desire gained through meditation.","def":"Detachment from the desire of a lower level through meditative attainment; requires ripened roots, fitting instruction, freedom from obstacles, and skilful cultivation of right reflection. One can fall back from it.","find":[],"src":"course","first":{"day":"03","line":"0280b26"}},{"id":"three-volitions","zh":"三種思","skt":"—","en":"the three volitions","plain":"Deliberating, deciding, and impelling: the three steps of volition before an act.","def":"Deliberative volition (審慮思), decisive volition (決定思), and impelling volition (動發思), which Venerable Miào Jìng matches to the deliberating cognition, intention, and exertion that precede bodily and verbal action.","find":[],"first_day":"04","src":"course","first":{"day":"04","line":null}},{"id":"timely-death","zh":"時死","skt":"—","en":"timely and untimely death","plain":"Death when the life-span runs out, versus death before it does.","def":"Death through exhaustion of the life-span is timely; death through exhaustion of merit or failure to avoid imbalance (nine causes) is untimely (非時死).","find":["時非時死"],"src":"course","first":{"day":"04","line":"0281b03"}},{"id":"coarse-subtle-thought","zh":"麁想","skt":"—","en":"coarse and subtle thought (at death)","plain":"Clear, focused thought while one can still recall good deeds, versus dim thought when one cannot.","def":"At death, while thought is coarse (clear) one can recall or be reminded of one's wholesome practices; once it turns subtle (細想, dim and unfocused), only an indeterminate mind remains.","find":["麁想"],"src":"course","first":{"day":"04","line":"0281b15"}},{"id":"self-love","zh":"我愛","skt":"ātma-sneha","en":"self-love","plain":"The deep clinging to oneself that flares up at death and carries one into the next life.","def":"Long-habituated love of self that becomes active as death approaches (\"I am about to cease to be\"); it \"moistens\" rebirth (潤生), establishing the intermediate state. Absent at death for non-returners.","find":[],"src":"course","first":{"day":"05","line":"0281c23"}},{"id":"antarabhava","zh":"中有","skt":"antarābhava","en":"intermediate being; between-existence","plain":"The subtle body between death and the next birth.","def":"The being between death and rebirth, with all faculties complete; lasts at most seven days if it does not meet the conditions for birth, up to seven times seven days. Also called gandharva, mind-gone, and seeking-existence. Not a ghost.","find":[],"src":"course","first":{"day":"05","line":"0281c23"}},{"id":"gandharva","zh":"健達縛","skt":"gandharva","en":"gandharva; scent-eater","plain":"A name for the intermediate being, because it feeds on scent.","def":"One of the four names of the intermediate being; its presence is one of the three conditions for entering the womb.","find":[],"src":"course","first":{"day":"06","line":"0282b04"}},{"id":"kalala","zh":"羯羅藍","skt":"kalala","en":"kalala","plain":"The first stage of the embryo, like curdled milk, when consciousness first takes hold.","def":"The mass formed by the union of the parents' fluids, \"like curdled milk at the moment it sets\", which the ālayavijñāna appropriates; the first of the eight stages in the womb.","find":[],"src":"course","first":{"day":"06","line":"0283a01"}},{"id":"flesh-heart","zh":"肉心","skt":"—","en":"flesh-heart","plain":"The place where consciousness first takes hold at conception and last leaves at death.","def":"The point in the kalala where consciousness first takes hold; consciousness departs last from the same place. Venerable Miào Jìng suggests \"brain\" as a possible modern reading.","find":[],"src":"course","first":{"day":"06","line":"0283a15"}},{"id":"linguistic-seeds","zh":"名言種子","skt":"abhilāpa-vāsanā","en":"linguistic seeds","plain":"Seeds laid down by our habit of naming and conceptualising; they produce a life itself.","def":"Seeds perfumed by \"delight in elaboration\"; the dominant cause of an existence's arising, while karma is dominant for its quality (lineage, beauty, lifespan, wealth).","find":["戲論為最勝因"],"src":"course","first":{"day":"07","line":"0284b11"}},{"id":"intrinsic-feeling","zh":"自性受","skt":"—","en":"intrinsic feeling","plain":"The steady neutral feeling of being alive, beneath pleasure and pain.","def":"The neither-painful-nor-pleasant feeling that grows with consciousness in the womb and alone belongs strictly to the ripened result; the ālayavijñāna's own neutral feeling.","find":[],"src":"course","first":{"day":"07","line":"0284b15"}},{"id":"fixed-karma","zh":"定業","skt":"niyata-karman","en":"fixed karma","plain":"Karma certain to bring its result; done deliberately and without regret.","def":"Contrasted with uncertain karma (不定業), whose result may not ripen; both teachers: an act done deliberately and gladly is fixed, one regretted and repented is no longer certain.","find":["順不定受"],"src":"course","first":{"day":"07","line":"0284b27"}},{"id":"dausthulya","zh":"麁重","skt":"dauṣṭhulya","en":"coarse burden","plain":"The heaviness and unfitness of body and mind that makes practice hard.","def":"\"Lack of fitness\" of the basis. Afflictive seeds and seeds of the ripened result and other neutral classes are coarse burden; wholesome seeds are not.","find":[],"src":"course","first":{"day":"07","line":"0284c03"}},{"id":"anusaya","zh":"隨眠","skt":"anuśaya","en":"latent tendency","plain":"An affliction lying dormant as a seed, ready to arise.","def":"The seed-state of the afflictions; only afflictive seeds are called latent tendencies.","find":[],"src":"course","first":{"day":"07","line":"0284c03"}},{"id":"samskara-duhkhata","zh":"行苦","skt":"saṃskāra-duḥkhatā","en":"suffering of conditioned formations","plain":"The subtle suffering of simply being conditioned, even when nothing hurts.","def":"Every existence, being followed by, produced by, and made of coarse burden, is established as suffering; one of the three sufferings (with suffering of pain and of change).","find":[],"src":"course","first":{"day":"07","line":"0284c08"}},{"id":"kalpa","zh":"劫","skt":"kalpa","en":"eon","plain":"A cosmic age; eighty intermediate eons make a great eon.","def":"In this treatise one decrease-and-increase of the human lifespan is an intermediate eon (中劫); twenty each for destruction, emptiness, formation, and abiding make a great eon (大劫). Older translations name the units differently.","find":["中劫"],"src":"course","first":{"day":"09","line":"0285c04"}},{"id":"three-calamities","zh":"三災","skt":"—","en":"the three great calamities","plain":"Fire, water, and wind, which destroy the world at the end of an eon.","def":"Fire destroys up to the first dhyāna, water up to the second, wind up to the third; the fourth dhyāna is destroyed by none. Distinct from the three minor calamities (famine, disease, the sword), which destroy beings.","find":["火災"],"src":"course","first":{"day":"09","line":"0285b27"}},{"id":"sumeru","zh":"蘇迷盧","skt":"Sumeru","en":"Mount Sumeru","plain":"The great mountain at the centre of the world in Buddhist cosmology.","def":"Made of gold, silver, crystal, and lapis lazuli; eighty thousand yojanas high, ringed by seven gold mountains and the four continents.","find":[],"src":"course","first":{"day":"10","line":"0286b04"}},{"id":"jambudvipa","zh":"贍部洲","skt":"Jambudvīpa","en":"Jambudvīpa","plain":"The southern continent, our world.","def":"Named for the jambu tree south of the Lake of No Heat; shaped like a cart's box. Written with 贍 (shell radical), not 瞻.","find":[],"src":"course","first":{"day":"11","line":"0287a11"}},{"id":"four-heavenly-kings","zh":"四大天王","skt":"cāturmahārājika","en":"the Four Heavenly Kings","plain":"The four guardians of the world, one for each direction.","def":"Dhṛtarāṣṭra (east), Virūḍhaka (south), Virūpākṣa (west), and Vaiśravaṇa (north), whose capitals stand on the four sides of Yugandhara.","find":["持國"],"src":"course","first":{"day":"11","line":"0287a16"}},{"id":"mahasammata","zh":"大等意","skt":"Mahāsammata","en":"Mahāsammata, \"the Great Elect\"","plain":"The first king, chosen by common consent to settle disputes.","def":"The arbiter chosen by beings once theft and quarrels over land arose; Master Cháng Bǎi stresses he was elected, not divinely appointed.","find":[],"src":"course","first":{"day":"12","line":"0287c16"}},{"id":"yama","zh":"靜息王","skt":"Yama","en":"the Quiescence King (King Yama)","plain":"King Yama, the first being reborn in hell, who tells others to do no more evil.","def":"Reborn in hell through his own defiled karma; Venerable Miào Jìng: called \"Quiescence King\" because he admonishes those who come before him.","find":[],"src":"course","first":{"day":"13","line":"0288a09"}},{"id":"trichiliocosm","zh":"三千大千世界","skt":"trisāhasra-mahāsāhasra-lokadhātu","en":"great trichiliocosm","plain":"A thousand-cubed world system: one Buddha-field.","def":"A thousand worlds make a small chiliocosm, a thousand of those a medium, a thousand of those a great one; \"three thousand\" refers to the three steps. One great trichiliocosm is a single Buddha-field.","find":[],"src":"course","first":{"day":"11","line":"0286c13"}},{"id":"four-births","zh":"四生","skt":"catur-yoni","en":"the four kinds of birth","plain":"From an egg, from a womb, from moisture, and by transformation.","def":"Transformation birth needs nothing but the being's own karma; it is the only kind among gods and hell-beings.","find":["卵生"],"src":"course","first":{"day":"11","line":"0287a16"}},{"id":"eight-worldly","zh":"八世法","skt":"aṣṭa loka-dharmāḥ","en":"the eight worldly winds","plain":"Gain and loss, praise and blame, fame and disrepute, pleasure and pain.","def":"Gain, loss, slander behind one's back (毀), praise behind one's back (譽), praise to one's face (稱), reproach to one's face (譏), pleasure, and pain.","find":["八種世法"],"src":"course","first":{"day":"13","line":"0288b02"}},{"id":"four-nutriments","zh":"四食","skt":"catvāra āhārāḥ","en":"the four nutriments","plain":"Solid food, contact, volition, and consciousness, which sustain life.","def":"Both teachers identify consciousness-as-food with the ālayavijñāna's sustaining hold on the body.","find":["段食"],"src":"course","first":{"day":"13","line":"0288b25"}},{"id":"cakravartin","zh":"轉輪王","skt":"cakravartin","en":"wheel-turning king","plain":"A universal monarch who rules by the power of merit.","def":"Four kinds: iron wheel (one continent), bronze (two), silver (three), gold (four).","find":[],"src":"course","first":{"day":"14","line":"0289a14"}},{"id":"mana","zh":"慢","skt":"māna","en":"conceit","plain":"The mind's habit of measuring itself against others.","def":"Sevenfold: conceit, excessive conceit, conceit beyond excessive conceit, self-conceit, overestimating conceit, self-deprecating conceit, wrong conceit. Venerable Miào Jìng: conceit centres on the self, arrogance on what is mine.","find":["七種慢"],"src":"course","first":{"day":"03","line":"0280b13"}},{"id":"mada","zh":"憍","skt":"mada","en":"arrogance","plain":"Intoxicated pride in what one has: health, youth, wealth, learning.","def":"Sevenfold: pride in health, youth, long life, lineage, beauty and strength, wealth and rank, and learning.","find":["七種憍"],"src":"course","first":{"day":"03","line":"0280b13"}},{"id":"unsound-attention","zh":"不如理作意","skt":"ayoniśo-manaskāra","en":"unsound reasoning attention","plain":"Attention that does not accord with how things are; the root of wrong views.","def":"The fourth gateway of the three grounds of thought, shown through sixteen divergent doctrines (fascicles 6–7). Its opposite, sound reasoning attention (如理作意), is where an ordinary being can become noble.","find":["不如理作意"],"src":"course","first":{"day":"23","line":"0294b16"}},{"id":"sound-attention","zh":"如理作意","skt":"yoniśo-manaskāra","en":"sound reasoning attention","plain":"Attention in accordance with truth.","def":"Attention that leads the mind towards wholesome states; set out in eight marks, from right livelihood and giving to the three trainings (fascicle 5).","find":["如理作意"],"src":"course","first":{"day":"23","line":"0294b16"}},{"id":"sixteen-doctrines","zh":"十六種異論","skt":"—","en":"the sixteen divergent doctrines","plain":"Sixteen wrong philosophical views examined and refuted in fascicles 6–7.","def":"Effect in cause; manifestation by conditions; real past and future; self; permanence; prior deeds as sole cause; a sovereign creator; harm as Dharma; bounded or boundless; evasive equivocation; no cause; annihilation; emptiness wrongly grasped; caste supremacy; false purity; false auspiciousness.","find":["十六種異論"],"src":"course","first":{"day":"38","line":"0303c01"}},{"id":"hidden-intent","zh":"密意","skt":"abhiprāya","en":"hidden intent","plain":"What a teaching really means, behind its literal wording.","def":"Used to explain scriptural statements that seem to support wrong views, e.g. \"past karma exists\" refers to its habitual imprint (fascicle 6).","find":["密意"],"src":"course","first":{"day":"40","line":"0305a24"}},{"id":"conventional-self","zh":"假我","skt":"prajñapti-ātman","en":"the conventionally designated self","plain":"\"I\" as a name for the changing stream of aggregates, not an owner behind them.","def":"Posited for four reasons: ease of communication, conformity with convention, removing the fear of \"no self at all\", and showing how virtues and faults accrue. Neither the same as nor different from the aggregates.","find":["假施設"],"src":"course","first":{"day":"43","line":"0307b13"}},{"id":"wrongly-grasped-emptiness","zh":"惡取空","skt":"durgṛhītā śūnyatā","en":"wrongly grasped emptiness","plain":"Misreading emptiness as \"nothing exists at all\".","def":"The view of some Mahāyāna students that no phenomenon has any characteristic; refuted by the three natures, without which there would be no distortion, defilement, or purity.","find":[],"first_day":"50","src":"course","first":{"day":"50","line":null}},{"id":"three-defilements","zh":"三雜染","skt":"saṃkleśa","en":"the three defilements","plain":"Affliction, karma, and rebirth: the round of suffering.","def":"Afflictive defilement (煩惱雜染), karmic defilement (業雜染), and rebirth defilement (生雜染); the truths of suffering and its origin (fascicles 8–10).","find":["煩惱雜染"],"src":"course","first":{"day":"53","line":"0313a19"}},{"id":"satkaya-drsti","zh":"薩迦耶見","skt":"satkāya-dṛṣṭi","en":"self-view; view of the perishing aggregates","plain":"Taking the aggregates to be a self or a self's.","def":"The root of all views, in twenty forms (four for each aggregate). Conceptual self-view ends at stream-entry; innate self-grasping only at arhatship.","find":[],"src":"course","first":{"day":"07","line":"0284c10"}},{"id":"five-views","zh":"五見","skt":"pañca dṛṣṭayaḥ","en":"the five views","plain":"Self-view, extreme views, wrong view, view-grasping, and precept-grasping.","def":"The \"five sharp\" afflictions, as opposed to the \"five dull\" (craving, hatred, conceit, ignorance, doubt).","find":["邊執見"],"src":"course","first":{"day":"53","line":"0313b12"}},{"id":"ten-courses","zh":"十業道","skt":"daśa karmapathāḥ","en":"the ten courses of action","plain":"Three bodily, four verbal, and three mental deeds, wholesome or unwholesome.","def":"Killing, taking what is not given, sexual misconduct, false speech, divisive speech, harsh speech, frivolous speech, covetousness, ill will, wrong view; and their opposites. Defined by object, perception, intention, affliction, means, and completion.","find":["業道"],"src":"course","first":{"day":"19","line":"0292b03"}},{"id":"five-results","zh":"五果","skt":"pañca phalāni","en":"the five results","plain":"Ripened, equal-outflow, release, human-effort, and dominant results.","def":"Ripened result (異熟果), result of equal outflow (等流果), result of release from bondage (離繫果), result of human effort (士用果), dominant result (增上果).","find":["等流果"],"src":"course","first":{"day":"34","line":"0301b09"}},{"id":"ten-causes","zh":"十因","skt":"daśa hetavaḥ","en":"the ten causes","plain":"This treatise's own list of ten kinds of cause.","def":"Designation, correlation, impelling, generation, inclusion, drawing-forth, fixed distinction, concomitant action, opposition, non-opposition (fascicle 5).","find":["隨說因"],"src":"course","first":{"day":"34","line":"0301b09"}},{"id":"anantarya","zh":"無間業","skt":"ānantarya-karman","en":"acts of immediate retribution","plain":"Five gravest deeds that lead straight to hell.","def":"Killing one's mother, father, or an arhat; splitting the saṅgha; drawing a Tathāgata's blood with malice.","find":["無間業"],"src":"course","first":{"day":"60","line":"0318b17"}},{"id":"anenjya-karma","zh":"不動業","skt":"āneñjya-karman","en":"unmoving karma","plain":"Meditative karma that leads to the form and formless realms.","def":"Karma whose result ripens in the form or formless realms; contrasted with meritorious and demeritorious karma of the desire realm.","find":["不動業"],"src":"course","first":{"day":"62","line":"0319b03"}},{"id":"four-kinds-karma","zh":"黑黑業","skt":"—","en":"dark and bright karma","plain":"Dark, bright, mixed, and the karma that ends all karma.","def":"Dark with dark ripening (demerit); bright with bright ripening (unmoving karma); mixed (merit of the desire realm); neither dark nor bright, without ripening, which ends all karma (the uncontaminated path).","find":["黑黑異熟"],"src":"course","first":{"day":"62","line":"0319b08"}},{"id":"pratimoksa","zh":"別解脫律儀","skt":"prātimokṣa-saṃvara","en":"prātimokṣa restraint","plain":"The restraint of the precepts.","def":"One of three restraints, with the restraint of meditative absorption and uncontaminated restraint.","find":["別解脫律儀"],"src":"course","first":{"day":"62","line":"0319b29"}},{"id":"pratityasamutpada","zh":"緣起","skt":"pratītyasamutpāda","en":"dependent origination","plain":"Everything arises in dependence on conditions; the twelve links of saṃsāra.","def":"Identified with the transmigration of birth; \"free of any controlling being\"; taught to reveal both defilement (forward order) and purification (reverse order).","find":["緣起"],"src":"course","first":{"day":"08","line":"0285b20"}},{"id":"projecting-cause","zh":"引因","skt":"ākṣepa-hetu","en":"projecting cause","plain":"Past ignorance and karma planting the seeds of the next life.","def":"Ignorance, formations, and consciousness project the seeds of name-and-form, the six sense-bases, contact, and feeling for a future existence.","find":["牽引因"],"src":"course","first":{"day":"34","line":"0301b09"}},{"id":"generating-cause","zh":"生因","skt":"nirvṛtti-hetu","en":"generating cause","plain":"Craving and grasping watering those seeds so a new life arises.","def":"Craving and grasping moisten the projected cause, which is then called becoming (有), the generating cause of birth.","find":["生起因"],"src":"course","first":{"day":"16","line":"0290a07"}},{"id":"two-liberations","zh":"慧解脫","skt":"prajñā-vimukti","en":"liberation through wisdom; liberation of mind","plain":"Freedom from ignorance, and freedom from craving.","def":"When ignorance is cut, liberation through wisdom (慧解脫); when craving is extinguished, liberation of mind (心解脫).","find":["慧解脫"],"src":"course","first":{"day":"65","line":"0321c22"}},{"id":"two-nirvanas","zh":"有餘依涅槃","skt":"sopadhiśeṣa-nirvāṇa","en":"nirvāṇa with and without remainder","plain":"Liberation while the body remains, and after it ends.","def":"Nirvāṇa with remainder (有餘依) is liberation while still embodied; without remainder (無餘依), after the body ends. The sixteenth and seventeenth stages.","find":["有餘依"],"src":"course","first":{"day":"01","line":"0279a08"}},{"id":"samahita-bhumi","zh":"三摩呬多地","skt":"samāhitā bhūmiḥ","en":"the Stage of Meditative Absorption","plain":"The sixth stage: the treatise's manual of concentration.","def":"Sixth of the seventeen stages (fascicles 11–13): the dhyānas, liberations, concentrations, and attainments, with the hindrances, attentions, and marks of practice.","find":["三摩呬多地"],"src":"course","first":{"day":"01","line":"0279a08"}},{"id":"dhyana","zh":"靜慮","skt":"dhyāna","en":"dhyāna; meditative absorption","plain":"The four levels of deep concentration of the form realm.","def":"First, with applied and sustained thought, from seclusion; second, without thought, from concentration; third, renouncing joy; fourth, purified equanimity and mindfulness. Balanced in calm and wisdom.","find":["四靜慮"],"src":"course","first":{"day":"09","line":"0285b27"}},{"id":"five-hindrances","zh":"五蓋","skt":"pañca nīvaraṇāni","en":"the five hindrances","plain":"Sense desire, ill will, dullness and drowsiness, restlessness and remorse, doubt.","def":"The obstacles to concentration; each has its \"food\" (what nourishes it) and \"non-food\" (what starves it): impurity, loving-kindness, light, calm, and dependent origination respectively.","find":["五蓋"],"src":"course","first":{"day":"55","line":"0314c19"}},{"id":"eight-liberations","zh":"八解脫","skt":"aṣṭau vimokṣāḥ","en":"the eight liberations","plain":"Eight progressively deeper meditations that release attachment.","def":"Also called the eight renunciations; they use perceptions of unattractiveness and beauty, the formless spheres, and cessation to cut the afflictions of the three realms.","find":["八解脫"],"src":"course","first":{"day":"76","line":"0328c17"}},{"id":"three-gates","zh":"三三摩地","skt":"trayaḥ samādhayaḥ","en":"the three concentrations (gateways of liberation)","plain":"Emptiness, aimlessness, and signlessness.","def":"Concentrations on emptiness (空), aimlessness (無願), and signlessness (無相).","find":["空、無願、無相"],"src":"course","first":{"day":"76","line":"0328c21"}},{"id":"four-immeasurables","zh":"四無量","skt":"catvāry apramāṇāni","en":"the four immeasurables; Brahmā-abidings","plain":"Loving-kindness, compassion, sympathetic joy, and equanimity, extended to all beings.","def":"Antidotes to ill will, harm, displeasure (envy), and craving-and-aversion; called Brahmā-abidings (梵住), \"pure abidings\", shared by ordinary and noble practitioners.","find":["慈、悲、喜、捨"],"src":"course","first":{"day":"90","line":"0338a03"}},{"id":"four-reliances","zh":"四依","skt":"catvāri pratiśaraṇāni","en":"the four reliances","plain":"Rely on the Dharma, the meaning, the definitive sūtras, and wisdom.","def":"The Dharma, not the person; the meaning, not the letter; sūtras of definitive meaning, not provisional; wisdom, not (discriminating) consciousness.","find":["四依"],"src":"course","first":{"day":"82","line":"0332b26"}},{"id":"seven-attentions","zh":"七種作意","skt":"sapta manaskārāḥ","en":"the seven root attentions","plain":"The seven stages by which attention leads the mind into a dhyāna.","def":"Knowing the marks, resolute conviction, seclusion, delight-in-gathering, investigation, consummation of means, and the fruit of consummation.","find":["了相作意"],"src":"course","first":{"day":"82","line":"0332c03"}},{"id":"signless-concentration","zh":"無相心定","skt":"animitta-cetaḥ-samādhi","en":"signless concentration of mind","plain":"A concentration that cuts even attachment to equanimity.","def":"Releases the faculty of equanimity by cutting its seed; within it feelings may still occur, but without affliction.","find":["無相心定"],"src":"course","first":{"day":"80","line":"0331b24"}},{"id":"sruta-bhumi","zh":"聞所成地","skt":"śrutamayī bhūmi","en":"Stage Attained Through Hearing","plain":"The tenth stage: what must be learned, from Buddhist teaching to the secular sciences.","def":"Fascicles 13–15. Organised around the five sciences (五明處): inner (Buddhist) knowledge, logic, grammar, medicine, and crafts. Hearing is the first of the three wisdoms (hearing, reflection, cultivation) through which all three vehicles progress.","find":[],"src":"course","first":{"day":"01","line":"0279a08"}},{"id":"cinta-bhumi","zh":"思所成地","skt":"cintāmayī bhūmi","en":"Stage Attained Through Reflection","plain":"The eleventh stage: sorting what exists from what does not, and reflecting on the scriptures.","def":"Fascicles 16–19. Three aspects: purity of self-nature (nine marks of pure reflection), reflection on what is to be known (what exists and does not), and reflection on the teachings, including the verses of ultimate meaning on non-self, the verses of intent on the three trainings, and the verses of essential body.","find":[],"src":"course","first":{"day":"01","line":"0279a08"}},{"id":"bhavana-bhumi","zh":"修所成地","skt":"bhāvanāmayī bhūmi","en":"Stage Attained Through Cultivation","plain":"The twelfth stage: the conditions, causes, practice, and fruit of meditative cultivation.","def":"Fascicle 20. Four places (the place, causes, practice, and fruit of cultivation) unfolded as seven branches: favourable birth, full hearing of the teaching, nirvāṇa as the aim, ripening of liberating wisdom, cultivating remedies, mundane purity, and supramundane purity.","find":[],"src":"course","first":{"day":"01","line":"0279a08"}},{"id":"three-trainings","zh":"三學","find":["增上戒學","增上心學","增上慧學"],"skt":"triśikṣā","en":"the three trainings","plain":"Training in moral discipline, in concentration (\"higher mind\"), and in wisdom, each resting on the one before.","def":"The higher training in moral discipline (adhiśīla), in mind (adhicitta, i.e. concentration), and in wisdom (adhiprajñā). The treatise's verses of intent (fascicles 16–17) present them as the means to realise non-self: precepts calm the scattered, concentration settles the unsettled, wisdom frees the settled mind.","src":"course","first":{"day":"93","line":"0340a26"}},{"id":"gotra","zh":"種姓","skt":"gotra","en":"spiritual lineage","plain":"The innate capacity, like a seed, that lets a person attain liberation when conditions come together.","def":"Defined at the start of the Śrāvaka Stage (fascicle 21) as a seed, \"a distinctive feature of the six sense bases continuing from beginningless time\". It is subtle before it bears fruit and coarse after. Yogācāra holds that some beings lack the lineage for nirvāṇa; the teachers stress that no ordinary person can tell who they are.","find":[],"src":"course","first":{"day":"07","line":"0284c10"}},{"id":"sravaka-bhumi","zh":"聲聞地","skt":"śrāvakabhūmi","en":"Śrāvaka Stage; Stage of the Hearers","plain":"The thirteenth stage: the treatise's long manual of meditation for disciples who attain liberation by hearing the Buddha's teaching.","def":"Fascicles 21–34. Four yogic processes (yogasthāna): the stages of lineage, entry, and departure; then the practitioner, the method, and the fruit of practice. Contains the treatise's most detailed teaching on calm (śamatha) and insight (vipaśyanā).","find":[],"src":"course","first":{"day":"01","line":"0279a08"}},{"id":"nirodha-samapatti","zh":"滅盡定","find":["滅定","想受滅"],"skt":"nirodhasamāpatti","en":"attainment of cessation","plain":"A meditative state in which perception and feeling, and the active mind, cease for a time.","def":"Attainable by non-returners and arhats; the \"foremost abiding\". In fascicle 18 the treatise reads \"grasping-free and lodging-free\" as this attainment: perception is \"grasping\", feeling is \"lodging\", and here both are absent.","src":"course","first":{"day":"21","line":"0293c07"}},{"id":"nine-stages","zh":"九種住心","find":["九種心住"],"skt":"navākārā cittasthiti","en":"nine stages of mental abiding","plain":"The nine steps by which the mind is settled in calm: from first binding it inward to effortless equipoise.","def":"Inward abiding, continuous abiding, patched abiding, close abiding, taming, pacifying, thorough pacifying, single-pointed continuity, equipoise (fascicle 30). They are accomplished by six powers (hearing, reflection, recollection, clear comprehension, diligence, habituation) and run through four kinds of attention (forced, interrupted, uninterrupted, effortless). The classical map of śamatha in Indian and Tibetan Buddhism.","src":"course","first":{"day":"79","line":"0330b21"}},{"id":"thirty-seven-factors","zh":"三十七菩提分","find":["菩提分法"],"skt":"saptatriṃśad bodhipakṣyā dharmāḥ","en":"thirty-seven factors of awakening","plain":"The complete set of practices leading to awakening, from the foundations of mindfulness to the eightfold path.","def":"Four foundations of mindfulness, four right efforts, four bases of power, five faculties, five powers, seven factors of awakening, and the noble eightfold path (fascicles 28–29). The treatise presents them as a progression: the foundations dispel distortion; the efforts and bases of power build concentration; the faculties and powers ripen into warmth, summit, forbearance, and the highest worldly dharma; the factors of awakening arise at the path of seeing; the eightfold path continues through cultivation.","src":"course","first":{"day":"22","line":"0294a26"}},{"id":"four-truths","zh":"四聖諦","skt":"catvāri āryasatyāni","en":"four noble truths","plain":"Suffering, its origin, its cessation, and the path: like illness, its cause, health, and medicine.","def":"Each truth has four aspects (sixteen in all): suffering is impermanent, suffering, empty, non-self; origin is cause, accumulation, arising, condition; cessation is extinction, stillness, sublimity, freedom; the path is path, fitting way, practice, departure (fascicle 34). Their direct realisation (現觀) is stream-entry.","find":[],"src":"course","first":{"day":"22","line":"0294a26"}},{"id":"vajropama-samadhi","zh":"金剛喻定","skt":"vajropama-samādhi","en":"diamond-like concentration","plain":"The final concentration of one in training, which cuts the last seeds of affliction; arhatship follows immediately.","def":"\"Just as a diamond can cut every other gem while none can cut it\", this concentration destroys every remaining affliction abandoned on the path of cultivation (fascicle 34). Also mentioned at the end of the Stage Attained Through Cultivation (fascicle 20).","find":[],"src":"course","first":{"day":"175","line":"0394c16"}},{"id":"pratyekabuddha","zh":"獨覺","skt":"pratyekabuddha","en":"solitary buddha","plain":"One who awakens without a teacher, in an age with no Buddha, and teaches by example rather than by words.","def":"The fourteenth stage (end of fascicle 34) describes their lineage (thin affliction, thin compassion, a wish to awaken without teacher or rival), three paths of preparation over many lives, and two kinds: the \"rhinoceros horn\" who lives alone and those who practise in groups.","find":[],"src":"course","first":{"day":"01","line":"0279a08"}},{"id":"eye-c","zh":"眼識","skt":"cakṣur-vijñāna","en":"eye consciousness","plain":"Depending on the eye faculty, it knows visible form as it is present — seeing, without yet naming or judging.","def":"As for eye consciousness: it is produced from a seed in the ālayavijñāna; it depends on the eye faculty and turns together with it; it takes visible form as its object; and its nature is to discriminate. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: Mind","find":[],"src":"dharmas","first":{"day":"01","line":"0279a24"}},{"id":"ear-c","zh":"耳識","skt":"śrotra-vijñāna","en":"ear consciousness","plain":"Depending on the ear faculty, it knows sound. The first five consciousnesses share one structure; each simply has its own faculty and object.","def":"As for eye consciousness: it is produced from a seed in the ālayavijñāna; it depends on the eye faculty and turns together with it; it takes visible form as its object; and its nature is to discriminate. … So it should be understood for the rest, down to body consciousness. The differences among them are these: each depends on its own faculty, each takes its own object, and each discriminates separately. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: Mind","find":[],"src":"dharmas","first":{"day":"01","line":"0279a24"}},{"id":"nose-c","zh":"鼻識","skt":"ghrāṇa-vijñāna","en":"nose consciousness","plain":"Depending on the nose faculty, it knows smell.","def":"So it should be understood for the rest, down to body consciousness. The differences among them are these: each depends on its own faculty, each takes its own object, and each discriminates separately. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: Mind","find":[],"src":"dharmas","first":{"day":"01","line":"0279a24"}},{"id":"tongue-c","zh":"舌識","skt":"jihvā-vijñāna","en":"tongue consciousness","plain":"Depending on the tongue faculty, it knows taste.","def":"So it should be understood for the rest, down to body consciousness. The differences among them are these: each depends on its own faculty, each takes its own object, and each discriminates separately. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: Mind","find":[],"src":"dharmas","first":{"day":"01","line":"0279a24"}},{"id":"body-c","zh":"身識","skt":"kāya-vijñāna","en":"body consciousness","plain":"Depending on the body faculty, it knows the tangible — warmth, cold, softness, hardness.","def":"So it should be understood for the rest, down to body consciousness. The differences among them are these: each depends on its own faculty, each takes its own object, and each discriminates separately. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: Mind","find":[],"src":"dharmas","first":{"day":"01","line":"0279a24"}},{"id":"mind-c","zh":"意識","skt":"mano-vijñāna","en":"mind consciousness","plain":"The sixth consciousness, rooted in manas, can take any dharma as object — thinking, remembering, imagining, naming, judging. It is the main actor in both making karma and practising the path.","def":"As for mental consciousness: it is produced from a seed in the ālayavijñāna; it depends on the faculty of mentation and turns together with it; it takes as its object all things, both those held in common with the other consciousnesses and those not; and its nature is to discriminate. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: Mind","find":[],"src":"dharmas","first":{"day":"01","line":"0279b08"}},{"id":"manas","zh":"末那識","skt":"manas","en":"manas","plain":"The seventh consciousness, constantly deliberating, takes the ālayavijñāna to be a self and is always joined by four afflictions: self-delusion, self-view, self-conceit, and self-love. It is the deepest root of self-grasping.","def":"As for mentation: it is produced from a seed in the ālayavijñāna, and it turns back to take that very consciousness as its object. It is associated with self-delusion, self-love, the grasping at \"I\" and \"mine,\" and self-conceit — or else with the reverse of these. At all times its mode of activity is self-assertion, or else evenness. It turns together with that consciousness, and its nature is to discriminate. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: Mind","find":[],"src":"dharmas","first":{"day":"00a","line":null}},{"id":"alaya","zh":"阿賴耶識","skt":"ālaya-vijñāna","en":"ālayavijñāna","plain":"The eighth consciousness stores all seeds, holds the body together, and manifests the world we live in. It carries life to life, and it is the ripened result of past karma.","def":"The ālayavijñāna is so called because it is able to store and gather all seeds, because it is able to store and gather the mark of self-conceit, and because it further takes the body as its object. (Treatise on the Five Aggregates, Ru-Yi translation)","cat":"Hundred Dharmas: Mind","find":[],"src":"dharmas","first":{"day":"00a","line":null}},{"id":"attention","zh":"作意","skt":"manaskāra","en":"attention","plain":"It rouses the mind and turns it towards an object — the first step of every act of knowing.","def":"","cat":"Hundred Dharmas: Mental Factors › Universal","find":[],"src":"dharmas","first":{"day":"01","line":"0279b19"}},{"id":"contact","zh":"觸","skt":"sparśa","en":"contact","plain":"When faculty, object, and consciousness come together, contact lets mind and its factors meet the object. Feeling, perception, and volition all depend on it.","def":"","cat":"Hundred Dharmas: Mental Factors › Universal","find":[],"src":"dharmas","first":{"day":"01","line":"0279b19"}},{"id":"feeling","zh":"受","skt":"vedanā","en":"feeling","plain":"The experience of an object as pleasant, painful, or neither. Pleasant feeling draws craving; painful feeling draws aversion.","def":"","cat":"Hundred Dharmas: Mental Factors › Universal","find":[],"src":"dharmas","first":{"day":"01","line":"0279b19"}},{"id":"perception","zh":"想","skt":"saṃjñā","en":"perception","plain":"It takes the image of an object, picks out its features, and gives it a name: \"this is red,\" \"this is a flower.\"","def":"","cat":"Hundred Dharmas: Mental Factors › Universal","find":[],"src":"dharmas","first":{"day":"01","line":"0279b19"}},{"id":"volition","zh":"思","skt":"cetanā","en":"volition","plain":"It drives the mind to act; volition is what karma essentially is. Every wholesome or unwholesome deed has volition as its substance.","def":"","cat":"Hundred Dharmas: Mental Factors › Universal","find":[],"src":"dharmas","first":{"day":"01","line":"0279a08"}},{"id":"aspiration","zh":"欲","skt":"chanda","en":"aspiration","plain":"A wish towards what is desired. Wholesome aspiration is the basis of diligence. In itself it is not the same as craving.","def":"","cat":"Hundred Dharmas: Mental Factors › Particular","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"resolve","zh":"勝解","skt":"adhimokṣa","en":"resolve","plain":"Firm confirmation of something already settled — a conviction others cannot talk you out of.","def":"","cat":"Hundred Dharmas: Mental Factors › Particular","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"recollection","zh":"念","skt":"smṛti","en":"recollection","plain":"Clear, unforgetting recall of what has become familiar. Right recollection is the basis of concentration.","def":"","cat":"Hundred Dharmas: Mental Factors › Particular","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"concentration","zh":"定","skt":"samādhi","en":"concentration","plain":"Keeping the mind on what it contemplates, undistracted. Concentration gives rise to wisdom.","def":"","cat":"Hundred Dharmas: Mental Factors › Particular","find":[],"src":"dharmas","first":{"day":"246","line":"0441a07"}},{"id":"wisdom","zh":"慧","skt":"prajñā","en":"wisdom","plain":"Discerning and sorting out what is contemplated, so that doubt is cut off. It can be correct, or it can be defiled.","def":"","cat":"Hundred Dharmas: Mental Factors › Particular","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"faith","zh":"信","skt":"śraddhā","en":"faith","plain":"Deep acceptance of what is true, joy in the virtues of the Three Jewels, and confidence that one can attain them. Faith makes the mind clear, as a water-clearing gem clears muddy water.","def":"","cat":"Hundred Dharmas: Mental Factors › Wholesome","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"diligence","zh":"精進","skt":"vīrya","en":"diligence","plain":"Courageous, unflagging effort in abandoning the harmful and cultivating the good. The antidote to laziness.","def":"","cat":"Hundred Dharmas: Mental Factors › Wholesome","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"shame","zh":"慚","skt":"hrī","en":"sense of shame","plain":"Out of self-respect and regard for the Dharma, one honours the good and refuses to do wrong. It looks inward: \"I should not do this.\"","def":"","cat":"Hundred Dharmas: Mental Factors › Wholesome","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"embarrassment","zh":"愧","skt":"apatrāpya","en":"sense of embarrassment","plain":"Out of regard for the world's judgement, one rejects harmful conduct. It looks outward: \"What would others think?\"","def":"","cat":"Hundred Dharmas: Mental Factors › Wholesome","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"non-greed","zh":"無貪","skt":"alobha","en":"non-greed","plain":"Non-attachment to existence and its enjoyments. The antidote to craving.","def":"","cat":"Hundred Dharmas: Mental Factors › Wholesome","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"non-hatred","zh":"無瞋","skt":"adveṣa","en":"non-hatred","plain":"No hostility towards suffering or its causes; its nature is loving-kindness. The antidote to hatred.","def":"","cat":"Hundred Dharmas: Mental Factors › Wholesome","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"non-delusion","zh":"無癡","skt":"amoha","en":"non-delusion","plain":"Clear understanding of things and principles. The antidote to delusion.","def":"","cat":"Hundred Dharmas: Mental Factors › Wholesome","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"pliancy","zh":"輕安","skt":"praśrabdhi","en":"pliancy","plain":"Body and mind freed from heaviness, light and workable for practice. A sign of concentration; the antidote to torpor.","def":"","cat":"Hundred Dharmas: Mental Factors › Wholesome","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"heedfulness","zh":"不放逸","skt":"apramāda","en":"heedfulness","plain":"Relying on diligence and the three wholesome roots, it guards against harm and cultivates the good. Not a separate entity — it is how those four work together.","def":"","cat":"Hundred Dharmas: Mental Factors › Wholesome","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"equanimity","zh":"行捨","skt":"upekṣā","en":"equanimity of formations","plain":"Lets the mind rest evenly, upright, without effort, free of restlessness. This is equanimity among formations — not the neutral feeling.","def":"","cat":"Hundred Dharmas: Mental Factors › Wholesome","find":[],"src":"dharmas","first":null},{"id":"non-harming","zh":"不害","skt":"ahiṃsā","en":"non-harming","plain":"Not harming sentient beings; its nature is compassion. The antidote to harmfulness.","def":"","cat":"Hundred Dharmas: Mental Factors › Wholesome","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"craving","zh":"貪","skt":"rāga","en":"craving","plain":"Defiled attachment to the five appropriated aggregates. It produces suffering.","def":"","cat":"Hundred Dharmas: Mental Factors › Root Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"hatred","zh":"瞋","skt":"pratigha","en":"hatred","plain":"Delight in harming beings; hostility towards suffering and its causes. It is the basis of unease and harmful deeds.","def":"","cat":"Hundred Dharmas: Mental Factors › Root Afflictions","find":[],"src":"dharmas","first":{"day":"59","line":"0317c08"}},{"id":"conceit","zh":"慢","skt":"māna","en":"conceit","plain":"Exalting oneself over others. Feeling superior, equal, or even inferior — whenever the mind puffs itself up, it is conceit. There are seven kinds.","def":"","cat":"Hundred Dharmas: Mental Factors › Root Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"delusion","zh":"無明","skt":"avidyā","en":"delusion","plain":"Also called 癡. Not knowing karma and its fruit, the truths, or the Three Jewels. All defilement depends on it.","def":"","cat":"Hundred Dharmas: Mental Factors › Root Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"doubt","zh":"疑","skt":"vicikitsā","en":"doubt","plain":"Wavering about the truths, which blocks wholesome states from arising.","def":"","cat":"Hundred Dharmas: Mental Factors › Root Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"wrong-view","zh":"不正見","skt":"dṛṣṭi","en":"wrong view","plain":"Defiled wisdom that reasons upside-down. It has five forms: view of a self, extremist view, wrong view proper, clinging to views, and clinging to rules and rituals.","def":"","cat":"Hundred Dharmas: Mental Factors › Root Afflictions","find":[],"src":"dharmas","first":null},{"id":"wrath","zh":"忿","skt":"krodha","en":"wrath","plain":"A sudden flare of anger at some present harm, ready to strike. A phase of hatred.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"resentment","zh":"恨","skt":"upanāha","en":"resentment","plain":"After the anger passes, holding the grudge and nursing enmity, which burns oneself.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"vexation","zh":"惱","skt":"pradāśa","en":"vexation","plain":"Prompted by wrath and resentment, it dwells on old grievances and lashes out with harsh, stinging words.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"concealment","zh":"覆","skt":"mrakṣa","en":"concealment","plain":"Hiding one's own wrongdoing for fear of losing gain or reputation; it leads to later remorse.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"deceit","zh":"誑","skt":"māyā","en":"deceit","plain":"Pretending to virtues one lacks, for gain or praise.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"flattery","zh":"諂","skt":"śāṭhya","en":"flattery","plain":"A crooked mind that ingratiates and maneuvers to win people over or cover its faults, closed to honest advice.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"arrogance","zh":"憍","skt":"mada","en":"arrogance","plain":"Intoxicated pride in one's own fortunes — family, looks, talent.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"harmfulness","zh":"害","skt":"vihiṃsā","en":"harmfulness","plain":"Lack of compassion that injures and oppresses beings. A phase of ha
