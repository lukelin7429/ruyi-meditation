tred; the opposite of non-harming.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"envy","zh":"嫉","skt":"īrṣyā","en":"envy","plain":"Unable to bear another's success, for the sake of one's own gain; it brings gloom.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"stinginess","zh":"慳","skt":"mātsarya","en":"stinginess","plain":"Clinging to possessions — or to teachings — unwilling to give, hoarding.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"no-shame","zh":"無慚","skt":"āhrīkya","en":"lack of shame","plain":"Disregarding one's conscience and the Dharma, scorning the good.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"no-embarrassment","zh":"無愧","skt":"anapatrāpya","en":"lack of embarrassment","plain":"Disregarding the world's judgement, favouring the harmful.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"no-faith","zh":"不信","skt":"āśraddhya","en":"lack of faith","plain":"No acceptance or joy towards what is true, virtuous, and possible; the mind stays murky. It is the basis of laziness.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"laziness","zh":"懈怠","skt":"kausīdya","en":"laziness","plain":"Sluggishness in abandoning harm and cultivating good. Even energy spent on harmful things counts as laziness.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"heedlessness","zh":"放逸","skt":"pramāda","en":"heedlessness","plain":"Neither guarding against harm nor cultivating good — drifting at will. It rests on craving, hatred, delusion, and laziness and has no separate entity.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"torpor","zh":"惛沈","skt":"styāna","en":"torpor","plain":"The mind heavy and dull, unworkable. It obstructs pliancy and insight.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"restlessness","zh":"掉舉","skt":"auddhatya","en":"restlessness","plain":"The mind not still, bobbing outward. It obstructs equanimity and calm abiding.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"forgetfulness","zh":"失念","skt":"muṣitasmṛtitā","en":"forgetfulness","plain":"Failing to keep the object clearly in mind — defiled recollection. Distraction arises from it.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"33","line":"0300c17"}},{"id":"incorrect-knowledge","zh":"不正知","skt":"asaṃprajanya","en":"incorrect knowledge","plain":"Misunderstanding what is observed and losing proper awareness of one's own actions, which leads to transgression.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"distraction","zh":"散亂","skt":"vikṣepa","en":"distraction","plain":"The mind wandering from object to object. It obstructs right concentration.","def":"","cat":"Hundred Dharmas: Mental Factors › Secondary Afflictions","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"sleep","zh":"睡眠","skt":"middha","en":"sleep","plain":"Makes the body heavy and the mind dim and contracted. Good and bad people alike sleep, so it is indeterminate.","def":"","cat":"Hundred Dharmas: Mental Factors › Indeterminate","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"regret","zh":"惡作","skt":"kaukṛtya","en":"regret","plain":"Literally \"disliking what was done\": remorse over what one did or failed to do. Regretting harm is wholesome; regretting good is not. It obstructs calm.","def":"","cat":"Hundred Dharmas: Mental Factors › Indeterminate","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"coarse-thought","zh":"尋","skt":"vitarka","en":"coarse discursive thought","plain":"Rough searching through inner speech; the mind moves quickly and coarsely.","def":"","cat":"Hundred Dharmas: Mental Factors › Indeterminate","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"subtle-thought","zh":"伺","skt":"vicāra","en":"subtle discursive thought","plain":"Fine examining through inner speech; the mind moves subtly.","def":"","cat":"Hundred Dharmas: Mental Factors › Indeterminate","find":[],"src":"dharmas","first":{"day":"03","line":"0280b13"}},{"id":"eye","zh":"眼","skt":"cakṣus","en":"eye","plain":"The eye faculty: not the eyeball, but the subtle, translucent matter within it that lets eye consciousness arise.","def":"","cat":"Hundred Dharmas: Form","find":[],"src":"dharmas","first":{"day":"109","line":"0350c24"}},{"id":"ear","zh":"耳","skt":"śrotra","en":"ear","plain":"The ear faculty: translucent matter that lets ear consciousness arise.","def":"","cat":"Hundred Dharmas: Form","find":[],"src":"dharmas","first":{"day":"228","line":"0430b18"}},{"id":"nose","zh":"鼻","skt":"ghrāṇa","en":"nose","plain":"The nose faculty: translucent matter that lets nose consciousness arise.","def":"","cat":"Hundred Dharmas: Form","find":[],"src":"dharmas","first":{"day":"228","line":"0430b18"}},{"id":"tongue","zh":"舌","skt":"jihvā","en":"tongue","plain":"The tongue faculty: translucent matter that lets tongue consciousness arise.","def":"","cat":"Hundred Dharmas: Form","find":[],"src":"dharmas","first":{"day":"228","line":"0430b18"}},{"id":"body","zh":"身","skt":"kāya","en":"body","plain":"The body faculty: translucent matter throughout the body that lets body consciousness arise.","def":"","cat":"Hundred Dharmas: Form","find":[],"src":"dharmas","first":{"day":"228","line":"0430b18"}},{"id":"visible","zh":"色","skt":"rūpa","en":"form","plain":"The object of the eye: colour, shape, and expressive movement.","def":"","cat":"Hundred Dharmas: Form","find":[],"src":"dharmas","first":{"day":"16","line":"0290b06"}},{"id":"sound","zh":"聲","skt":"śabda","en":"sound","plain":"The object of the ear: sounds from living beings, from inanimate things, or from both.","def":"","cat":"Hundred Dharmas: Form","find":[],"src":"dharmas","first":{"day":"16","line":"0290b06"}},{"id":"smell","zh":"香","skt":"gandha","en":"smell","plain":"The object of the nose: pleasant, unpleasant, and other smells.","def":"","cat":"Hundred Dharmas: Form","find":[],"src":"dharmas","first":{"day":"16","line":"0290b06"}},{"id":"taste","zh":"味","skt":"rasa","en":"taste","plain":"The object of the tongue: sweet, sour, salty, pungent, bitter, bland.","def":"","cat":"Hundred Dharmas: Form","find":[],"src":"dharmas","first":{"day":"16","line":"0290b06"}},{"id":"tangible","zh":"觸","skt":"spraṣṭavya","en":"touch","plain":"The object of the body: the four elements, plus smoothness, roughness, weight, cold, hunger, thirst. Note: this is the tangible object, not the universal mental factor \"contact.\"","def":"","cat":"Hundred Dharmas: Form","find":[],"src":"dharmas","first":{"day":"01","line":"0279b19"}},{"id":"dharma-form","zh":"法處所攝色","skt":"dharmāyatana-saṃgṛhīta-rūpa","en":"form included in the dharma sense field","plain":"Form that only the mind consciousness can know — such as the \"precept body\" received at ordination (non-informative form), images arising in concentration, and atoms.","def":"","cat":"Hundred Dharmas: Form","find":[],"src":"dharmas","first":{"day":"21","line":"0293c06"}},{"id":"possession","zh":"得","skt":"prāpti","en":"possession","plain":"The state of having acquired something and not losing it — a seed, a mastery, or something present. Provisionally set up on seeds and active states.","def":"","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"life","zh":"命根","skt":"jīvitendriya","en":"life faculty","plain":"The span of one life fixed by past karma. Provisionally set up on the eighth consciousness's power to hold the body.","def":"","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"class","zh":"眾同分","skt":"nikāya-sabhāgatā","en":"class-commonality","plain":"What beings of one kind share — what makes humans human, for example.","def":"","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"ordinary","zh":"異生性","skt":"pṛthagjanatva","en":"state of an ordinary being","plain":"The state of an ordinary person who has not attained the noble dharmas; it lasts as long as the seeds cut at the path of seeing remain.","def":"","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"no-thought-att","zh":"無想定","skt":"asaṃjñi-samāpatti","en":"attainment of no-thought","plain":"A meditative attainment practised by outsiders who loathe perception: the first six consciousnesses stop. They mistake it for nirvana.","def":"","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"cessation-att","zh":"滅盡定","skt":"nirodha-samāpatti","en":"attainment of cessation","plain":"An attainment entered by noble ones for rest: the first six consciousnesses and the defiled part of the seventh all cease.","def":"","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"no-thought-fruit","zh":"無想報","skt":"āsaṃjñika","en":"ripened fruit of no-thought","plain":"The fruit of the attainment of no-thought: rebirth in the heaven of no-thought, where the first six consciousnesses long lie dormant.","def":"","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"word","zh":"名身","skt":"nāma-kāya","en":"word-groups","plain":"Words that name what a thing is, like \"eye.\"","def":"","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"phrase","zh":"句身","skt":"pada-kāya","en":"phrase-groups","plain":"Phrases that state how things differ, like \"all formations are impermanent.\"","def":"","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"syllable","zh":"文身","skt":"vyañjana-kāya","en":"syllable-groups","plain":"Letters and syllables — what words and phrases rest on.","def":"","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"birth","zh":"生","skt":"jāti","en":"birth","plain":"What was not, now is.","def":"","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"aging","zh":"老","skt":"jarā","en":"ageing","plain":"Change within a continuity, from before to after.","def":"","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"abiding","zh":"住","skt":"sthiti","en":"abiding","plain":"Continuing on for a time within a continuity.","def":"","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"impermanence","zh":"無常","skt":"anityatā","en":"impermanence","plain":"Passing away within a continuity. Birth, ageing, abiding, and impermanence are the four characteristics.","def":"","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"continuity","zh":"流轉","skt":"pravṛtti","en":"continuity","plain":"The unbroken chain of cause and effect.","def":"Flow: the unbroken continuity of cause and effect among formations. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"distinction","zh":"定異","skt":"pratiniyama","en":"fixed distinction","plain":"Each cause has its own fixed kind of effect — good brings happiness, harm brings suffering — never mixed up.","def":"Determinate difference: the distinctness of each cause and effect among formations. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"correspondence","zh":"相應","skt":"yoga","en":"correspondence","plain":"Cause and effect fit each other.","def":"Correspondence: the matching of cause to effect among formations. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"swiftness","zh":"勢速","skt":"java","en":"swift efficacy","plain":"The swiftness with which formations arise and pass on.","def":"Velocity: the swiftness of formations in their flowing on. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"sequence","zh":"次第","skt":"anukrama","en":"sequence","plain":"Formations flowing on one after another, in order.","def":"Sequence: the one-after-another flowing on of formations. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"direction","zh":"方","skt":"deśa","en":"direction","plain":"Direction in space — east, west, up, down — set up on the boundaries of form.","def":"Place: the pervasive demarcation of formations that are form. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"time","zh":"時","skt":"kāla","en":"time","plain":"Time: a label for formations arising and ceasing moment by moment — not some separate thing that flows.","def":"Time: the ever-renewed arising and ceasing of formations, moment upon moment. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"number","zh":"數","skt":"saṃkhyā","en":"number","plain":"One, two, three: numbers set up on things being distinct continuities.","def":"Number: the flowing on of formations as distinct continuities, each with its own substance and character. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"combination","zh":"和合性","skt":"sāmagrī","en":"combination","plain":"Conditions coming together so that something can happen.","def":"Combination: the meeting of the conditions of formations. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"non-combination","zh":"不和合性","skt":"asāmagrī","en":"non-combination","plain":"Conditions failing to come together, so that nothing happens.","def":"Non-combination: the divergence of the conditions of formations. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: Formations Dissociated from Mind","find":[],"src":"dharmas","first":null},{"id":"space","zh":"虛空無為","skt":"ākāśa","en":"space","plain":"Suchness free of all obstruction, like open space — hence provisionally called space.","def":"","cat":"Hundred Dharmas: The Unconditioned","find":[],"src":"dharmas","first":null},{"id":"pratisamkhya","zh":"擇滅無為","skt":"pratisaṃkhyā-nirodha","en":"cessation through discrimination","plain":"The cessation revealed when wisdom discerns and cuts off the afflictions — that is, nirvana.","def":"What is cessation through discrimination? A cessation that is freedom from bondage. What does this mean? It means that, through the antidote to the afflictions, the aggregates finally do not arise. (Treatise on the Five Aggregates, Ru-Yi translation)","cat":"Hundred Dharmas: The Unconditioned","find":[],"src":"dharmas","first":null},{"id":"apratisamkhya","zh":"非擇滅無為","skt":"apratisaṃkhyā-nirodha","en":"cessation not through discrimination","plain":"Cessation not by wisdom but because the conditions never come together, so the thing never arises. It also names suchness, pure from the start.","def":"What is cessation not through discrimination? A cessation that is not freedom from bondage. What does this mean? It means that, apart from the antidote to the afflictions, the aggregates finally do not arise. (Treatise on the Five Aggregates, Ru-Yi translation)","cat":"Hundred Dharmas: The Unconditioned","find":[],"src":"dharmas","first":null},{"id":"immovable","zh":"不動滅無為","skt":"āniñjya","en":"immovable cessation","plain":"Suchness disclosed in the fourth absorption, where pain and pleasure no longer shake the mind.","def":"The immovable: having become free of craving for the Universal Purity heaven, one attains the fourth meditative absorption, and in that interval there is release from bondage to pain and pleasure. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: The Unconditioned","find":[],"src":"dharmas","first":null},{"id":"cessation-pf","zh":"想受滅無為","skt":"saṃjñā-vedita-nirodha","en":"cessation of perception and feeling","plain":"Suchness disclosed in the attainment of cessation, where perception and feeling stop.","def":"The cessation of perception and feeling: having become free of craving for the sphere of nothingness, one enters the attainment of cessation, and in that interval those mind and mental factors that do not operate perpetually, together with a portion of those that do, cease — and this is release from bondage. (Xiǎnyáng Shèngjiào Lùn, fascicle 1, Ru-Yi translation)","cat":"Hundred Dharmas: The Unconditioned","find":[],"src":"dharmas","first":null},{"id":"suchness","zh":"真如無為","skt":"tathatā","en":"suchness","plain":"The true, unchanging nature of all dharmas — what the selflessness of persons and dharmas reveals. The other five unconditioned are names for this same suchness in different settings.","def":"","cat":"Hundred Dharmas: The Unconditioned","find":[],"src":"dharmas","first":null}],"built":"2026-11-20"}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const DAYS = DATA.days, GL = Object.fromEntries(DATA.glossary.map(g => [g.id, g]));
const KEY = 'ycb-reader-v1';
const store = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
store.done ||= {}; store.quiz ||= {}; store.fs ||= 1;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => E(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*([^*]+?)\*/g, '<i>$1</i>');
const $ = s => document.querySelector(s);
const label = d => d.kind === 'day' ? `Day ${d.id}` : `Introduction ${d.id === '00a' ? 1 : 2}`;
document.documentElement.style.setProperty('--fs', store.fs);
$('#fsm').onclick = () => { store.fs = Math.max(.85, +(store.fs - .1).toFixed(2)); document.documentElement.style.setProperty('--fs', store.fs); save(); };
$('#fsp').onclick = () => { store.fs = Math.min(1.5, +(store.fs + .1).toFixed(2)); document.documentElement.style.setProperty('--fs', store.fs); save(); };
$('#back').onclick = () => history.back();

function blocks(bl) {
  return bl.map(b => b.kind === 'p' ? `<p>${md(b.text)}</p>` :
    `<${b.kind}>${b.items.map(i => `<li>${md(i)}</li>`).join('')}</${b.kind}>`).join('');
}
function nextDay() { return DAYS.find(d => !store.done[d.id]) || DAYS[DAYS.length - 1]; }

function home() {
  const n = DAYS.filter(d => store.done[d.id]).length;
  const nx = nextDay();
  return `<section class="hero">
    <div class="kicker">瑜伽師地論 · Chinese–English</div>
    <h2>Yogācārabhūmi Reader</h2>
    <div class="zh">瑜伽師地論　中英共讀</div>
    <div class="meta">Twenty minutes a day: Xuánzàng's Chinese, Ru-Yi's English, notes from the lectures of Ven. Miào Jìng and Master Cháng Bǎi.</div>
    <div class="progress"><i style="width:${100 * n / DAYS.length}%"></i></div>
    <div class="meta">${n} of ${DAYS.length} read</div>
    <p style="margin-top:14px"><a class="btn" href="#/day/${nx.id}">${n ? 'Continue' : 'Start'}: ${E(label(nx))}</a></p>
  </section>
  <ul class="list">${DAYS.map(d => `<li class="${store.done[d.id] ? 'done' : ''}"><a href="#/day/${d.id}">
    <span class="num">${store.done[d.id] ? '✓' : d.id}</span>
    <span><div class="t">${E(d.title)}</div><div class="s">${E(label(d))}${d.kind === 'day' ? ` · Fascicle ${d.juan} · ${d.start}–${d.end}` : ''}${store.quiz[d.id] ? ` · quiz ${store.quiz[d.id]}` : ''}</div></span></a></li>`).join('')}</ul>
  <p class="foot">Chinese text: CBETA T30 no. 1579 (CC BY-NC-SA 4.0, non-commercial use). English translation: Ru-Yi Meditation Center. Your progress is kept on this device only.</p>`;
}

function day(id) {
  const d = DAYS.find(x => x.id === id);
  if (!d) return '<p>Not found.</p>';
  const k = DAYS.indexOf(d);
  let h = `<section class="hero"><div class="kicker">${E(label(d))}${d.kind === 'day' ? ` · Fascicle ${d.juan}` : ''}</div>
    <h2>${E(d.title)}</h2><div class="zh">${E(d.zh_title)}</div>
    ${d.kind === 'day' ? `<div class="meta">T1579 ${d.start}–${d.end} · about ${d.stats.zh.toLocaleString('en-GB')} characters · ${d.stats.en.toLocaleString('en-GB')} words of translation</div>` : `<div class="meta">${E(d.subtitle)}</div>`}</section>`;
  if (d.kind === 'intro') {
    h += `<article class="prose">${d.secs.map(s => `<div class="sec">${E(s.head)}</div>${s.subs.map(u => (u.head ? `<h4>${md(u.head)}</h4>` : '') + blocks(u.blocks)).join('')}`).join('')}</article>`;
  } else {
    const before = d.secs.find(s => s.head === 'Before you read');
    const com = d.secs.find(s => s.head === 'Commentary');
    if (before) h += `<div class="box prose"><h3>Before you read</h3>${before.subs.map(u => blocks(u.blocks)).join('')}</div>`;
    // 每則 commentary 掛在它〔行號〕所在的那一列之後
    const rows = d.items.filter(i => i.kind === 'row' || i.kind === 'gap');
    const attach = new Map(); const loose = [];
    (com ? com.subs : []).forEach(u => {
      let host = null;
      if (u.ref) host = rows.filter(r => r.line <= u.ref).pop();
      if (host) { if (!attach.has(host)) attach.set(host, []); attach.get(host).push(u); } else loose.push(u);
    });
    // 若同一列掛多則、或掛在本節後面一列更好讀：統一放在「該列所屬節的最後一列」之後
    let secRows = [], out = '';
    const flush = () => {
      if (!secRows.length) return;
      const notes = secRows.flatMap(r => attach.get(r) || []);
      secRows.forEach((r, i) => {
        const isLast = i === secRows.length - 1;
        const anchor = `r-${r.line}`;
        out += `<div class="pair ${r.kind === 'gap' ? 'gap' : ''}" id="${anchor}" data-line="${r.line}">
          <div class="zh"><span class="ln">${r.line === r.end ? r.line : r.line + '–' + r.end.slice(-3)}</span>${E(r.zh)}</div>
          <div class="en">${r.kind === 'gap' ? (r.zh.includes('意及種子') && r.zh.length < 15 ? 'Not yet in the Ru-Yi translation: “the manas and the seed support are as explained before.”' : 'Not yet in the Ru-Yi translation. The commentary summarises this passage.') : E(r.en)}</div>
          ${isLast && notes.length ? notes.map(u => `<details class="note"${notes.length === 1 ? ' open' : ''}><summary>${md(u.head)}</summary><div class="prose">${blocks(u.blocks)}</div></details>`).join('') : ''}
        </div>`;
      });
      secRows = [];
    };
    d.items.forEach(it => {
      if (it.kind === 'sec') { flush(); out += `<div class="sec"><span>§${it.num}</span>${E(it.title)}</div>`; }
      else if (it.kind === 'row' || it.kind === 'gap') secRows.push(it);
    });
    flush();
    h += out;
    if (loose.length) h += `<div class="box prose"><h3>More notes</h3>${loose.map(u => (u.head ? `<h4>${md(u.head)}</h4>` : '') + blocks(u.blocks)).join('')}</div>`;
  }
  if (d.new_terms.length) {
    h += `<div class="sec">New terms today</div><div class="chips">${d.new_terms.map(t => GL[t]).map(g => `<a class="chip" href="#/term/${g.id}"><b>${E(g.zh)}</b>${E(g.en)}</a>`).join('')}</div>`;
  }
  if (d.quiz.length) {
    h += `<div class="sec">Check yourself</div>` + d.quiz.map((q, i) => `<div class="q" data-a="${q.answer}" data-i="${i}">
      <p><b>${i + 1}.</b> ${md(q.q)}</p>${q.options.map((o, j) => `<button class="opt" data-j="${j}"><i>${'ABCD'[j]}</i><span>${md(o)}</span></button>`).join('')}
      <div class="why">${md(q.why)}<span class="src">${E(q.src)}</span></div></div>`).join('');
  }
  h += `<p style="margin-top:22px"><button class="btn ${store.done[d.id] ? 'ghost' : ''}" id="markdone">${store.done[d.id] ? '✓ Read — mark as unread' : 'Mark as read'}</button></p>
    <div class="navrow">${k > 0 ? `<a class="btn ghost" href="#/day/${DAYS[k - 1].id}">‹ ${E(label(DAYS[k - 1]))}</a>` : '<span></span>'}
    ${k < DAYS.length - 1 ? `<a class="btn ghost" href="#/day/${DAYS[k + 1].id}">${E(label(DAYS[k + 1]))} ›</a>` : ''}</div>
    ${d.kind === 'day' ? `<p class="meta">Full fascicle on the Ru-Yi site: <a href="/sutras/stages-of-yogic-practice/fascicle-${String(d.juan).padStart(3, '0')}/">Treatise on the Stages of Yogic Practice, Fascicle ${d.juan}</a></p>` : ''}
    <p class="foot">Chinese: CBETA T30 no. 1579 (CC BY-NC-SA 4.0). English: Ru-Yi Meditation Center, spelling in British form. Notes are the course's own, written from the lectures; they are not translations of the lectures.</p>`;
  return h;
}

function wireDay(id) {
  const d = DAYS.find(x => x.id === id);
  const b = $('#markdone');
  if (b) b.onclick = () => { store.done[id] = !store.done[id]; save(); render(); };
  let right = 0, seen = 0;
  document.querySelectorAll('.q').forEach(q => {
    q.querySelectorAll('.opt').forEach(o => o.onclick = () => {
      if (q.classList.contains('answered')) return;
      q.classList.add('answered');
      const a = +q.dataset.a, j = +o.dataset.j;
      q.querySelectorAll('.opt')[a].classList.add('right');
      if (j !== a) o.classList.add('wrong'); else right++;
      seen++;
      if (seen === d.quiz.length) { store.quiz[id] = `${right}/${seen}`; save(); }
    });
  });
}

let gfilter = 'all';
function glossary(q = '') {
  return `<section class="hero"><div class="kicker">Glossary · 名相</div><h2>Terms</h2>
    <div class="meta">${DATA.glossary.length} terms: the course's own entries plus the Hundred Dharmas. Tap a term for its definition and where it first appears.</div></section>
    <input class="search" id="gq" type="search" placeholder="Search Chinese, Sanskrit, or English" value="${E(q)}" autocomplete="off">
    <div class="filters">${[['all', 'All'], ['met', 'Met so far'], ['course', 'Course terms'], ['dharmas', 'Hundred Dharmas']].map(([k, t]) => `<button data-f="${k}" class="${gfilter === k ? 'on' : ''}">${t}</button>`).join('')}</div>
    <div id="glist"></div>`;
}
function glist(q) {
  const s = q.trim().toLowerCase();
  const strip = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const items = DATA.glossary.filter(g => {
    if (gfilter === 'course' && g.src !== 'course') return false;
    if (gfilter === 'dharmas' && g.src !== 'dharmas') return false;
    if (gfilter === 'met' && !(g.first && store.done[g.first.day])) return false;
    if (!s) return true;
    return [g.zh, g.skt, g.en, g.plain, g.def].some(f => f && (f.toLowerCase().includes(s) || strip(f).includes(strip(s))));
  });
  $('#glist').innerHTML = items.length ? items.map(g => `<a class="term" href="#/term/${g.id}"><div class="h"><b>${E(g.zh)}</b>${g.skt && g.skt !== '—' ? `<em>${E(g.skt)}</em>` : ''}<span>${E(g.en)}</span></div><div class="p">${E(g.plain)}</div></a>`).join('') : '<p class="muted">No matching terms.</p>';
}
function term(id) {
  const g = GL[id]; if (!g) return '<p>Not found.</p>';
  const f = g.first ? DAYS.find(d => d.id === g.first.day) : null;
  return `<div class="card"><div class="big">${E(g.zh)}</div>
    <dl>${g.skt && g.skt !== '—' ? `<dt>Sanskrit</dt><dd><i>${E(g.skt)}</i></dd>` : ''}
    <dt>English</dt><dd>${E(g.en)}</dd>
    <dt>In plain words</dt><dd>${E(g.plain)}</dd>
    ${g.def ? `<dt>Definition</dt><dd>${E(g.def)}</dd>` : ''}
    ${g.cat ? `<dt>Category</dt><dd>${E(g.cat)} · <a href="/dharma/yogacara/">Hundred Dharmas Map</a></dd>` : ''}
    <dt>First appears</dt><dd>${f ? `<a href="#/day/${f.id}${g.first.line ? '/' + g.first.line : ''}">${E(label(f))}${g.first.line ? ' · ' + g.first.line : ''} — ${E(f.title)}</a>` : '<span class="muted">Later in the treatise (not yet in this reader)</span>'}</dd></dl></div>`;
}

function render() {
  const h = location.hash.replace(/^#\/?/, '');
  const [p, a, b] = h.split('/');
  let html = '', title = 'Yogācārabhūmi Reader';
  ['n-home', 'n-today', 'n-gloss'].forEach(x => $('#' + x).classList.remove('on'));
  $('#back').hidden = !p;
  if (!p) { html = home(); $('#n-home').classList.add('on'); }
  else if (p === 'today') { location.replace('#/day/' + nextDay().id); return; }
  else if (p === 'day') {
    const dm = DAYS.find(d => d.id === a);
    if (dm && !dm.items && dm.kind === 'day' || dm && !dm.secs) {   // 每天內容按需載入（data/dNN.json）
      $('#view').innerHTML = '<p class="muted" style="padding:40px 0">Loading…</p>';
      fetch(`data/d${a}.json`).then(r => r.json()).then(full => { Object.assign(dm, full); render(); })
        .catch(() => { $('#view').innerHTML = '<p class="muted" style="padding:40px 0">This day could not be loaded. Check your connection and try again.</p>'; });
      return;
    }
    html = day(a); title = label(dm || {});
  }
  else if (p === 'glossary') { html = glossary(decodeURIComponent(a || '')); title = 'Glossary'; $('#n-gloss').classList.add('on'); }
  else if (p === 'term') { html = term(a); title = 'Glossary'; $('#n-gloss').classList.add('on'); }
  $('#view').innerHTML = html; $('#title').textContent = title;
  if (p === 'day') {
    wireDay(a);
    if (b) { const el = document.querySelector(`[data-line="${b}"]`) || [...document.querySelectorAll('.pair[data-line]')].filter(e => e.dataset.line <= b).pop();
      if (el) { el.scrollIntoView({block: 'center'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 2400); } }
    else window.scrollTo(0, 0);
  } else window.scrollTo(0, 0);
  if (p === 'glossary') {
    const q = $('#gq'); glist(q.value);
    q.oninput = () => glist(q.value);
    document.querySelectorAll('.filters button').forEach(btn => btn.onclick = () => { gfilter = btn.dataset.f; document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('on', x === btn)); glist(q.value); });
  }
}
addEventListener('hashchange', render);
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
