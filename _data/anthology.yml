live_texts: 1

jinglvyixiang:
  title_en: "A Comparative Compendium of Sūtra and Vinaya"
  title_zh: "經律異相"
  taisho_id: "T2121"
  compiler: "Bǎochàng and others, under imperial decree, Liang dynasty (516 CE)"
  total_fascicles: 50
  live_fascicles: 40
  volumes:
    - num: 1
      zh: "天部上"
      en: "Heavenly Beings, Part 1"
      note: "Complete: the tiers of gods across the desire and form realms, the cycles of cosmic destruction and renewal, and the sun, moon, stars, thunder, lightning, clouds, wind, and rain."
      status: live
    - num: 2
      zh: "天部下（欲色天人）"
      en: "Heavenly Beings, Part 2"
      note: "Complete: eleven stories — Śakra bowing to a dying jackal for the Dharma, his vow of non-retaliation, a near-rebirth as a donkey, and other tales of devas, giving, and rescue."
      status: live
    - num: 3
      zh: "地部"
      en: "The Earth"
      note: "Complete: Jambudvīpa's geography and the naming of Rājagṛha, Sudatta's purchase of Jetavana and Śāriputra's contest with the six heretic teachers, ten great mountains, eight legendary trees, and the paradise continent of Uttarakuru."
      status: live
    - num: 4
      zh: "應始終佛部第一"
      en: "The Buddha's Advent and Final Nirvāṇa, Part 1"
      note: "Complete: the compendium's own life of the Buddha — birth, the thirty-two marks, the four sights, six years of austerity, the defeat of Māra, and a long, detailed account of the final nirvāṇa at Kuśinagara."
      status: live
    - num: 5
      zh: "應身益物部第二"
      en: "The Buddha's Responsive Body Benefiting Beings, Part 2"
      note: "Complete: eighteen stories including three months eating horse fodder, taming the drunk elephant Nālāgiri, saving five hundred condemned bandits, and walking on water."
      status: live
    - num: 6
      zh: "現涅槃後事佛部第三"
      en: "Affairs Concerning the Buddha After His Nirvāṇa, Part 3"
      note: "Complete: the relic wars, King Aśoka's 84,000 stūpas, the Bodhi tree's journey to Sri Lanka, the Lotus Sūtra's jeweled-stūpa scene, the origin of Buddha images, and the Sūtra on the Extinction of the Dharma."
      status: live
    - num: 7
      zh: "諸釋部"
      en: "The Śākya Clan"
      note: "Complete: King Śuddhodana's death, Mahāprajāpatī's ordination as the first nun, Rāhula's birth and going forth, four cousins' ordinations, King Virūḍhaka's massacre of the Śākyas, and the past-life vow behind Chandaka and Kaṇṭhaka's devotion."
      status: live
    - num: 8
      zh: "自行菩薩部第一"
      en: "Bodhisattvas' Own Practice, Part 1"
      note: "Complete: Sadāprarudita selling his own flesh, Bhaiṣajyarāja's self-immolation, Kṣāntivādin's dismemberment, Aṅgulimāla's origin, and the Snow Mountain ascetic's half-verse on impermanence."
      status: live
    - num: 9
      zh: "外化菩薩部第二"
      en: "Bodhisattvas' Outward Teaching, Part 2"
      note: "Complete: Mañjuśrī's transformation of a woman's corpse and his retrieval of a bowl across seventy-two Ganges-sands of buddha-lands, Samantabhadra's vow to protect the Lotus Sūtra's teachers, Prince Samantadāna's dive for wish-granting pearls, two bodhisattvas who kill themselves to save a storm-wrecked ship, and the cowherd child who expounds the Prajñāpāramitā."
      status: live
    - num: 10
      zh: "隨機現身上菩薩部第三"
      en: "Bodhisattvas Manifesting Bodies to Fit Capacity, Part 3"
      note: "Complete: Śakra converting an old friend, a courtesan reborn as a king who feeds his own body to a tigress, King Śibi's ransom of a dove with his own flesh, the Śyāma Jātaka, Vasu's conversion of six million merchants, King Samantaprabha and the cannibal king, and three princes who give eyes, marrow, and blood to the sick."
      status: live
    - num: 11
      zh: "隨機見身下菩薩部第四"
      en: "Bodhisattvas Manifesting Bodies to Fit Capacity, Part 4"
      note: "Complete: a mountain of flesh that never depletes, a lion who tears his own flesh to ransom a monkey's stolen children, the Deer Park's founding story, the Nine-Colored Deer betrayed by the man he saved, a goose king's ransom, and a turtle king who carries a shipload of merchants to shore."
      status: live
    - num: 12
      zh: "出家菩薩僧部第一"
      en: "Monastic Bodhisattva-Monks, Part 1"
      note: "Complete: a slandered monk who proves his purity by levitation, a child converted by an inexhaustible bowl of food, Gaṅgā who sells himself to feed a beggar-sage, three women who each transform into a man to become monks, Mahallaka's secretly guided recitation, Sumedha's five dreams, and a monk whose compassion for a doomed puppy leads both to non-retrogression."
      status: live
    - num: 13
      zh: "聲聞無學僧部第二"
      en: "Arhat Śrāvaka Monks, Part 2"
      note: "Complete: Mahākāśyapa's marriage of two golden-skinned ascetics, his begging from a dying beggar woman, the First Council and expulsion of Ānanda, the taming of the three Kāśyapa brothers' fire-dragon, Subhūti's birth, and Aniruddha's past lives and present teaching."
      status: live
    - num: 14
      zh: "聲聞無學僧部第三"
      en: "Arhat Śrāvaka Monks, Part 3"
      note: "Complete: Śāriputra's birth and debate prowess, King Candraprabha's gift of his own head, the Ullambana Sūtra's origin of the Ghost Festival, Maudgalyāyana's jeweled bridge and subduing of two dragon kings, and his own two honest mistakes."
      status: live
    - num: 15
      zh: "聲聞無學僧部第四"
      en: "Arhat Śrāvaka Monks, Part 4"
      note: "Complete: Nanda, Kātyāyana, Kālodāyin, and above all Ānanda — his past life as the Buddha's own close friend, his seven prophetic dreams, a caṇḍāla mother's binding spell, and his elaborate testing of the monk Mountain-Facing before King Aśoka."
      status: live
    - num: 16
      zh: "聲聞無學僧部第五"
      en: "Arhat Śrāvaka Monks, Part 5"
      note: "Complete: the patriarchal line from Madhyāntika through Śāṇakavāsin to Upagupta, Lośaka's karmic inability to ever be fed, the boy-arhat Kumāra-Kāśyapa, and Mahinda's conversion of King Devānampiya Tissa, the founding moment of Sri Lankan Buddhism."
      status: live
    - num: 17
      zh: "聲聞無學僧部第六"
      en: "Arhat Śrāvaka Monks, Part 6"
      note: "Complete: the tragedy of Saṃghabala, murdered in the wilderness by his own brother's hired bandits; Cūḍapanthaka's broom mnemonic; a third telling of Aṅgulimāla; and the caṇḍāla boy Nīti, lifted bodily into the sky by the Buddha's own hand."
      status: live
    - num: 18
      zh: "聲聞無學僧部第七"
      en: "Arhat Śrāvaka Monks, Part 7"
      note: "Complete: 31 short arhat stories — Śroṇa-Koṭikarṇa's lute-string teaching, Upagupta's inventive cures for gluttony, sleep, and attachment in his own students, a matricide converted by Mañjuśrī, and three brief miracle fragments closing the fascicle."
      status: live
    - num: 19
      zh: "聲聞不測淺深僧部第八"
      en: "Śrāvakas of Unfathomable Depth, Part 8"
      note: "Complete: 24 stories where outward appearance misleads — Śakra's trick on a miser, monks bound by living grass rather than break a precept, the Ciñcā slander's karmic origin, a hungry ghost's own account of hell, and a monk who bares his belly to a hunter's arrow."
      status: live
    - num: 20
      zh: "聲聞學人僧部第九"
      en: "Śrāvaka Trainees, Part 9"
      note: "Complete: 10 stories of disciples still on the path — the Buddha's illusory woman exposing a householder's own conceit, a painted vase filled with filth teaching the body's impurity, a monk's fatal vow to rise from meditation, and the caṇḍāla executioner's seven sons destroyed for refusing to kill."
      status: live
    - num: 21
      zh: "聲聞現行惡行僧部第十"
      en: "Śrāvakas Who Committed Misdeeds, Part 10"
      note: "Complete: 12 stories, almost entirely Devadatta — his enmity's past-life origin, the drunk elephant Nālāgiri sent against the Buddha, four animal-fable past lives (fox, jackal, monkey, and the golden lion Firm-Vow), and Sunakṣatra's fall into hell for denying cause and effect."
      status: live
    - num: 22
      zh: "聲聞無學沙彌僧部第十一"
      en: "Arhat Novice-Monks, Part 11"
      note: "Complete: 11 stories of novices attaining full liberation while still children — twin infants recalling their own past lives, a boy raised on his dead mother's milk in her own tomb, a novice who takes his own life rather than break his precept, and the closing account of a novice reborn as a worm in a jar of cheese."
      status: live
    - num: 23
      zh: "聲聞無學學尼僧部第十二"
      en: "Arhat Nuns and Nun-Trainees, Part 12"
      note: "Complete: 14 stories of women who attained liberation — Bhadrā's memory of a servant girl's defiant generosity, Utpalavarṇā's mind left undefiled by an assault she never consented to, a poor widow's daughter risen to queen who renounces the throne itself, and the closing account of Cañcā's slander traced back through past lives."
      status: live
    - num: 24
      zh: "轉輪聖王諸國王部第一"
      en: "Wheel-Turning Sage Kings, Part 1"
      note: "Complete: 12 stories opening the compendium's section on kings — the cosmological origin of kingship, the seven treasures of a cakravartin, a king who carves a thousand lamps into his own flesh for half a verse, King Mandhātā's fatal envy of Śakra's throne told twice over, and King Aśoka's full arc from a boy's sand offering to total renunciation."
      status: live
    - num: 25
      zh: "行菩薩道上諸國王部第二"
      en: "Kings on the Bodhisattva Path, Part 2"
      note: "Complete: 11 stories of kings giving up body, wealth, and family for the Dharma — bodies carved into a thousand lamps twice over, King Śibi's flesh weighed against a dove, King Sutasoma's oath to a man-eating rākṣasa, and King Sarvadatta's own family sold into slavery to test a single vow to refuse no request."
      status: live
    - num: 26
      zh: "行菩薩道下諸國王部第三"
      en: "Kings on the Bodhisattva Path, Part 3"
      note: "Complete: 9 stories closing the compendium's section on kings — a king converted from blood sacrifice by the Buddha's own teaching, King Sarvadatta's offered head refused by a debtor, King Universal-Light's Prajñāpāramitā verse before a cannibal king, and Ajātaśatru's long dialogue with Mañjuśrī dissolving a doubt no buddha could resolve by argument alone."
      status: live
    - num: 27
      zh: "行聲聞道上諸國王部第四"
      en: "Kings on the Śrāvaka Path, Part 4"
      note: "Complete: 11 stories of kings converted through more ordinary encounters with the Dharma — a king awakened by the sound of a single bracelet, King Mahākapphiṇa's invasion halted by an illusory rival king, five kings taught the eight sufferings, and a monk's own kitchen-servitude traced to a single careless word toward his teacher."
      status: live
    - num: 28
      zh: "行聲聞道中諸國王部第五"
      en: "Kings on the Śrāvaka Path, Part 5"
      note: "Complete: 13 stories centered on Prasenajit and Bimbisāra — a rākṣasa-possessed usurper's reign of cannibalism, a servant girl's single generous act that leads to her becoming Queen Mallikā, Bimbisāra's guilt over an amputated finger, King Pukkusāti's fatal ordination, and the deva Rohitassa's ancient question of whether the world's edge can ever be reached."
      status: live
    - num: 29
      zh: "行聲聞道下諸國王部第六"
      en: "Kings on the Śrāvaka Path, Part 6"
      note: "Complete: 14 stories closing the compendium's long section on kings (fascicles 24-29) — a king born without eyes who governs by a divine eye, Anāthapiṇḍika's daughter Sumāgadhā converting an entire foreign kingdom, King Udayana's consort undamaged by a hundred arrows, and a servant who carries a bowl of oil past a stampede, a fire, and a hailstorm without spilling a drop."
      status: live
    - num: 30
      zh: "諸國王夫人部"
      en: "Queens"
      note: "Complete: 6 stories of royal consorts — an eight-year-old arhat novice who corrects Aśoka's own queen on propriety, the Licchavi clan's miraculous origin from a discarded piece of flesh, Queen Mallikā's quiet refusal of a beauty prize, and a dead queen who returns as a rākṣasa to force her own comfortable husband to finally seek liberation."
      status: live
    - num: 31
      zh: "行菩薩道長上諸國太子部上"
      en: "Crown Princes on the Bodhisattva Path, Part 1"
      note: "Complete: 8 stories including some of the most celebrated jātakas in the canon — Prince Mahāsattva feeding his own body to a starving tigress, the full Vessantara Jātaka of Prince Sudāna's total generosity, and the origin story of the physician Jīvaka, born to the courtesan Āmrapālī from a mango tree."
      status: live
    - num: 32
      zh: "諸國太子部（續）"
      en: "Crown Princes, Part 2"
      note: "Complete: 9 stories — two unreconciled sea-quests for the wish-fulfilling jewel, a brother blinded with bamboo spikes by his own brother, the Dīghāvu tale of a son forbidden to avenge his father, the ugly prince who wins back his bride by wit, the mute prince Mùpò speaking at the edge of his own grave, the Golden Light Sūtra's leaner tiger-feeding jātaka, and a rival life of the physician Jīvaka printed beside the one in fascicle 31."
      status: live
    - num: 33
      zh: "學聲聞道諸國太子部下"
      en: "Crown Princes on the Śrāvaka Path"
      note: "Complete: 6 stories, four fifths of it from the Aśoka cycle — the brother Vītāśoka made king for seven days with an executioner at the door and later beheaded for the bounty Aśoka put on Jain heads, the full Kunāla legend of the son blinded on a decree sealed with his sleeping father's teeth, and the Buddha releasing Prince Jeta from the precept against liquor."
      status: live
    - num: 34
      zh: "諸國王女部"
      en: "Princesses"
      note: "Complete: 9 stories — a gold-skinned princess whose marriage proposal to the Buddha is torn up unread, Mallikā's camel-skinned daughter transformed the moment she prays, a dog reborn as a princess of Parthia, seven sisters who refuse marriage and out-argue Śakra in a charnel ground, and Mālinī spending her last six days before sacrifice taking the whole court to hear the Dharma."
      status: live
    - num: 35
      zh: "得道長者部上"
      en: "Elders Who Attained the Path, Part 1"
      note: "Complete: 15 stories of householder elders — Yaśas walking out of a house turned graveyard, Śroṇa and the lute-string simile, a hundred-year-old refused ordination by five hundred arhats and then shown six ordinary lives working out their consequences on a sea island, Anāthapiṇḍada at his richest and his poorest, a fire pit and poisoned dinner laid to test the Buddha's omniscience, and two beggars whose opposite wishes are granted the same day."
      status: live
    - num: 36
      zh: "雜行長者部下"
      en: "Elders of Mixed Conduct, Part 2"
      note: "Complete: 19 stories — Jalavāhana borrowing twenty elephants to water ten thousand dying fish, Jyotiṣka's house that outshines the palace, a boy born without ears, eyes, or limbs who inherits because the law recognizes his one feature, a rival teacher who takes the Buddha's congratulatory verse to a house in mourning, a laundry stone still generating merit centuries after its monastery fell, and the aloeswood burned into charcoal."
      status: live
    - num: 37
      zh: "優婆塞部"
      en: "Lay Followers (Upāsakas)"
      note: "Complete: 14 stories, ghosts in eight of them, all turning on the precepts as a standing other beings must respect — Śroṇa Koṭikarṇa walking through a landscape of the dead where two men are blissful by night and eaten alive by day for taking the precepts only half the time, a man-eating ghost fetching the lethal flowers for an innocent man, a cook sentenced to be trampled by elephants, and a hell-king overruling his own officers on a point of jurisdiction."
      status: live
    - num: 38
      zh: "優婆夷部"
      en: "Lay Women (Upāsikās)"
      note: "Complete: 9 stories — Suppiyā cutting flesh from her own thigh for a sick monk (the origin of the rule against eating human flesh), Āmrapālī's four impossible conditions and the parrot over the wall, Sumanā arguing her ten sons out of hunting, the mother sent to beg fire where no one has died, Paṭācārā's day and night, a brahmin widow argued off her own pyre, Nandā's inextinguishable lamp, and a fifteen-year-old who reasons her way out of her betrothal."
      status: live
    - num: 39
      zh: "外道仙人部"
      en: "Heterodox Teachers and Sages"
      note: "Complete: 16 stories — the ninety-six schools traced to one robbed monk hung naked from a tree and the passers-by who each drew a conclusion, the six teachers' scouts, the twin miracle told from Pūraṇa Kāśyapa's side, Kṣāntivādin dismembered, Udraka Rāmaputra's story told twice from two sources, a sage who fathered twelve sons on a tigress, and Ekaśṛṅga ridden into Vārāṇasī by a courtesan."
      status: live
    - num: 40
      zh: "梵志部"
      en: "Brahmins"
      note: "Complete: 12 stories — the Dīpaṃkara prophecy told at length (with the flower-girl's request and the displaced elder's counter-vow), a diagnostic dream of pig-faced kings, Māgandiya offering his daughter, a father who walks to Yama's court and is disowned by his own son, a man who feasts five hundred monks to collect on them as draught animals, a household mistaken for cold, four brothers hiding from death, and the framing and murder of Sundarī."
      status: live
