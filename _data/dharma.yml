# ─────────────────────────────────────────────────────────────
# Single source of truth for the counts shown on the Dharma pages.
# Update the numbers HERE whenever content is added — the Dharma hub
# cards (dharma/index.html) and the section heroes read from this file,
# so they can never drift apart again.
#
# Referenced by:
#   dharma/index.html      — hero pill, Sūtras card, Discourses card, Abhidharma card
#   discourses/index.html  — hero pill
#   abhidharma/index.html  — hero pill
# ─────────────────────────────────────────────────────────────

abhidharma:
  # Live works on /abhidharma/. Abhidharmakośa: all 30 fascicles translated
  # and complete. Mahāvibhāṣā Śāstra: translation underway fascicle by
  # fascicle (1 of 200 done as of 2026-09-02); the rest link to CBETA.
  live_texts: 2

sutras:
  # Distinct live Mahāyāna works on /sutras/ (excludes "coming soon"
  # placeholders). Currently: Heart Sūtra, 大智度論, 瑜伽師地論, 淨行品,
  # 楞嚴經, Master Yuanying's 楞嚴經講義, 解深密經, 因明入正理論,
  # 因明正理門論, 優婆塞戒經 (The Sutra on Upasaka Precepts), and
  # 南山律在家備覽 (Nanshan Vinaya for Laypeople, added here).
  # NOTE: this count is manually maintained and known to lag behind
  # /sutras/index.html in general (several other works — e.g. the Brahma
  # Net Sutra — were added to that page without updating this number).
  # Only incrementing for this session's own addition; a full recount
  # against sutras/index.html is a separate cleanup task.
  live_texts: 12

discourses:
  # Live collections on /discourses/ (MN, DN, AN, SN, Dhammapada,
  # Sutta Nipāta, Udāna, Itivuttaka).
  collections: 8
  # Sum of all live entries across those collections (for reference).
  total_entries: 515

totals:
  # Approximate grand total shown on the Dharma hero ("& counting").
  texts: "500+"
